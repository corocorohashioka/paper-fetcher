or monitoring development targets, emergency responses, and rationally allocating foreign aid. For decades, global food security monitoring relied on the FAO’s prevalence of undernourishment, but this indicator’s fundamental limitations led the FAO to develop the Food Insecurity Experience Scale (FIES) and adopt the unaffordability of the healthy diet. In parallel, The World Bank monitors monetary poverty, arguably a food insecurity indicator in its own right. In this study we assess whether this larger suite of indicators agrees on: (a) which countries are most food insecure; and (b) whether global food insecurity is really deteriorating. Unfortunately, this new mix of methods produces mixed messages. Longstanding criticisms of the prevalence of undernourishment still apply, while rising undernourishment in the past decade is driven by modelled increases in calorie inequality that are inconsistent with income inequality trends. The FIES fares no better: severe FIES food insecurity is higher in several Latin American and Caribbean countries than in extremely food-insecure African countries such as Niger. The World Bank’s poverty and healthy diet affordability monitoring efforts are significantly constrained by systematically fewer household surveys in poorer and more crisis-affected countries. How can this situation be improved? First, experience-based indicators need to be more rigorously evaluated for cross-cultural comparability, and alternatives need to be considered. Second, international agencies and national governments should pool resources to implement coordinated, high-frequency, multi-purpose surveys – focusing on poor and crisis-affected countries – to jointly monitor food insecurity, poverty and malnutrition, as well as their root causes.", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103121", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103121"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103111", "title": "Welfare program participation among US farmworkers", "authors": "Alexandra E. Hill, Sarah C. Whitnall, Elizabeth C.A. Saunders, Timothy K.M. Beatty", "abstract": "This study examines US farmworker participation in social safety net programs, providing the first comprehensive comparison across the National Agricultural Workers Survey, the American Community Survey, and the Current Population Survey. We measure levels, trends, and predictors of farmworker participation rates in six programs: the Supplemental Nutrition Assistance Program (SNAP), the Special Supplemental Nutrition Program for Women, Infants, and Children (WIC), Medicaid, Unemployment Insurance (UI), the National School Lunch and Breakfast Program (NSLP), and the Earned Income Tax Credit (EITC). Across surveys, we find that participation rates among income-eligible farmworker households are consistently highest for Medicaid (71%–79%) and the EITC (75%) and lowest for UI (21%). We evaluate how survey design and data collection methodologies shape these estimates through question wording, farmworker coverage, nonresponse, and measurement error. Comparing across surveys, we identify multiple persistent predictors of participation, including citizenship, gender, age, and educational attainment. These findings inform targeted outreach and policy interventions to enhance participation among US farmworkers and mitigate health and economic disparities.", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103111", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103111"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103136", "title": "Predictable patterns of protest: The impact of agricultural cycles on social unrest in Kenya", "authors": "Nicole Robiro, Sophia Seelos", "abstract": "This paper investigates how the agricultural cycle influences protest behavior in Kenya from 2000 to 2019. Using satellite data to identify the crop cycle and local harvest periods at the lowest available administrative level (wards) and geocoded protest records, we find that protest activity does not decline during the harvest period but increases with a temporal lag. A dynamic difference-in-differences specification shows that protest activity gradually rises in the two to three months following harvest, peaking around the onset of the subsequent agricultural cycle. These patterns are consistent with theories of opportunity costs and seasonal scarcity. While the opportunity costs of protest participation are highest during harvest periods, they decline thereafter and coincide with the lean season, when household food stocks become exhausted. These findings are robust across empirical specifications and contribute to a deeper understanding of the temporal dynamics of unrest in agrarian settings. They also highlight the importance of timing in the design of rural development and conflict prevention policies.", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103136", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103136"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103116", "title": "Strait of Hormuz disruption, fertilizer market transmission, and food policy response", "authors": "Sandro Steinbach, Shawn Arita, Rwit Chakravorty, Jiyeon Kim, Ming Wang", "abstract": "", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103116", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103116"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103133", "title": "Cropland use consequences of a nationwide poverty alleviation relocation program in China", "authors": "Xinyuan Lei, Xiangwen Kong, Huanguang Qiu, Yawen Ding", "abstract": "", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103133", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103133"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103135", "title": "Corrigendum to ”Cost and affordability of recommended diets in Rwanda using [near] real-time market data” [Food Policy 141 (2026) 103085]", "authors": "Rhys Manners, Kate Schneider Lecy, James Warner, Eric Matsiko, Hilda Vasanthakaalam, Gilberthe Benimana, David J. Spielman", "abstract": "", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103135", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103135"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103080", "title": "The effects of U.S. poultry industry consolidation on employee productivity and labor costs", "authors": "Tina L. Saitone, K. Aleks Schaefer, Daniel P. Scheitrum, Shawn Arita, Vince Breneman, Rebecca Nemec Boehm", "abstract": "", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103080", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103080"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103106", "title": "Shrinkflation, unit price disclosure, and consumer welfare: Evidence from canned tuna", "authors": "Xibo Wan, Katherine Harris-Lagoudakis, John M. Crespi", "abstract": "", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103106", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103106"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103144", "title": "Corrigendum to “Shrinkflation, unit price disclosure, and consumer welfare: Evidence from canned tuna” [Food Policy 142 (2026) 103106]", "authors": "Xibo Wan, Katherine Harris-Lagoudakis, John M. Crespi", "abstract": "", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103144", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103144"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103115", "title": "Food price inflation forecasting: Insights from a Macroeconomic Auto-Regressive Random Forest approach", "authors": "William McWilliams, Shamar L. Stewart, Olga Isengildina Massa", "abstract": "", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103115", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103115"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103069", "title": "Philanthropic food assistance in high-income countries: Lessons from Israel’s food-aid network", "authors": "Moran Accos, Orly Tamir, Aron M. Troen", "abstract": "Food insecurity (FI) in high-income countries (HICs) is increasingly addressed by philanthropic food-aid organizations that operate with limited state oversight. Such is the case in Israel, a high-income country that faces persistent FI and social inequality, but has never conducted a comprehensive mapping of its philanthropic food-aid network. This study is the first national-level analysis of food-aid NGOs in Israel. We evaluated their distribution, purpose, scale, and alignment with need, using administrative data from Guidestar, Israel’s official NGO database, and from the country’s two largest food banks. We analyze the system through the lenses of effectiveness, equity, and efficiency – the three key dimensions used globally to assess food-aid systems. We identified 2289 active food-aid NGOs, with exponential growth over the past two decades. Most organizations operate locally, provide in-kind food rather than vouchers, and serve the general public rather than specific target groups. The majority are affiliated with the Jewish religious sector, while Arab communities, despite significantly higher rates of FI, remain underrepresented. Geographic disparities are evident, with major gaps in low-resource regions, particularly among Bedouin populations in the south. Financial and volunteer investment in the sector is substantial. Little data is available concerning the extent to which the network ensures effectiveness, efficiency, and equity. Thus, our study raises critical questions about the expanding role of private actors and their ability to fulfill public welfare functions in Israel. Moreover, it contributes empirical evidence to an ongoing global debate about whether philanthropic food-aid networks complement or actually displace state responsibilities. We highlight the need for high-income welfare states to assume responsibility for regulation, transparency, and strategic integration of food-aid systems into broader food and social policy frameworks.", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103069", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103069"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103142", "title": "Framing local food and food heritage in European Union food policy", "authors": "Weronika Karsznia, Marta Derek, Peter H. Feindt", "abstract": "", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103142", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103142"}, {"source": "crossref", "source_id": "10.1002/ajae.v108.4", "title": "", "authors": "", "abstract": "", "journal": "American Journal of Agricultural Economics", "published": "2026-08-01", "url": "https://doi.org/10.1002/ajae.v108.4", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/ajae.v108.4"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70135", "title": "Where the Heart Finds Peace, There Is My Home: Changes in Social Status in the Poverty Alleviation Relocation Programme", "authors": "Zhao Guoxiong, Boyu Jin, Biao Ma, Chen Zhang", "abstract": "ABSTRACT Poverty alleviation relocation is an important component of China's anti‐poverty strategy and has reshaped relocated households' living conditions and social integration. Using the Poverty Alleviation Relocation Programme (PARP) as a quasi‐natural experiment, this study examines the impact of relocation on households' social status based on four‐wave panel data from 1351 households. The results show that relocation significantly improves subjective social status, whereas its effect on objective social status is insignificant. The positive effect is more pronounced among young adults aged 18–44, elderly individuals aged 60 and above, households with lower educational attainment, and those resettled in rural areas. Mechanism analysis suggests that social network expansion and improved life satisfaction are important channels through which relocation enhances perceived social standing. The findings also reveal a significant increase in conspicuous consumption after relocation, suggesting stronger aspirations for upward mobility among relocated households. By extending the analysis from material welfare to the social dimensions of relocation, this study provides new evidence on the social consequences of poverty alleviation relocation and offers implications for subsequent support policies.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-31", "url": "https://doi.org/10.1111/1467-8489.70135", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70135"}, {"source": "crossref", "source_id": "10.1002/aepp.70122", "title": "The Cow or the Credit: Causal Relationship Between California Dairy Herd Consolidation and Anaerobic Digesters", "authors": "Michael McCullough, Jarrett Hart", "abstract": "ABSTRACT The California dairy industry has experienced considerable consolidation over the past 30 years. During this period, there has also been substantial technological innovation, implementation of the state's Low Carbon Fuel Standard program, and rapid adoption of anaerobic digesters. This apparent correlation has fueled concerns that anaerobic digesters are causing consolidation. We test for a causal relationship between digesters and consolidation using synthetic differences‐in‐differences. Our findings dispute the theory that digesters are causing consolidation.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-31", "url": "https://doi.org/10.1002/aepp.70122", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70122"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_1/_article/-char/ja/", "title": "換地選定のメカニズムデザイン", "authors": "中嶋 晋作", "abstract": "Fragmented farmland ownership impedes mechanization and productivity and thus has been a major challenge in Japanese agriculture. Farmland consolidation, aimed at improving land use efficiency, has been a cornerstone of Japan’s agricultural policy. In farmland improvement, as farmland plot size increases, small dispersed farm plots by each farmer are consolidated through replotting. In the replotting process, farmer assignment to a plot is determined mainly by farmers’ discussion in the region. However, achieving consensus is not easy compared with a market mechanism based on individual and decentralized decision-making of resource allocation due to conflicting farmers’ interests. Considering these problems, the study employed the mechanism design method of matching game theory and a multi-agent simulation to develop and propose an improved farmland replotting protocol to achieve replotting easily for farmland improvement. The simulation modeled an agricultural village comprising 25 farmers and 324 plots, reducing the latter to 81 plots after consolidation. Multiple scenarios involving varying farmer preferences and plot distributions were tested to ascertain each mechanism’s performance based on the consolidation rate, original land’s inheritance rate, and welfare (sum of the ranks of the farmers and plots in the final assignment). Simulation results showed that the deferred acceptance (DA) algorithm satisfies both stability and strategy-proofness for farmers. While it achieves a lower consolidation rate than the current mother farmland replotting method, it performs better in terms of the inheritance rate of original plots and sum of the ranks of the farmers and plots in the final assignment. Therefore, the DA algorithm can be regarded as an effective mechanism for the replotting method.", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_1/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_1/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_104/_article/-char/ja/", "title": "「5年水張りルール」下における水田利用の地域動向と畑地化経営の特徴", "authors": "髙橋 成弥", "abstract": "This study examines regional trends in paddy field utilization and characteristics of farms opting out of direct payment grant eligibility by reclassifying as upland under Japan’s “Five-Year Flooding Rule”—requiring paddy fields to be flooded at least once every five years to maintain grant eligibility—using Kuriyama Town, Hokkaido, as a case study. Analysis of 30 agricultural districts revealed that reclassification rates were highest (53.7%) where paddy field proportions were low, infrastructure improvements had not been implemented, and large-scale farms existed. Case studies revealed that farms chose reclassification based on: (1) established crop rotation systems and (2) completed machinery investments with reduced debt repayment pressure, leading to phased reclassification applications. The rule produced disorderly mosaic reclassification patterns lacking spatial coordination. Furthermore, mid-term rule revocation created confusion over whether to proceed with or withdraw planned reclassifications, further complicating the situation.", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_104/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_104/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_11/_article/-char/ja/", "title": "立毛勘定および未販売農産物勘定の経過勘定的処理に関する一考察", "authors": "香川 文庸", "abstract": "In economic entities, the production and accounting periods often do not coincide. In addition, not all products are sold during the accounting period. As a result, many products are unfinished or unsold at the end of the accounting period. In industry bookkeeping, these products are often treated as inventories. Even in agricultural business entities, unharvested and unsold agricultural products also remain at the end of the accounting period. However, recent agricultural bookkeeping studies have proposed accounting treatments for these products that differ from those used in industry bookkeeping. Many previous studies have proposed decomposing the value of unharvested and unsold agricultural products at the beginning of the next accounting period and transferring them to cost accounts. Therefore, unharvested and unsold agricultural product accounts are classified as deferred and accrued accounts. This study aims to examine the appropriateness of these special accounting treatments. The main results are as follows: 1. Carrying over the valuation of unharvested and unsold agricultural products to the next accounting period is a natural way to match revenues and expenses. However, the principle of matching revenues and expenses is not a rational logic for re-decomposing and re-transferring the value of unharvested and unsold agricultural products. 2. Unharvested and unsold agricultural products are clearly inventories and considering them as prepaid expenses or receivables has no theoretical basis. 3. Treating unharvested and unsold agricultural product accounts as deferred and accrued accounts has no practical effect, and production costs may not be accurately measured. 4. The system of agricultural bookkeeping has remained underdeveloped, warranting the more appropriate system.", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_11/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_11/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_110/_article/-char/ja/", "title": "水田中干し延長におけるJ-クレジット制度およびICTの活用可能性", "authors": "藤井 清佳", "abstract": "Extending the mid-summer drainage period in rice cultivation is one of the methodologies under the J-Credit scheme. To prove the legitimacy of their activities, farmers must create farming records, however, this requires additional labor. This study calculated the balance of costs and benefits of installing irrigation devices with information and communications technologies (ICT) to address this issue. Calculations of income from the J-Credit scheme, the cost of introducing irrigation devices with ICT, and the cost-reduction effect revealed that costs could be offset by 15% to 44%. In this case, the benefits could sufficiently offset the costs. Under the J-Credit scheme, farmers for whom it is appropriate to implement an extended mid-summer drainage period using ICT irrigation devices include (1) rice farmers cultivating large-scale paddy fields, (2) farmers who spend considerable time on water management, and (3) farmers in areas with high baseline emissions.", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_110/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_110/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_116/_article/-char/ja/", "title": "集落営農法人の合併におけるステークホルダーの利害関係と影響力", "authors": "常陰 崇生", "abstract": "The merger of community farms is expected to become an increasingly significant strategy for addressing the shortage of farm successors and sustaining regional agriculture. Nevertheless, the merger process is recognized a major impediment to successful mergers and there is a paucity of research specifically focused on community farms. To address this gap, this study analyzes merger negotiations by drawing on meeting minutes, conducts a stakeholder analysis focusing on stakeholders’ interests and influence, and examines the coordination of interests required to achieve consensus. The findings suggest that successful agreement requires both the acceptance of potential disadvantages to members arising from changes in management strategy and the prioritization of younger employees’ perspectives.", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_116/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_116/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_122/_article/-char/ja/", "title": "山田隆一　著『国際協力と実践的農学―アジアとアフリカの現場経験に基づいて―』", "authors": "羽佐田 勝美", "abstract": "", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_122/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_122/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_124/_article/-char/ja/", "title": "大山利男　編著『有機食品市場の構造分析―日本と欧米の現状を探る―』", "authors": "水木 麻人", "abstract": "", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_124/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_124/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_25/_article/-char/ja/", "title": "農業経営管理に用いる標準値としての鐘形頻度最頻値の適合性についての検討", "authors": "平泉 光一", "abstract": "Standard values for production indices, such as yield and labor hours, must be set in advance when setting the standard costs for cost control of agricultural products and planning production plans for the PDCA cycle for progress control. Standard production indices are the true values that can be achieved with normal efforts under specific production conditions, excluding random fluctuations. Standard agriculture values are obtained from representative values of past performance data. Production index distribution is not symmetrical and likely to contain outliers. Existing studies have assumed that the mode, which is positioned as typical or normal, is more appropriate than the mean, trimmed mean, and median as the representative value for obtaining standard values. In this study, we adopted the bell-form frequency mode and examined the validity of this assumption based on data. Accordingly, we compared the prediction errors of each representative value for rice and soybean yields for each of the past 30 years with the normal year yield for each year. The predicted values were representative values of the time series data for the past 6, 8, and 10 years, excluding the predicted year. For error measurement, the expected error value （error bias） and the average of the absolute error values (error scatter) were employed. As a result, in the data examined, the error of the mode’s predicted value was often the smallest. Therefore, the mode is a better fit as a standard value than the mean, trimmed mean, and median.", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_25/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_25/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_34/_article/-char/ja/", "title": "牧草サイレージ広域流通の経済性", "authors": "濱村 寿史", "abstract": "This paper clarifies the challenges and economy of the wide-area distribution of grass silage. The main conclusions are as follows: The wide-area distribution of grass silage in Hokkaido’s dairy farming areas is most likely to succeed when surplus grass silage is sold within a day-trip range. In contrast, gaining profit outside of the day-trip range can be difficult unless selling certain high-quality silage. Thus, based on current production costs and transportation fees, the wide-area distribution of grass silage is unlikely to expand between the northern Hokkaido grassland-based dairy farming area and the upland farming area. Therefore, improving yield and addressing unbalanced transport are necessary to reduce production and transportation costs, respectively.", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_34/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_34/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_40/_article/-char/ja/", "title": "「酪農危機」下の家族経営における所得下落の要因分析", "authors": "平石 学", "abstract": "In recent years, dairy farm income has declined due to rising input costs and reduced milk production under government policy. This paper examines income decline in family dairy farms during the resulting “dairy crisis.” First, there is no clear difference in the degree of income decline by farm size; high-performing farms that maintain income are observed across all size categories. Second, no significant correlation is found between management stability indicators (e.g., feed cost ÷ milk sold) and the rate of income decline. Third, the primary drivers of income decline vary by farm size: for small farms, rising feed costs and reduced production volume are central, whereas for large farms, increases in non-feed variable costs and fixed costs are more influential. As farm size increases, cost management becomes increasingly critical.", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_40/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_40/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_47/_article/-char/ja/", "title": "農協系統組織のコメ安定供給機能の評価", "authors": "吉田 健人", "abstract": "This study clarifies how agricultural cooperatives and wholesalers contribute to Japan’s stable rice supply. Rice prices in Japan have been soaring, drawing increased attention to rice sales by agricultural cooperatives. Three key findings emerged from interviews with Zen-Noh’s central office, its Niigata and Miyagi prefectural branches, and wholesalers. First, advanced contracts between Zen-Noh and wholesalers help to secure supply and sales channels. Second, Zen-Noh ’s provisional payment system considers consumer prices while also considering the price necessary for farmers to continue production. Third, multiyear contracts help to ensure long-term supply stability in collaboration with wholesalers. Through these mechanisms, agricultural cooperatives fulfill their role in stabilizing rice supply. However, these findings indicate a trade-off between keeping the collection rate and stabilizing the price level.", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_47/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_47/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_53/_article/-char/ja/", "title": "民間企業による援農ボランティア制度の仕組みづくりと持続性", "authors": "濱田 紗希", "abstract": "This study clarifies the key elements of a farm volunteer–matching system operated by a private, non-agricultural company and the conditions for its sustainability. We conduct a case study of Daihatsu Motor Co., Ltd.’s “Nouen Musubi” project, based on interviews with the company’s project managers and representatives from five participating corporate farms. The project has secured sufficient motivated volunteers while effectively reducing the burden on participating farms. Key factors include strategic social networking service promotion, appropriate participation fees, a well-designed matching system, and careful farm selection. Regarding sustainability, major challenges include maintaining a stable supply of high-quality volunteers and setting a matching fee that balances company profitability with farm cost constraints.", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_53/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_53/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_60/_article/-char/ja/", "title": "水田輪作推進下における水稲作と田畑輪換の地域的特徴", "authors": "小松 知未", "abstract": "Areas where paddy field rotation is promoted have the following regional characteristics. First, trends in paddy field rice cultivation during normal times show that paddy field rice production across the region decreased because farmers abandoned farming. A shift from staple to non-staple food rice was also noted. Second, trends in paddy field rotation demonstrate a gradual increase in the area of restored paddy fields and variations in paddy field rotation. During periods of drastic change, the area of restored paddy field rotation increased sharply, and direct seeding of feed rice and rice for WCS in restored fields increased. A certain number of agricultural managements are expected to continue to choose management actions in response to the external environment, changing paddy field area, field layout, uses, and sowing methods.", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_60/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_60/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_66/_article/-char/ja/", "title": "地域金融機関におけるサステナブルファイナンス戦略と農業融資の実態", "authors": "犬田 剛", "abstract": "This study examines the relationship between sustainable finance commitments and agricultural lending among 417 Japanese regional financial institutions. The research uses Tobit regression to identify a clear functional differentiation: credit cooperatives lead in direct lending, whereas local banks focus on non-financial SF support. Significantly, the results demonstrate that commitment to Sustainable Development Goal 12 (“Responsible Consumption and Production”) positively influences agricultural loan shares, even after controlling for regional agricultural scale. This finding indicates that SF strategies act as proactive mechanisms rather than passive responses to local environments. Moreover, the results suggest that SF goals provide a framework for enhancing business-based evaluation and mitigating information asymmetry inherent in agricultural finance. Consequently, SF commitments serve as a strategic “lens,” helping institutions identify sustainable farm businesses and facilitate credit allocation within a niche sector traditionally perceived as high-risk.", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_66/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_66/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_72/_article/-char/ja/", "title": "下水汚泥肥料の利用状況と生産者意識", "authors": "大學 寛和", "abstract": "Japan relies heavily on imported raw materials for chemical fertilizers, highlighting the strategic importance of utilizing domestically available resources, such as sewage sludge. Despite its potential as a sustainable fertilizer alternative, the use of sewage sludge fertilizer remains limited. This study examines current utilization and perceptions of agricultural producers through a nationwide survey of agricultural corporations, revealing that approximately 30% of respondents expressed a positive attitude toward its use; however, nearly half reported no specific opinion, suggesting insufficient information. The study concludes that providing producers with relevant and practical information to assess the applicability of sewage sludge fertilizer within their operations is a critical initial step toward promoting its broader adoption.", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_72/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_72/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_79/_article/-char/ja/", "title": "人事評価制度が雇用型農業法人の従業員に及ぼす影響", "authors": "青山 浩子", "abstract": "Agricultural corporations are increasingly utilizing performance appraisal systems to cultivate outstanding talent. Appraisal results can significantly impact employee motivation and work ethic; therefore, employees must perceive and accept the results as fair. This paper conducted a satisfaction survey, targeting regular employees at agricultural corporations that implement performance appraisal systems. A similar satisfaction survey was conducted at the same corporations in 2019, and comparisons revealed that in 2025, overall satisfaction increased; however, satisfaction with the performance appraisal system varied by employee attributes. Employees satisfied with the system were younger Japanese male employees with shorter tenures. Agricultural corporations are industries that broadly accept diverse talent, including older workers and women; therefore, it is important to develop a work environment that enhances employee motivation across diverse attributes, thereby increasing overall satisfaction within the corporation.", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_79/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_79/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_85/_article/-char/ja/", "title": "酪農経営における常勤従業員の職務満足の特徴", "authors": "後藤 寛満", "abstract": "This study aims to clarify the characteristics of job satisfaction among dairy farm employees, focusing on farm scale and organizational structure. The main outcomes are as follows. First, variances in workforce size lead to different organizational structures—large farms have formal departments that small farms lack. Second, these structural differences affect job content. On large farms, employee roles are specialized and divided; in contrast, on small farms, employees perform multiple tasks. Third, these differences are associated with different drivers of job satisfaction. On large farms, satisfaction depends more on wages, labor hours, working conditions, and opportunities for skill development. On small farms, it depends more on human relations and clear roles. In particular, on small, non-departmental farms where each person has multiple tasks, managers should clarify roles, responsibilities, and decision-making authority, and pay close attention to workplace relationships.", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_85/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_85/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_91/_article/-char/ja/", "title": "貸農園・体験農園の基本的属性と経営特性", "authors": "櫻井 清一", "abstract": "This paper examines the basic attributes and management characteristics of farms that manage allotments and experience gardens. The research is based on individual data from the 2020 agricultural census. In total, 1,533 farms engage in allotment or experience gardens; about half are located in urban areas, whereas others are in mountainous areas. Many farms mainly grow horticultural products, whereas a quarter mainly grow paddy crops. About 30 percent of farms sell over 1 million JPY or produce through allotment/experience garden management. Moreover, most agricultural laborers engage in both agricultural production and agro-related business, and some tend to overwork.", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_91/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_91/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_97/_article/-char/ja/", "title": "有機農業への新規参入に適した地域環境の解明", "authors": "上田 初紀", "abstract": "Organic farming has attracted increasing attention as an environmentally sustainable form of agriculture, and its diffusion has become an important issue. New entrants into the industry play a vital role in promoting organic farming. However, many challenges exist for those entering organic farming and regional support systems and organic farm networks can help new entrants remain. However, prior research has mainly highlighted individual factors, and the broader regional conditions that facilitate new entry remain unclear. To clarify these factors, the present study conducted field surveys in Hyogo, a region recognized as a national leader in organic farming. The key factors facilitating the engagement of new entrants were networks with other organic farmers, producer-driven promotional activities, and educational institutions providing instruction in organic farming.", "journal": "農業経営研究", "published": "2026-07-31", "url": "https://www.jstage.jst.go.jp/article/fmsj/64/2/64_97/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/fmsj/64/2/64_97/_article/-char/ja/"}, {"source": "crossref", "source_id": "10.1111/agec.70136", "title": "Farm Size, Technical Efficiency, and Environmental Performance: Evidence From Rice Production in China", "authors": "Bin Lin, Xiaoxi Wang, Bernhard Dalheimer, Bernhard Brümmer", "abstract": "ABSTRACT Farm size, as well as technical and environmental efficiency in agriculture, is key to food security and sustainable development. However, empirical evidence about how heterogeneity across farm sizes is associated with the joint production of desirable outputs and undesirable by‐products remains limited, preventing our understanding of technical and environmental efficiency. Using country‐representative survey data on rice production in China from 2014 to 2018, we estimate farm‐level technical and environmental efficiency by employing a by‐production function combined with a stochastic meta‐frontier approach, accounting for heterogeneous technology across farm sizes. Our findings reveal considerable room to improve both technical and environmental performance, and the extent of both differs markedly by farm size. Medium‐sized farms (2–6.67 ha) exhibit the highest meta‐frontier technical efficiency, whereas large farms (6.67–33.33 ha) achieve the highest meta‐frontier environmental efficiency. The estimated shadow prices indicate that the mean marginal abatement cost of nitrogen pollution is 129.233 yuan/kg. We also identify a range of farm‐scale factors, such as technical training, land consolidation, higher educational attainment, and cooperative membership, which are significantly associated with higher levels of technical and environmental efficiency in rice farming. Counterfactual simulations further indicate that combining farm‐size‐specific measures could enhance meta‐frontier technical and environmental efficiency. In particular, cooperative participation is positively associated with technical and environmental performance among smallholders, while high‐level education and technical training are more impactful at large farms. Land fragmentation is consistently associated with lower efficiency and wider technology gaps across farm sizes. Our findings underscore the importance of designing farm‐size‐specific policies and implementing integrated interventions in promoting sustainable agricultural development.", "journal": "Agricultural Economics", "published": "2026-07-30", "url": "https://doi.org/10.1111/agec.70136", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70136"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70148", "title": "What Is the Probability That the Environmentally Conscious Are Willing to Pay Higher Taxes and Higher Prices to Protect the Environment? Recent Evidence for the United States", "authors": "Steven T. Yen, Ernest M. Zampelli", "abstract": "ABSTRACT Americans across the country are plagued with harmful effects from air and water pollution, resource depletion, land degradation, biodiversity loss and climate change. Protecting the natural environment, ecosystems and humans from these effects will demand substantive changes in production methods, delivery processes and consumption patterns. Amassing resources to effect such changes will likely require both higher taxes and prices. Currently, the literature offers little in the way of estimating or identifying the factors important in determining the public's willingness to pay both higher taxes and higher prices, in principle, for environmental protection. This paper is a first attempt to fill this gap. Using data from the United States 2021 General Social Survey, we estimate a bivariate ordered probit model, enabling us to calculate average marginal effects on and average predicted probabilities of the willingness to pay both higher taxes and higher prices to protect the environment. Without considerable and widespread changes in attitudes and beliefs, results suggest that there is little chance that a majority of Americans will support higher prices, a smaller chance of a majority supporting higher taxes and a still smaller chance that a majority will support both higher taxes and higher prices for environmental protection.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-29", "url": "https://doi.org/10.1111/1467-8489.70148", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70148"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70129", "title": "How Drivers in a Rentier State Respond to Fuel Price Shocks: High‐Frequency Evidence From Kuwait's Subsidy Reform", "authors": "Shamlan Waleed Albahar", "abstract": "ABSTRACT Fuel subsidies in resource‐rich economies distort consumption and undermine fiscal efficiency. This study exploits Kuwait's 2016 gasoline (petrol) price reform—which raised prices by up to 83% after nearly two decades of price stability—to estimate short‐run price elasticity and analyse consumer behavioural responses under entrenched subsidies. Using high‐frequency, station‐level daily gasoline sales data and traffic data combined with Regression Discontinuity in Time (RDiT) designs, the study causally identifies the reform's impact on gasoline demand. Mechanism analyses evaluate substitution across octane grades, driving behaviour, public transport use and extensive‐margin responses such as vehicle ownership or efficiency. Contrary to the literature documenting limited price responsiveness in subsidy‐heavy rentier states, the reform produced a sharp and immediate drop in fuel consumption, with a short‐run price elasticity of approximately −0.45. The dominant response was intra‐product substitution, as consumers persistently shifted from octane 95 to 91. Driving reductions were modest; public transit use and extensive‐margin adjustments were negligible. High‐octane (98) users showed near‐zero responsiveness. By raising prices, the reform likely reduced the estimated KD 7 million (US$24 million) in pre‐reform waste as drivers switched to suitable, cheaper fuel. The reform also reduced deadweight loss by over KD 55 million (US$179 million) annually, with total welfare gains—accounting for externalities—reaching up to KD 97 million (US$312 million) annually. This study shows price reforms in rentier states can yield substantial efficiency and welfare gains, but require complementary policies to address informational frictions and limited substitution options.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-29", "url": "https://doi.org/10.1111/1467-8489.70129", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70129"}, {"source": "crossref", "source_id": "10.1002/aepp.70119", "title": "Complementary or Competitive? Emerging Interactions Between Restoration and Protection in the Conservation Reserve Program", "authors": "Wesley Zebrowski, Tyler Lark, Rich Iovanna", "abstract": "ABSTRACT The USDA's Conservation Reserve Program (CRP) delivers environmental benefits to society by enrolling cropland and grasslands to reestablish or safeguard long‐term vegetative cover. In recent years, the CRP has dramatically increased grassland enrollment while cropland enrollment has been in steady decline. This paper uses descriptive analysis, multivariate regression analysis, and a spatial comparison of participant incentives to assess the relationship between these two CRP signup types. We argue that while these two programs do not compete administratively under current trends, these enrollment patterns could tighten competition between the programs in future periods if total enrollment approaches a shared cap.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-29", "url": "https://doi.org/10.1002/aepp.70119", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70119"}, {"source": "crossref", "source_id": "10.1111/1477-9552.70063", "title": "Planning Crop–Livestock Integration With Social Norms: A Bio‐Economic Model Balancing Circularity and Farmer Welfare", "authors": "Matteo Bruno Ricozzi, Argyris Kanellopoulos, Jaap Sok, Sander de Leeuw", "abstract": "ABSTRACT Regional crop‐livestock integration can reduce dependence on external inputs and improve circularity, but its implementation requires coordination across heterogeneous farms and may generate uneven welfare losses due to technical, economic and behavioural factors, including social norms and peer effects. This study develops a landscape bio‐economic model that integrates heterogeneous farmer preferences, farm‐level constraints and social coordination via social norms and peer networks. Applied to a Dutch case study, the model identifies, from a social planner perspective, coordinated integration strategies that optimise feed and manure exchanges between arable and dairy farms. We show that optimising farm‐to‐farm integration can reduce total nitrogen import by up to 20% with limited losses of farmer welfare relative to the unconstrained welfare‐maximising solution. The model estimates farm‐specific willingness‐to‐accept imposed circularity targets, accounting for losses across economic and non‐economic utility attributes, including social norm conformity. Willingness‐to‐accept increases non‐linearly as nitrogen reduction targets become more stringent, with the burden initially borne mainly by sustainability‐oriented and dairy farms, while extending to arable and conventional farms only at very ambitious targets. We also find that stronger preferences for social norm conformity can ease trade‐offs between farmer welfare and circularity and are associated with greater reliance on local feed exchange and a reduced role for manure exchange, indicating that social influence is practice‐specific. These results motivate targeted and phased policy programmes combined with coordination incentives.", "journal": "Journal of Agricultural Economics", "published": "2026-07-28", "url": "https://doi.org/10.1111/1477-9552.70063", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1477-9552.70063"}, {"source": "crossref", "source_id": "10.1111/1477-9552.70064", "title": "Reflections on Adoption of New Agricultural Practices", "authors": "David J. Pannell", "abstract": "ABSTRACT Research on adoption of new practices, technologies and systems in agriculture has generated thousands of publications over the past 70 years, covering uptake of agricultural practices spanning more than 100 years. This paper contains selected key lessons from the results of this enormous research effort, drawn from numerous reviews of the literature and shaped by personal experience. The lessons include that trialling is not adoption, that extension is not necessarily the key to increasing adoption, that each new farming practice has its own adoption story, and that adoption is often slower than practice advocates expect, typically taking multiple decades. The identified lessons are juxtaposed with a number of flawed assumptions and misconceptions commonly held by people working in agricultural agencies. A number of methodological weaknesses are still common in existing studies, including neglect or poor representation of key variables, compromising the potential for the research to generate real understanding of adoption. This also inhibits comparison of studies and the application of meta‐analyses. Suggestions are made on ways to add value to the existing research and improve the quality of future research, including the collection and curation of good‐quality adoption data sets, the development of a searchable database of adoption studies, and the creation of best‐practice guidelines for the conduct of adoption research.", "journal": "Journal of Agricultural Economics", "published": "2026-07-28", "url": "https://doi.org/10.1111/1477-9552.70064", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1477-9552.70064"}, {"source": "crossref", "source_id": "10.1111/agec.70139", "title": "Correction to “Online Benefit Redemption and SNAP Participation: Evidence From the SNAP Online Purchasing Pilot”", "authors": "", "abstract": "", "journal": "Agricultural Economics", "published": "2026-07-27", "url": "https://doi.org/10.1111/agec.70139", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70139"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70131", "title": "Environmental Reforms to Secure Intergenerational Justice: An Edited Extract from the Address to the 2026 AARES Conference, Adelaide", "authors": "Ken Henry", "abstract": "ABSTRACT Australia's natural environment has been devastated by decades of land clearing, habitat destruction, invasive species and climate change—and the economics discipline has largely looked the other way. In November 2025, the Australian Parliament passed landmark amendments to the Environmental Protection and Biodiversity Conservation (EPBC) Act. These reforms are a game‐changer—but they are just a start. Restoration at scale must follow, properly funded and integrated with climate policy; anything less is a betrayal of future generations. Rebuilding natural capital is not a discretionary amenity. For this and every subsequent generation of Australians, it is a matter of survival.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-27", "url": "https://doi.org/10.1111/1467-8489.70131", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70131"}, {"source": "crossref", "source_id": "10.1002/aepp.70118", "title": "Ex‐Ante Assessment of Farm Resilience to Institutional Shocks: A Modeling Approach", "authors": "Nadja El Benni, Gabriele Mack", "abstract": "ABSTRACT Using the agent‐based model SWISSland, we simulate farm‐level responses and interactions under two institutional shocks: tariff reductions and direct payment reductions. Using a framework we developed, we assess resilience capacities, resilience attributes, and the provision of private and public goods, following the shock. Results indicate that valley farms are vulnerable to tariff reductions and mountain farms to direct payment reductions. Payment cuts cause minor changes in private and public goods provision, while tariff reductions reduce provision levels. It shows that different shocks require different resilience attributes, underscoring the need for ex‐ante resilience assessments to develop targeted measures strengthening farm resilience.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-26", "url": "https://doi.org/10.1002/aepp.70118", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70118"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70143", "title": "Forces Behind South Australia's Unusual Structural Changes Since 1840", "authors": "Kym Anderson", "abstract": "ABSTRACT The agricultural sector's share of GDP in growing economies typically declines but, for a century from the early 1850s, Australia's did not. That trend is most evident for the former colony and now State of South Australia (SA). Moreover, that share for SA has been almost flat since 1980 as well, along with the agricultural sector's share of SA exports. This paper seeks to shed light on the forces behind the unusual evolution of these sectoral shares for SA both up to 1950 and since 1980. The extensive time series data compiled for this paper suggest various partial explanations. For 1850–1950, they include the huge arable land area per worker, clearly defined and enforced property rights in settled rural areas as the frontier of European settlement expanded, the absence of a need to do any processing of the main 19th century exports (copper, wool and wheat), a strong public agricultural research and extension system, and the absence of major mining booms after the copper finds in the 1840s and 1860s.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-25", "url": "https://doi.org/10.1111/1467-8489.70143", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70143"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70145", "title": "Beyond Productivity: Technology Adoption and Factor Allocation in Agriculture", "authors": "Ricardo Troncoso Sepúlveda, Juan Cabas Monje, Juan Jiménez Cortés", "abstract": "ABSTRACT This paper examines the causal impact of agronomic technology adoption, induced by technical assistance programmes, on factor misallocation and aggregate agricultural productivity. While the literature has established the central role of land and capital market imperfections as sources of misallocation in agriculture, the potential of technological adoption to correct these inefficiencies has received limited attention. This paper directly addresses this gap by combining a calibrated equilibrium model with causal inference methods, using Chile as a case study. The results show that, among farmers whose adoption is induced by access to technical assistance programmes, factor misallocation is reduced by approximately 22 percentage points. This effect is robust across alternative efficiency measures, functional specifications and parametric assumptions, and remains stable after purging idiosyncratic productivity from agroclimatic conditions such as rainfall and soil quality. Technological adoption significantly increases participation in land rental markets and access to bank credit, thereby facilitating the reallocation of resources towards more productive farmers. In addition, the analysis identifies local spillover effects: farmers in municipalities with higher adoption rates exhibit lower misallocation. Counterfactual exercises further indicate that these effects are amplified when frictions in land markets are reduced.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-25", "url": "https://doi.org/10.1111/1467-8489.70145", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70145"}, {"source": "crossref", "source_id": "10.1002/aepp.70120", "title": "Expanded Farm Safety Net Payments Under the One Big Beautiful Bill Act", "authors": "Oranuch Wongpiyabovorn, Tayatorn Pongspikul, Alejandro Plastina, Anup Paudel, Chandan Bhattarai, Jennifer Ifft", "abstract": "ABSTRACT The One Big Beautiful Bill Act (OBBBA) strengthens the agricultural risk coverage (ARC) and price loss coverage (PLC) programs by aligning program parameters more closely with recent market dynamics and allows for an expansion in program acres. This study projects the increases in ARC‐County and PLC payments for corn, soybeans, and wheat under OBBBA, compared with those under the 2018 Farm Bill. Total projected program payments would increase by $4.65 billion for crop year 2025 and $1.30–$2.13 billion for crop year 2026 (depending on the relative enrollment rates), with high regional heterogeneity. JEL Classification: Q14, Q18", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-25", "url": "https://doi.org/10.1002/aepp.70120", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70120"}, {"source": "crossref", "source_id": "10.1002/aepp.70117", "title": "Drought, Structural Breaks, and the Economics of Public Land Grazing: Evidence From the Intermountain West", "authors": "Zuyi Wang, Man‐Keun Kim, Hernan A. Tejeda, Thomas R. Harris", "abstract": "ABSTRACT This study investigates the decline in Bureau of Land Management (BLM) grazing allotments, authorized Animal Unit Months, across eight Intermountain states (Arizona, Colorado, Idaho, Montana, Nevada, New Mexico, Utah, Wyoming) from 1980 to 2022, examining the role of drought and structural change. Using outlier detection and structural break tests, we identify a concentrated regime shift in the early 2000s, with seven of eight states experiencing a statistically significant break between 2000 and 2003. Post‐break allotments declined by 11% regionally, ranging from 8% in New Mexico to 27% in Colorado. Outlier analysis reveals substantial heterogeneity in the nature of shocks, with Idaho and Utah experiencing permanent level shifts, Colorado a temporary change, and Wyoming multiple shocks of all types. To quantify drought impacts, we estimate a fixed effects model with a lagged dependent variable and a state‐specific structural break dummy. Results show that a one‐unit decrease in the Palmer Drought Severity Index (PDSI) reduces allotments by 0.5% immediately and by 3.6% in the long run under sustained drought. The break dummy is negative and highly significant, indicating a permanent 6.5% reduction in allotments following the early 2000s drought that is not explained by drought or market variables alone. This suggests that factors beyond drought have reduced grazing capacity. A sustained severe drought (three‐unit PDSI decrease) would permanently remove approximately 893,000 Animal Unit Months (AUMs) annually from the region, equivalent to 149,000–179,000 cow‐calf pairs and representing between $9 million and $27 million in lost forage value at private lease rates. These findings support reforms to drought relief programs to account for lagged and permanent effects, flexible permitting mechanisms for temporary drought, and long‐term adjustment assistance for permanent reductions. State‐specific heterogeneity in drought impacts implies that, while BLM already administers grazing at state and district levels, further differentiation of drought relief and permit flexibility based on state‐level vulnerabilities may improve effectiveness.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-25", "url": "https://doi.org/10.1002/aepp.70117", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70117"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70144", "title": "Relocation and Educational Attainment: Evidence From China's Poverty Alleviation Programme", "authors": "Junqiao Hong, Zelin Qiu, Xiaorui Qu, Yao Tang", "abstract": "ABSTRACT As a core component of human capital, education plays a pivotal role in shaping labour productivity. In remote and impoverished rural areas, limited access to post‐compulsory education creates a self‐perpetuating cycle of low education, low productivity, and entrenched poverty. Using data from China's Poverty Alleviation Through Relocation programme, this study examines the impact of relocation on children's post‐compulsory education, measured by high school enrolment. Employing a two‐way fixed effects model, we find that relocation increases the probability of high school enrolment by approximately 8.6 percentage points, with results robust to household controls and propensity score matching. Mechanism analysis provides suggestive evidence that these gains are associated with improved school accessibility, higher household income and increased educational investment. The effects are heterogeneous: educational gains are concentrated among male children and those in households with lower‐educated and older heads, are primarily driven by rural relocation, and increase with the duration since resettlement. The findings highlight both the potential and uneven distribution of human capital gains from relocation policies, providing important insights for targeted post‐relocation educational support in other developing country contexts.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-24", "url": "https://doi.org/10.1111/1467-8489.70144", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70144"}, {"source": "crossref", "source_id": "10.1111/agec.70138", "title": "Spatial Spillovers and Green Growth: Decoding Environment‐Adjusted Agricultural Productivity Dynamics", "authors": "Wenhui Zhang, Xinli Ke, Vivian Wei Huang", "abstract": "ABSTRACT This paper develops a novel production function framework that accounts for spatial spillovers in environment‐adjusted agricultural productivity and its components, namely technical change, scale efficiency change and environmental efficiency change, in a single‐stage setting, with greenhouse gas (GHG) emissions incorporated as an undesirable output. A parametric frontier model was specified to measure agricultural environmental efficiency and productivity growth, while allowing for the agricultural outputs to be functions of individuals’ and neighbors’ characteristics. The empirical application concerned the 126 prefectures in the Yangtze River Basin for the period 2000–2020. The empirical findings indicated an upward trend, with an average environment‐adjusted agricultural productivity growth rate of 0.213 during this period when spatial spillovers and agricultural undesirable output were considered, suggesting that agricultural productivity was increasing rapidly and at an accelerating pace. The downstream region experienced the highest rate of productivity improvement, followed by the midstream region, while the upstream region lagged. Technical progress emerged as the dominant driver of environment‐adjusted agricultural productivity growth in the study area.", "journal": "Agricultural Economics", "published": "2026-07-23", "url": "https://doi.org/10.1111/agec.70138", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70138"}, {"source": "crossref", "source_id": "10.1002/aepp.70113", "title": "Integrating Perennial Groundcover in Corn and Soybean Acres: Impacts on U.S. Agriculture", "authors": "Sagar Dahal, Amani Elobeid, John Crespi", "abstract": "ABSTRACT Sustainable agricultural practices such as cover cropping can improve soil health, water quality, and carbon sequestration, yet U.S. adoption remains limited due to economic and operational barriers. We evaluate market and economic impacts of integrating perennial groundcover into U.S. corn and soybean production under six yield and cost scenarios. Results show that impacts depend on whether yields are maintained and costs remain stable. Under the most optimistic scenario, long‐term outcomes remain close to or slightly above baseline levels. In contrast, scenarios involving yield losses or sustained cost increases generate negative economic outcomes, highlighting the importance of agronomic performance and cost control.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-23", "url": "https://doi.org/10.1002/aepp.70113", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70113"}, {"source": "crossref", "source_id": "10.1093/erae/jbag013", "title": "Deep pockets needed? Financial health and organic certification adoption in the European Union", "authors": "Lina M Tennhardt, Martina Bozzola, Christian Grovermann", "abstract": "Abstract Adoption of organic certification across the EU remains lower than anticipated, with financial risks during and after conversion often cited as barriers. We examine whether farms with stronger financial health (FH) are associated with a higher likelihood of adopting organic certification. Using Farm Accountancy Data Network panel data from 2014 to 2018 covering 24,797 EU farms, we classify farms by FH and apply matching and logit regression to analyse the relationship between preconversion FH and organic certification adoption. Results show no clear association between FH and adoption, while preconversion land-use intensity consistently correlates with organic certification uptake, suggesting relevance for EU policy design efforts.", "journal": "European Review of Agricultural Economics", "published": "2026-07-21", "url": "https://doi.org/10.1093/erae/jbag013", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1093/erae/jbag013"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70133", "title": "Inside the Black Box: Advancing Climate Disclosure in Australia's Energy Sector to Support a Resilient National Electricity Market", "authors": "Tracey Dodd, Melissa Nursey‐Bray, Rhys Thomas", "abstract": "ABSTRACT Alongside the 2024–2025 review of the National Electricity Market, Australian energy companies faced the most significant reforms to climate disclosures in corporate history. Specifically, the Australian Sustainability Reporting Standard for Climate‐related Disclosures (AASB S2) was announced in September 2024, after which all entities falling within the purview of the National Greenhouse and Energy Reporting Act—effectively every major electricity generator and retailer—were required to identify and disclose climate‐related risks and opportunities. This includes Scope 1, 2 and 3 emissions and scenario analysis of their exposure to climate disruptions. Whilst some energy companies had already voluntarily disclosed some elements of this information, these new requirements required more consistent, comparable and forward‐looking reporting. We examine the early stages of measures taken by the energy sector to comply with AASB S2. Drawing on a 12‐month collaboration with the Australian Energy Council, our case study highlights the need for greater attention to robust methodologies for calculating Scope 3 emissions and stress testing climate scenarios, including the policy assumptions that underpin them. Importantly, this research highlights the risks inherent to any national standard that is more closely aligned to policy aspirations than to climate science, given that such discrepancies may pose risks to the resilience of the National Electricity Market. This study also contributes to stakeholder theory by illustrating the need for greater attention to how sector‐level collaboration among competitors can support improved corporate disclosures, especially in relation to climate governance.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-20", "url": "https://doi.org/10.1111/1467-8489.70133", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70133"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70141", "title": "Economic Analysis of Infrastructure Investment and Break‐Even Carbon Prices for Low‐Water, Low‐Emission Farming Techniques in Vietnam", "authors": "Nhat‐Mai Nguyen, Quoc Anh Ho, Thi Ha Lien Le, R. Quentin Grafton, Thang Nam Do, Khoi Dang, Long Chu", "abstract": "ABSTRACT Excessive water use in rice production is a major source of methane emissions, the dominant greenhouse gas from Vietnam's agricultural sector. Improving water‐use efficiency can enhance water security and reduce emissions, but achieving these gains requires substantial changes in farming practices and significant investment in supporting infrastructure. This study provides an economic analysis of low‐water, low‐emission (LWLE) farming techniques, such as Alternate Wetting and Drying and the System of Rice Intensification, and their associated infrastructure requirements. Using survey data from 14,312 rice‐producing households in Vietnam, we evaluate the economic performance of farmers who adopt LWLE practices and those who do not. The results show that producers adopting LWLE not only achieve higher yields than those using traditional farming techniques—and consequently higher revenues—but also incur higher costs and ultimately earn lower profits. In addition, LWLE entails considerable hidden upfront irrigation costs, posing barriers for farmers and limiting smallholder participation. We also undertake a break‐even carbon price analysis to illustrate the economic trade‐offs in reducing one tonne of CO 2 equivalent through LWLE techniques, and the results suggest that these practices could reduce farmers' vulnerability to future carbon pricing.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-20", "url": "https://doi.org/10.1111/1467-8489.70141", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70141"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70136", "title": "Financial Literacy Intervention and the Willingness to Pay for Digital Credits: A Scalable Video‐Based Approach in Kenya", "authors": "Albert Nsengumuremyi, Vanessa Bonke, Oliver Musshoff, Daniel Hermann", "abstract": "ABSTRACT Rapid growth in digital finance has expanded credit access for rural smallholders, yet financial capability has not kept pace with access. Where fee structures are opaque and search is costly, this gap raises the risk of expensive borrowing in digital financial services. This paper assesses whether a video‐based financial knowledge intervention affects stated willingness to pay for digital credit. Using contingent valuation with a payment card approach, we measure willingness to pay before and after information provision among 694 smallholder households in Meru County, Kenya. Our results show that the video intervention reduced the monthly interest rate that smallholders are willing to pay by 1.4 percentage points. This finding suggests that the intervention increased sensitivity to borrowing costs and reduced stated tolerance for higher‐priced digital credit. It also provides policy‐relevant evidence that brief, targeted video prompts can complement consumer‐protection measures by shifting stated credit choices toward lower interest‐rate categories.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-19", "url": "https://doi.org/10.1111/1467-8489.70136", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70136"}, {"source": "crossref", "source_id": "10.1002/aepp.70115", "title": "Slow to Respond: Lagged Adjustments to Moisture Conditions in Small Ruminant Markets", "authors": "Musa Hasen Ahmed", "abstract": "ABSTRACT This study examines how rural households in Ethiopia adjust their livestock market participation in response to moisture conditions. Using contemporaneous and lagged measures of hydrological stress, the analysis distinguishes between sheep and goat markets to capture species‐specific responses. The results show that adjustment is driven primarily by lagged moisture conditions, although some contemporaneous effects are also evident. Favorable past moisture significantly increases participation in sheep markets, while responses in goat markets are smaller and less consistent. Transaction volumes respond only weakly, indicating that hydrological stress affects primarily the extensive margin of market participation. Responses also vary across agroecological zones. The findings suggest that livestock adjustment to hydrological stress is gradual and species‐specific, reflecting ecological dynamics and differences in resilience across livestock species.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-19", "url": "https://doi.org/10.1002/aepp.70115", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70115"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70142", "title": "From Tap Water Access to Income‐Generating Work Time: Evidence From Rural China", "authors": "Yiyi Zhao", "abstract": "ABSTRACT This study examines whether household tap water access affects income‐generating work time among employed rural adults in China. While existing studies have mainly examined the effects of improved water access on employment participation, off‐farm transition and household income, this paper focuses on the intensive margin of labour supply within existing livelihood activities. Drawing on household production and time allocation theory, household tap water access is conceptualised as reducing the time cost of routine domestic production, thereby releasing time that may be reallocated to income‐generating work and other household activities. Using rural panel data from the China Family Panel Studies from 2014 to 2022, the analysis applies individual fixed‐effects models and instrumental variables fixed‐effects (IV‐FE) estimates. The fixed effects results show that household tap water access is associated with approximately one additional hour of income‐generating work per week among employed rural adults. Under the IV identifying assumptions, the IV‐FE estimates suggest a larger positive effect. Additional time‐use analysis indicates that household tap water access reduces daily housework time by about 0.29 h and modestly increases midday nap duration, while no statistically significant changes are found for television watching or leisure reading. Heterogeneity analysis suggests that the increase in work time is concentrated among agricultural workers, self‐employed individuals, prime‐age adults and individuals living in households without young children.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-17", "url": "https://doi.org/10.1111/1467-8489.70142", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70142"}, {"source": "crossref", "source_id": "10.1002/aepp.70110", "title": "Low Participation and Risk Reduction Potential of Supplemental Crop Insurance in the United States", "authors": "Francis Tsiboe, Hunter Biram, Amy Hagerman", "abstract": "ABSTRACT Federally subsidized crop insurance is a cornerstone of U.S. farm risk management, yet policies with the greatest share of participation only trigger indemnities after losses exceed 15%. Supplemental insurance was introduced to cover part of this deductible, but participation remains largely unchanged. Using 1,005,245 sub‐county aggregated insurance observations and applying novel calibration and simulation methods, we show that low participation in supplemental coverage limits risk reduction potential. While basic insurance provides a foundation, adding supplemental policies meaningfully improves downside risk reduction and income transfer. Although these gains involve higher premiums, a benefit‐per‐premium analysis still favors broader use. These results reflect potential program impacts conditional on adoption, recognizing that actual participation depends on farmer preferences, risk perceptions, and institutional constraints.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-16", "url": "https://doi.org/10.1002/aepp.70110", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70110"}, {"source": "crossref", "source_id": "10.1002/ajae.70084", "title": "Not just a random forest: Using Bayesian additive regression trees to estimate willingness to pay to protect critical habitat", "authors": "Lendie Follett, Brian Vander Naald, Sonja H. Kolstoe", "abstract": "Abstract We introduce a fully nonparametric estimator to estimate willingness to pay (WTP) using contingent valuation (CV) data. Traditional methods such as the probit model are used because of their roots in utility theory as well as their ease to implement. However, they are limited by their reliance on strict parametric assumptions, such as linearity and the requirement that the researcher pre‐select important covariates. While these methods are widely used, they may fail to capture complex relationships, particularly in situations involving nonlinearity or interactions among variables. This paper introduces Bayesian Additive Regression Trees (BART) as a flexible
