sitioned farmers as information‐diffusion nodes. At the same time, network spillovers may slow adoption of technologies that primarily serve as information‐access tools, rather than speed it up.", "journal": "Agricultural Economics", "published": "2026-09-01", "url": "https://doi.org/10.1111/agec.70144", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70144"}, {"source": "crossref", "source_id": "10.1002/aepp.v48.4", "title": "", "authors": "", "abstract": "", "journal": "Applied Economic Perspectives and Policy", "published": "2026-09-01", "url": "https://doi.org/10.1002/aepp.v48.4", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.v48.4"}, {"source": "crossref", "source_id": "10.1111/1477-9552.70075", "title": "Platform Fulfilment and Seller Reputation: Evidence From Amazon's Marketplace", "authors": "Chinonso E. Etumnu, Kenneth A. Foster", "abstract": "ABSTRACT In 2006, Amazon launched the Fulfilment by Amazon (FBA) program, providing support to third‐party sellers for a fee. While the program has the potential to enhance sellers' reputations, evidence regarding its effectiveness is limited. This study estimates the association between FBA usage and seller reputation, measured by the average star rating a seller receives. Using fixed effects and staggered difference‐in‐differences estimation approaches as well as 26 weeks of panel data from Canada, the United Kingdom and the United States, three key findings emerge. First, using FBA is significantly and positively associated with a seller's reputation, leading to higher average ratings in the short term than in the long term. This improvement is mainly due to FBA's competitive advantages, such as eligibility for Amazon Prime, standardised fulfilment quality and excellent customer service. Second, although the correlation between FBA and reputation is positive in every country, we find cross‐country heterogeneity in effect sizes and significance levels, with the largest effects in Canada. Third, we show that large sellers have the best reputation, and all sellers benefit from the FBA program. However, medium‐sized sellers benefit the most from the program. This trend can be attributed to how the benefits of the FBA program accrue optimally to sellers based on their operational scale. These results suggest that the FBA program is indeed effective in enhancing seller reputation, with implications for third‐party sellers, Amazon and regulators.", "journal": "Journal of Agricultural Economics", "published": "2026-08-26", "url": "https://doi.org/10.1111/1477-9552.70075", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1477-9552.70075"}, {"source": "crossref", "source_id": "10.1002/aepp.70124", "title": "Behavioral Coping With Food Price Inflation: Patterns Among U.S. Households", "authors": "Yuxiang Zhang, Yizao Liu", "abstract": "ABSTRACT Recent food price inflation has placed substantial pressure on household budgets, food security, and mental well‐being. Using Household Pulse Survey data, we combine k‐modes clustering and Double Machine Learning to identify distinct household coping groups and examine differences in how households respond to rising food prices across groups. Results show that higher food prices are associated with increased grocery and prepared meal spending, elevate risks of food insufficiency, and worsen mental health conditions, with heterogeneity across coping groups. Households employing moderate substitution strategies show limited buffering, while those using more intensive coping behaviors remain highly vulnerable, highlighting the need for policy responses that address the multiple, co‐occurring dimensions of hardship including food access, financial strain, and mental health, rather than any single dimension in isolation.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-08-25", "url": "https://doi.org/10.1002/aepp.70124", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70124"}, {"source": "crossref", "source_id": "10.1002/ajae.70091", "title": "Risk management externalities in agrifood supply chains", "authors": "Jeffrey Hadachek, Meilin Ma", "abstract": "Abstract Firms may under‐ or over‐invest in risk management from the social planner's perspective, resulting in a negative externality on other economic agents in the supply chain. The externality of risk management is particularly relevant for agrifood supply chains, which frequently experience disruptions and play a primary role in preventing major social losses from food insecurity. The magnitude of the externality depends on the structure of the supply chain. We build a theoretical model to characterize such externalities in US food supply chains where intermediary firms choose output quantities and investments in managing risks. The model allows for flexible market structures and interdependence of risk management among firms. Risk interdependence captures the unique feature of biotic hazards (e.g., animal and plant diseases) in agrifood supply chains, where the effectiveness of a firm's risk management depends on peer firms' behavior. We offer novel insights on the role of risk interdependence in driving the externality in risk management under different market structures. We show that private firms invest less than the socially optimal level under perfect competition, but risk interdependence and market power introduce complex incentives in risk‐reducing investment that shape the externality. In particular, when investments are complements across firms and firms possess strong market power in production but limited coordination in risk management, private investment may equal or even exceed the socially optimal level.", "journal": "American Journal of Agricultural Economics", "published": "2026-08-23", "url": "https://doi.org/10.1002/ajae.70091", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/ajae.70091"}, {"source": "crossref", "source_id": "10.1111/1477-9552.70076", "title": "Assessing the Environmental, Economic and Social Impacts of a Greenhouse Gas Emission Tax in Swiss Agriculture", "authors": "Marta Tarruella‐Cayuela, Nadja El Benni, Eva Winter, Robert Huber, Robert Finger, Gabriele Mack", "abstract": "ABSTRACT Agriculture accounts for about one fifth of global greenhouse gas (GHG) emissions, making mitigation a key policy priority. Although policymakers are increasingly considering market‐based approaches such as taxes, their broader impacts remain insufficiently assessed. This study examines the environmental, economic and social impacts of a GHG tax on Swiss agriculture. Using the agent‐based sector model SWISSland, representing 3077 farms and capturing heterogeneous responses to taxation and structural change, we simulate tax levels of 100, 200 and 300 CHF/tCO 2 eq for 2024–2030. We consider three mitigation pathways: technical measures, structural changes in land use and livestock numbers, and farm exits. We assess their impacts on GHG emissions, nitrogen surpluses, biodiversity, farm income, food production and food security. A GHG tax activates abatement mechanisms and induces dairy herd reductions, grassland extensification, shifts towards crop production for direct human consumption, and livestock farm exits. At 100 and 200 CHF/tCO 2 eq, emission reductions are mainly driven by technical measures, whereas at 300 CHF/tCO 2 eq they increasingly result from structural adjustment, including livestock farm exits and land reallocation to less emissions‐intensive production. A tax of 100 CHF/tCO 2 eq reduces emissions by 5%, while higher tax rates achieve greater reductions but increase sectoral income losses from 13% to 25%. Food self‐sufficiency and calorie production remain stable. The model also shows environmental co‐benefits, including lower nitrogen surpluses and increased biodiversity areas. These findings highlight synergies and trade‐offs across sustainability dimensions and suggest that redistributing tax revenues could mitigate adverse effects and improve policy outcomes, while enhancing the policy's social acceptability.", "journal": "Journal of Agricultural Economics", "published": "2026-08-23", "url": "https://doi.org/10.1111/1477-9552.70076", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1477-9552.70076"}, {"source": "crossref", "source_id": "10.1111/agec.70140", "title": "Rural Straw Burning and Its External Impacts on Urbanites' Happiness in China", "authors": "Jinfeng Gao, Jianglong Li", "abstract": "ABSTRACT This study examines the impact of cross‐regional pollution from rural straw burning on the happiness of urban residents. Specifically, we investigate how drifting particulate matter from straw burning, which travels far from its source, influences the well‐being of those in affected urban areas. By combining high‐resolution satellite data on agricultural fires with self‐reported happiness data, we estimate that a one‐standard‐deviation increase in agricultural fires—measured by the number of upwind fire points, fire intensity (proxied by brightness temperature), and fire radiative power—reduces happiness by approximately 0.099, 0.098, and 0.079 points on the CES‐D scale, respectively. Using the pollution decay function, we further quantify the contribution of straw burning to urban particulate matter (PM 2.5 ) levels and explore the channels through which PM 2.5 exposure diminishes happiness, including both objective and subjective factors. From an economic perspective, a simple back‐of‐the‐envelope calculation suggests that the implied welfare losses may exceed current government spending on straw management. These findings highlight the high social and economic costs of agricultural fires and underscore the urgent need for coordinated policy responses in agriculture‐dependent developing economies experiencing similar challenges.", "journal": "Agricultural Economics", "published": "2026-08-23", "url": "https://doi.org/10.1111/agec.70140", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70140"}, {"source": "crossref", "source_id": "10.1093/erae/jbag017", "title": "Commodity price risk in phosphorus recycling investments", "authors": "Jan-Philip R Uhlemann, Alfons Oude Lansink, James J Leahy, Jean-Paul Chavas, Tobias Dalhaus", "abstract": "Abstract There are optimistic targets for phosphorus recycling from waste streams to solve environmental and supply issues simultaneously. The recycling process requires high energy inputs, thus the joint distribution of (input) energy and (output) fertilizer commodity prices is a crucial determinant of the profitability of investing. We propose a methodology to model the investment risk and price dependencies using quantile vector autoregression and copulas. Moreover, we show that standard approaches overestimate the variance of investment returns. Finally, we find that phosphorus recycling investments are only profitable with substantial subsidies or savings on disposal expenditures.", "journal": "European Review of Agricultural Economics", "published": "2026-08-22", "url": "https://doi.org/10.1093/erae/jbag017", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1093/erae/jbag017"}, {"source": "crossref", "source_id": "10.1111/agec.70142", "title": "Spatial Co‐Occurrence of Climate Extremes, Food Price Volatility, and Conflicts in Northern Nigeria: Implications for Geotargeting", "authors": "Chun Song, Antonio Scognamillo, Marina Mastrorillo, Anna Belli, Victor Villa", "abstract": "ABSTRACT Climate extremes and conflict risks may co‐occur in the same regions, particularly where agrifood systems are fragile, exposing vulnerable communities to multiple shocks. However, the extent to which these shocks co‐occur depends on local contextual factors. To inform the prioritization of interventions aimed at mitigating compound risks and strengthening agrifood system resilience, this paper examines where, and to what extent, climate extremes, food price volatility, and conflict events overlap, in Northern Nigeria, a region characterized by a high concentration of major agricultural markets and sufficiently rich data to support long‐panel analysis across multiple commodities. Using data from 52 retail agricultural markets between 2002 and 2023, we estimate 9680 local regressions that permutate over a breadth of variables and their combinations. In doing so, we relax the constraint on co‐occurrence allowing the measure to vary across locations to capture local specificity. Results reveal significant co‐occurrences of climate extremes (especially drought), food price volatility (especially in locally important commodities), and increased intensity of conflict in the study area. In specific hotspots, the estimated intensity of co‐occurrence is up to five times higher than in other locations, indicating a substantial within‐country heterogeneity in exposure to compound risks. Our findings suggest the need for localized evidence to guide the targeting of interventions and to identify priority locations for investigating the root cause of vulnerability to compound risks.", "journal": "Agricultural Economics", "published": "2026-08-22", "url": "https://doi.org/10.1111/agec.70142", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70142"}, {"source": "crossref", "source_id": "10.1111/1477-9552.70072", "title": "Mechanized Fragility in Turkish Agriculture: Earthquakes, Capital Destruction and the Scarcity Trap", "authors": "Alper Demirdogen, Emine Olhan", "abstract": "ABSTRACT Natural disasters increasingly threaten global food security, yet the resilience of mechanized, middle‐income agriculture remains a puzzle. Standard development theory suggests households manage shocks by substituting labor for capital. We show this mechanism fails in modern, mechanized agriculture because substituting labor for destroyed capital is infeasible in the short run. We estimate the impact of the February 2023 earthquakes in Turkiye on agricultural supply, separating extensive margin adjustments (cultivated land) from intensive margin effects (yields). This disaster represents a unique ‘dual shock’: physical capital destruction coincided with a liquidity crisis that blocked asset replacement. To analyse this, we adapt the Agricultural Household Model using a Leontief (fixed‐proportions) representation as a short‐run limiting case. Empirically, we employ a Synthetic Difference‐in‐Differences strategy, combining district‐level crop statistics with remote sensing data. We find a significant contraction at the extensive margin: wheat cultivation declined by 8.5% relative to the pre‐treatment mean in the 2024‐restricted specification. Yet, we identify a ‘Null Yield Effect’ at the intensive margin. Yields remained stable or increased. This aligns with ‘Ricardian Selection,’ where producers—facing binding capital constraints—abandon marginal lands to concentrate resources on prime plots; consistent with this mechanism, the yield gain is concentrated in marginal, low‐quality districts and absent where land is better. Sharp declines in new tractor registrations (24%) and agricultural credit (16.5%) confirm a ‘Scarcity Trap.’ In high‐inflation, mechanized environments, cash transfers are insufficient. Policy must instead prioritize in‐kind capital replacement to bypass liquidity constraints and restore capacity.", "journal": "Journal of Agricultural Economics", "published": "2026-08-21", "url": "https://doi.org/10.1111/1477-9552.70072", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1477-9552.70072"}, {"source": "crossref", "source_id": "10.1093/erae/jbag016", "title": "Smartphones, information, and bargaining power: Evidence from pastoral areas in China", "authors": "Min Liu, Kaixing Huang, Jianyu Yu, Shukun Wang, Weidong Wang, Xiaohua Yu, David Wuepper", "abstract": "Abstract This study examines the impact of smartphone adoption on livestock trading in pastoral China. We develop a bargaining and search model with two mechanisms: information discovery, which reduces herders’ search costs, and information posting, which expands market access. Using household survey data, we find that smartphone adoption increases selling prices. Mechanism analysis shows that traditional phone functions improve information access, while smartphone-specific features, especially information posting, enhance bargaining power by expanding selling channels and trader access. These findings demonstrate that digital technologies affect market outcomes not only through improved information access but also by reshaping bargaining structures and market participation.", "journal": "European Review of Agricultural Economics", "published": "2026-08-21", "url": "https://doi.org/10.1093/erae/jbag016", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1093/erae/jbag016"}, {"source": "crossref", "source_id": "10.1111/agec.70141", "title": "Standards Harmonization and Institutional Quality in Exporting Countries", "authors": "Anirudh Shingal", "abstract": "ABSTRACT The existing literature has documented the positive impact of standards harmonization in the importing country on trade, but it has not examined whether better institutional quality in exporting countries helps enhance the gains from this harmonization. Combining disaggregated trade data with data on maximum residue levels (MRLs) in pesticides, we exploit the EU's 2008 harmonization of pesticides MRLs to study the impact of institutional quality in non‐EU exporting countries on EU imports of horticultural products from these countries over 2005–2014 in a structural gravity framework. We find that multiple dimensions of institutional quality—government effectiveness, regulatory quality and rule of law, which reflect institutional capacity to implement and enforce harmonized standards and ensure transparency, and control of corruption that fosters trust between trading partners—enhance the positive impact of harmonization on the probability of exporting to the EU. However, a similar effect on export value is found to be inconclusive.", "journal": "Agricultural Economics", "published": "2026-08-20", "url": "https://doi.org/10.1111/agec.70141", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70141"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70153", "title": "The Value of Controlling Wilding Conifers in New Zealand", "authors": "Maksym Polyakov, Abbie Rogers, Philip Stahlmann‐Brown, Rowan Sprague, Olivia Burge, Johanna Yletyinen, Duane A. Peltzer", "abstract": "ABSTRACT Exotic, invasive conifer tree species, known as ‘wilding conifers’, pose a significant threat to natural ecosystems and are costly to manage, creating a need to identify community preferences in order to inform and balance public investment in their control. Currently, approximately 7% of New Zealand's total land area is covered by invasive wilding conifers, and the rate of spread is approximately 5% per year. This study analysed the preferences of the New Zealand population regarding the control of wilding conifers in indigenous ecosystems using a choice experiment. The results, obtained through a mixed logistic model in willingness‐to‐pay space, showed that the public places significant value on controlling the spread of wilding conifers. Preferences for control displayed distance decay and diminishing marginal utility. The study also examined the spatial heterogeneity of preferences in terms of distance decay and the spatial dimension of scope. Finally, the study estimated the value of controlling the spread of wilding conifers nationally, which was found to be about NZ$147 million annually, and broadly consistent with the economic damage caused by other major invasive weeds in New Zealand. These findings confirm the importance of spatial factors in explaining preferences for the control of invasive trees and demonstrate how policymakers can use the estimated values to measure the benefits of different control options.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-08-17", "url": "https://doi.org/10.1111/1467-8489.70153", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70153"}, {"source": "crossref", "source_id": "10.1002/aepp.70121", "title": "Rational Expectations and Market Timing: An Event Study of the China–United States Phase One Trade Deal", "authors": "Tim Ölkers, Oliver Mußhoff", "abstract": "ABSTRACT Rational actors constantly incorporate information into their decision‐making behavior. Since there is often a time lag between the announcement of a policy and its implementation, an important question arises: when do rational actors incorporate new information into their market behavior, at the announcement or at the implementation of a policy? We investigate this question using the easing of trade tensions between China and the United States, marked by the “Phase One” trade deal announced in December 2019 and signed in January 2020, as a considerable positive trade shock. Focusing on two key events, the announcement of substantial tariff reductions on December 13, 2019, and the signing of the trade deal in January 2020, this study examines how both the announcement and the implementation of reduced trade barriers affected agricultural companies' stock prices. We employ an event study approach using data from the MSCI ACWI Select Agriculture Producers Investable Market Index to assess market reactions. The findings are consistent with the hypothesis derived from the conceptual framework, showing that rational market actors incorporate information at the announcement stage, not only at the implementation of a policy. However, sub‐industry analyses indicate that a subset of sub‐industries drives the aggregate effect, while additional heterogeneity analysis shows that the magnitude of the effects differs across continents. These findings are relevant for policymakers, businesses, and economists seeking to understand the broader economic implications of international trade agreements in general, and trade disputes in particular.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-08-16", "url": "https://doi.org/10.1002/aepp.70121", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70121"}, {"source": "crossref", "source_id": "10.1111/agec.70135", "title": "Cooperatives and Climate Change Adaptation: A Pathway to Conflict Reduction in Artisanal Fisheries Communities in Nigeria", "authors": "Lawrence Olusola Oparinde, Sebastian Hess", "abstract": "ABSTRACT Climate change is having a devastating impact on artisanal fisheries communities in developing countries, including Nigeria. In Nigeria, multiple local conflicts have arisen as a result of climate‐related changes in coastal regions. This study investigates the impact of cooperatives and climate change adaptation on conflicts among artisanal fisherfolk in Nigeria. To capture climate change adaptation complexity, we employed the number of climate change adaptation strategies adopted as a count variable. We applied Endogenous Treatment Poisson Regression and Unconditional Quantile Regression models to analyze cross‐sectional data collected from artisanal fisherfolk in the coastal area of Nigeria. Findings from this research revealed that non‐fishing strategies are equally important as part of the climate change adaptation strategies with 43%, 22%, and 14% of the respondents adopting livelihood diversification, a community conflict resolution committee, and formation of local security outfits (vigilante), respectively. The results further showed that cooperatives play a significant role in increasing the number of climate change adaptation strategies adopted. Also, the study empirically established that cooperatives lessen the incidence, especially of the most severe conflicts among artisanal fisherfolk. Therefore, policy efforts should be geared towards strengthening and developing cooperative societies among artisanal fisherfolk in order to strengthen climate adaptation and reduce conflicts.", "journal": "Agricultural Economics", "published": "2026-08-12", "url": "https://doi.org/10.1111/agec.70135", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70135"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70139", "title": "Do Shifts in Migrant Labour due to\n                    <scp>COVID<\/scp>\n                    ‐19 Affect Climate Change Adaptation Practices of Climate‐Vulnerable Farmers? Implications for the Post‐Pandemic Future", "authors": "Amrit Shrestha, Sreedhar Upendram, Seong‐Hoon Cho, Neelam C. Poudyal, James C. Mingie", "abstract": "ABSTRACT The objective of our study is to examine how migrant labour shifts due to the COVID‐19 pandemic influenced the adaptation behaviour of climate‐vulnerable farmers in Nepal. We examine how the resulting temporary change in climate change adaptation behaviour may be sustainable and improved after migrant labour returns to overseas employment by examining the relationship of institutional factors on climate change adaptation practices. A case study is presented using survey data collected from farmers in the Sunsari district of the eastern plains (Terai) region of Nepal during June 2022. Foreign‐employed migrants were found to have a positive relationship with the adoption of climate change adaptation practices. The finding implies that the presence of migrant household members (younger and more educated) is likely to encourage farmers to adopt more climate change adaptation practices. We further find that improving farmers' access to extension programmes, subsidies and the internet can be potentially used to sustain climate change adaptation practices in the post‐pandemic future. We demonstrate this by estimating the number of climate change adaptation practices by increasing farmers' access to extension programmes and subsidies under post‐pandemic labour scenarios. These estimates provide local policymakers tools to potentially improve accessibility to extension programmes or government subsidies that are likely to enhance farmers' climate change adaptation practices.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-08-12", "url": "https://doi.org/10.1111/1467-8489.70139", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70139"}, {"source": "crossref", "source_id": "10.1002/aepp.70123", "title": "Issue Information", "authors": "", "abstract": "", "journal": "Applied Economic Perspectives and Policy", "published": "2026-08-12", "url": "https://doi.org/10.1002/aepp.70123", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70123"}, {"source": "crossref", "source_id": "10.1093/erae/jbag014", "title": "Agricultural extension services for farm resilience in Russian–Ukrainian Conflict", "authors": "Bekhzod Egamberdiev, Mukhayyo Djuraeva, Ihtiyor Bobojonov, Lena Kuhn, Thomas Glauben", "abstract": "Abstract We analyse how agricultural extension services affect farm resilience using the Post-Russian Invasion Survey of Smallholder Farmers in Ukraine for 2022–3. Farm household resilience is measured using the Resilience Capacity Index (RCI), constructed from Adaptive Capacity (AC), Assets (AST), Social Safety Nets (SSN), and Sensitivity (S). To address the heterogeneity problem, Latent Profile Analysis (LPA) defines homogenous resilience profiles. The manuscript also examines a causal relationship by incorporating treatment effects into latent analysis. The results reveal that extension service receivers experience higher levels of AST and SSN. The extension service has a positive effect on RCI levels.", "journal": "European Review of Agricultural Economics", "published": "2026-08-10", "url": "https://doi.org/10.1093/erae/jbag014", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1093/erae/jbag014"}, {"source": "crossref", "source_id": "10.1093/erae/jbag015", "title": "Spatially coordinated conservation auctions under imperfect information about ecological spillovers", "authors": "Zhaoyang Liu, Xiaojun Yang, Paul R Armsworth, Nick Hanley", "abstract": "Abstract Increasing attention is being paid to the design of economic incentives for conservation on private land to encourage spatial coordination. We investigate the effects of using incorrect information on the ecological benefits of spatial coordination in the design of a conservation auction, using a framed field experiment with real farmers as participants. We find that auction performance can be substantially weakened if the parameters adopted are ‘wrong enough’ to change which farms are prioritized for enrolment in a conservation contract. Parameters that under-estimate the true coordination benefits are less damaging to policy performance than those which over-estimate these benefits.", "journal": "European Review of Agricultural Economics", "published": "2026-08-10", "url": "https://doi.org/10.1093/erae/jbag015", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1093/erae/jbag015"}, {"source": "crossref", "source_id": "10.1111/1477-9552.70067", "title": "Automating Food Production: Evidence From the Dutch Food Industry", "authors": "Jan‐Philip R. Uhlemann", "abstract": "ABSTRACT Automation technology has the potential to replace a significant part of the labour force in the food industry. With data from 2002 to 2023, I investigate the causal treatment effects of the adoption of automation technology in the Dutch food industry. Automation technology in the food industry is used in a variety of tasks, such as logistics, safety, quality and production. I present a theoretical model to outline relationships that are tested in the empirical analysis. The outcome variables of interest are gross value added, average wage, employment and the labour share. The empirical analysis finds that the effect of automation on these outcomes is ambiguous and the majority of the estimates are not statistically significant. I study the relationship under various samples of food industry firms and automation definitions. For the full sample, long‐run changes in these outcomes are largely uncorrelated with automation, while food processors show a long‐run decline in gross value added and a rising labour share. A chained difference‐in‐differences design shows that adoption raises gross value added and lowers the labour share and wages among larger firms and food processors. However, most of the effects of automation are not statistically significant. The absence of strong effects of automation could be explained by investments that monitor and control production steps, rather than displace worker roles in production.", "journal": "Journal of Agricultural Economics", "published": "2026-08-09", "url": "https://doi.org/10.1111/1477-9552.70067", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1477-9552.70067"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70154", "title": "Information Provision and Pesticide Reduction in Rice Production: Experimental Evidence From China", "authors": "Chao Zhang, Qianqian Chen, Ruifa Hu", "abstract": "ABSTRACT Using three waves of household data from a randomised controlled trial involving 676 rice farmers in Hubei and Jiangxi provinces of China over the period 2017–2019, we estimate the causal effect of information provision on pesticide use and examine heterogeneity with respect to the duration of the intervention, farmers' human capital, and the identity and mode of information providers. The results reveal that 1 year of information provision did not reduce pesticide use intensity, whereas 2 years of provision led to a substantial reduction of 47.2%. This finding remains robust to alternative pesticide measures, sample winsorization, and different regional fixed effects specifications. The pesticide reduction effect is larger among farmers with higher levels of human capital. Information provided by government extension agents significantly reduces pesticide use, particularly when provided through face‐to‐face farmer training and retailer‐mediated dissemination. In contrast, identical information provided by pesticide firms has no significant effect, regardless of the intervention duration or provision mode. Moreover, the provision of pesticide‐reduction information lowers health risks for farmers and environmental risks to ecosystems from toxic exposure without compromising rice yield. These findings imply that future policies should prioritise sustained information provision targeting smallholders, strengthen intervention effectiveness for farmers with lower human capital, and enhance government extension services.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-08-07", "url": "https://doi.org/10.1111/1467-8489.70154", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70154"}, {"source": "crossref", "source_id": "10.1002/ajae.70088", "title": "Crop insurance and irrigation behavior: The conditional role of pumping costs", "authors": "Sungmin Cheu, Molly Sears", "abstract": "Abstract Excessive water use for irrigation can accelerate the depletion of water resources, undermining agriculture's resilience to weather‐related shocks. Understanding how farmers make water use decisions is essential for developing effective water management policies. This study investigates the effect of crop insurance participation on water use in the High Plains Aquifer region, using crop‐specific irrigation data and unit pumping costs for groundwater extraction. We examine the question of moral hazard in input use, analyzing how water use responses to insurance participation vary with changes in groundwater pumping costs. To address endogeneity between water use and insurance participation, we employ an instrumental variable approach using base premium rates that are determined before farms make production and insurance decisions. We find that insurance participation increases per‐acre water use, but the magnitude of this effect declines as pumping costs rise. At the average pumping costs, a one percentage point increase in insurance participation leads to a 0.4% increase in per‐acre water use. At the 95th percentile of pumping costs, the marginal effect of insurance participation is negligible and close to zero. Our results suggest that water pricing policies should account for indirect effects through insurance participation to avoid the inefficient use of water resources.", "journal": "American Journal of Agricultural Economics", "published": "2026-08-06", "url": "https://doi.org/10.1002/ajae.70088", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/ajae.70088"}, {"source": "crossref", "source_id": "10.1111/1477-9552.70071", "title": "Identifying the Causal Impacts of International Sanctions on Agricultural Trade: An Event Study Approach", "authors": "Junyan Tian", "abstract": "ABSTRACT International sanctions have been increasingly deployed for political and economic reasons. While the consequences of sanctions on political and macro‐economic outcomes are well‐analysed, rigorous evaluations of the causal impacts of sanctions on the agriculture and food (agri‐food) trade remain limited. We obtain the causal estimates of sanctions' impact on agri‐food trade by utilising samples that have been threatened with but not subject to sanctions to construct the counterfactual of the sanctioned sample. Exploiting an event study approach to analyse data from 154 countries over the period 1960–2016, we find that international sanctions mostly resulted in modest and short‐lived declines in the total agri‐food trade of sanctioned countries as opposed to the counterpart of countries under sanction threats. Trade volumes declined substantially for beef, pork, roots, dairy and fruit products. The decline in the exports of agri‐food commodities resulting from international sanctions was more significant relative to the drop in imports. The study also reveals that the impact of sanctions on agri‐food trade depends partially on the type of the sanction and on the sanction imposer. While the differences in the impact of sanctions across agri‐food commodities largely reflect the fact that the commodities where there are stronger impacts are those produced more in countries subject to sanctions, future studies incorporating analytical tools from industrial organisation may provide more nuanced insights on why and how the trade of differential agri‐food commodities was impacted by sanctions so differently.", "journal": "Journal of Agricultural Economics", "published": "2026-08-06", "url": "https://doi.org/10.1111/1477-9552.70071", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1477-9552.70071"}, {"source": "crossref", "source_id": "10.1111/1477-9552.70066", "title": "Climate Change and Agricultural Adaptations: Insights from Iran on Crop Choices and Irrigation Shifts", "authors": "Soroush Kamyab, Layla Shiva", "abstract": "ABSTRACT Agriculture in the Middle East faces severe climate risks, including rising temperatures, declining precipitation, and more frequent extremes. This paper examines long‐run adaptation in Iran using farmland rental prices to capture overall productivity impacts. By combining cross‐sectional and panel models, we distinguish short‐run weather effects from long‐run climate responses and quantify adaptation benefits. While hotter and arid regions experience losses of −5.3% to −41.8% without adaptation, long‐run adjustments generate gains of 11.7%–15.2%, depending on climate scenarios. Farmers primarily adapt by shifting irrigation sources toward deep wells and reallocating acreage to heat‐tolerant crops. Beyond estimating the overall value of adaptation, we examine how climate change shapes these major adaptation practices, highlighting sustainability concerns, including groundwater depletion and distributional impacts in resource‐constrained, developing‐country settings. Our findings link long‐run climate responses to both productivity gains and sustainability trade‐offs.", "journal": "Journal of Agricultural Economics", "published": "2026-08-06", "url": "https://doi.org/10.1111/1477-9552.70066", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1477-9552.70066"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70150", "title": "How Environmental Provisions in Regional Trade Agreements Drive Agri‐Food Export Quality Upgrading?—A Regulatory Perspective", "authors": "Ronghua Zhai, Hongman Liu", "abstract": "ABSTRACT Environmental provisions have become important to Regional Trade Agreements (RTAs) and are key in promoting high‐quality trade. Using matched data from China Industrial Enterprise Database and China Customs Database, this study explores the non‐linear impact of the depth of RTA environmental provisions on agri‐food export quality upgrading and its mechanisms. Results show a significant ‘U‐shaped’ effect; beyond a 0.48 depth threshold, environmental provisions exert a sustained positive impact on agri‐food export quality upgrading. Heterogeneity analysis reveals divergent effects across national, firm, product quality and specific provision dimensions, with the ‘Balance between environment and trade/investment’ clause being the dominant influencing factor. We further reveal that cost constraints and innovation compensation effects are the key drivers behind the nonlinear impact. Therefore, this study benchmarks against high‐standard international trade rules and proposes policy recommendations for achieving high‐quality agricultural development.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-08-06", "url": "https://doi.org/10.1111/1467-8489.70150", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70150"}, {"source": "crossref", "source_id": "10.1111/1477-9552.70068", "title": "Agri‐Food Policymaking in More Turbulent Times: Reflections at the Centenary of the Agricultural Economics Society", "authors": "Alan Matthews", "abstract": "ABSTRACT Agricultural and food policy is increasingly shaped by geopolitical instability, ecological constraints, technological disruption, political polarisation and declining trust in expertise. At the same time, calls for food system transformation have gained prominence as evidence accumulates on the environmental, health and social shortcomings of current food systems. Yet reform has frequently stalled despite extensive scientific analysis and broad recognition of the need for change. This paper examines why. After reviewing some traditional explanations for policy persistence, the paper introduces the concept of policy ontologies: underlying ways of understanding what the food system is, how it functions, what it is ultimately for and how change occurs. Three ideal‐type ontologies are identified: a productivity ontology, a power‐focused ontology and an ecological ontology. These ontologies shape the definition of policy problems and the selection of preferred policy responses, helping to explain why stakeholders often appear to talk past one another. As the Society begins its second century in a more turbulent and contested policy environment, the profession's central role remains the production of rigorous evidence. That contribution will be strengthened by a greater awareness of the different ways in which food systems are understood and of how these perspectives shape both policy debates and the interpretation of evidence. Recognising these underlying assumptions can help agricultural economists contribute more effectively to policy debate as honest brokers of policy alternatives.", "journal": "Journal of Agricultural Economics", "published": "2026-08-05", "url": "https://doi.org/10.1111/1477-9552.70068", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1477-9552.70068"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70152", "title": "The Price of a Horn: How Governance and Policy Shape an Illegal Wildlife Market", "authors": "Vu Hoai Nam Dang, Frank Jensen, Martin Reinhardt Nielsen", "abstract": "ABSTRACT Understanding the determinants of illegal rhino horn prices can provide information for the design of policies to conserve wild rhinoceroses. Using a theoretical model, we identify empirical measures that may affect illegal rhino horn prices and derive testable hypotheses about their expected effects. We test these hypotheses using time series data on actual illegal market prices of rhino horn in Vietnam. The price data were collected from consumers who purchased rhino horn in Vietnam between 2001 and 2020. Assuming that the illegal rhino horn markets in China and Vietnam are perfectly integrated, we examine the effects of various regulatory measures implemented in both countries. We find that China's legalisation of trade in rhino horn antiques and the implementation of an anti‐corruption campaign are associated with significant reductions in illegal rhino horn price in Vietnam, whereas Vietnam's increased sanctions on the rhino horn trade and use have no significant effects. These findings suggest that, in addition to wildlife‐specific policies, broader institutional reforms and governance crackdowns in China may substantially affect illegal rhino horn prices in Vietnam.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-08-05", "url": "https://doi.org/10.1111/1467-8489.70152", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70152"}, {"source": "crossref", "source_id": "10.1111/1477-9552.70069", "title": "Revisiting the Political Economy of Agriculture in 21st Century Food Systems", "authors": "Danielle Resnick, Johan Swinnen", "abstract": "ABSTRACT In 1932, Joseph Duncan argued in the Journal of Agricultural Economics that agricultural economists should engage more explicitly with politics. Nearly a century later, the political economy of food and agriculture has expanded in both scope and complexity. This paper revisits the evolution of political economy perspectives on agricultural policy, tracing the shift from early interest‐based explanations centered on farmers and consumers to broader frameworks that incorporate institutions, ideas and the interactions among diverse policy actors. We argue that contemporary transitions from an agricultural policy paradigm to a food systems one require a further rethinking of political economy analysis. Specifically, contemporary food systems pursue multiple and often competing objectives, including productivity, nutrition, environmental sustainability, resilience and equity, while involving a far wider array of stakeholders, from multinational corporations and transnational advocacy networks to technology firms and global governance institutions. At the same time, rising political polarization, populism, digital misinformation and the fragmentation of multilateral governance increasingly shape how policy preferences are formed, coalitions are constructed, and policy compromises are negotiated. These developments complicate traditional assumptions that preferences are driven primarily by material interests and that institutions can reliably facilitate collective action. We illustrate these changing dynamics through brief case studies of the 2024 European farmer protests, Brazil's Amazon Soy Moratorium and Mexico's genetically modified corn dispute. Each case highlights tensions between national sovereignty, global integration, environmental sustainability, and agricultural livelihoods. We conclude that understanding twenty‐first century food policy requires political economy frameworks that integrate interests, institutions, ideas and the changing geopolitical and informational context in which food system decisions are made.", "journal": "Journal of Agricultural Economics", "published": "2026-08-04", "url": "https://doi.org/10.1111/1477-9552.70069", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1477-9552.70069"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70134", "title": "Can Farmers' Tactical Decisions Jointly Lift Profits and Lower Emissions in a Mixed Enterprise Farm System?", "authors": "Michael Young, Ross Kingwell, John Young", "abstract": "ABSTRACT This study assesses how weather‐year‐dependent sheep and crop management tactics affect farm profitability and farm system greenhouse gas emissions in the central Great Southern region in Australia. To investigate the impact of farmers' tactical decisions on farm profit and emissions, a whole farm optimisation model known as the Australian Farm Optimisation Model is employed. The model describes a typical mixed enterprise farm, the weather‐year variation that underpins the farm system and the plethora of strategic and tactical management options available to the farm manager. Modelling results reveal that utilising all tactical management options increases expected farm profit by 26% and expected emissions increase by 11%; however, the emissions intensity with respect to farm profit is reduced. Access to tactical options can greatly improve profits and emissions intensity in particular types of weather‐years. Emission and profit outcomes are a combination of direct effects of individual tactics and the strategic structural shifts they trigger across the whole farm (enterprise mix, stocking rate), underscoring the value of whole‐farm optimisation models for guiding management and policy. The modelling results also reveal that assessing the value and emission impact of tactics depends on the other tactics already available to the farm manager. This indicates the need for whole farm system analysis if the stacking or bundling of tactical options in agricultural systems is to be properly understood and estimated.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-08-04", "url": "https://doi.org/10.1111/1467-8489.70134", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70134"}, {"source": "crossref", "source_id": "10.1111/1477-9552.70070", "title": "Government Policy, Low‐ and High‐Skilled Labour, and Technical Inefficiency in Chinese Agriculture, 1952–2008", "authors": "Yulong Chen, Peter F. Orazem", "abstract": "ABSTRACT We utilize Chinese provincial data to explore how government policies affected grain production between 1952 and 2008. We adapt the Caselli‐Coleman framework to allow multiple inputs including fertilizer, land and capital as well as skilled and unskilled labour. We also extend the method to allow for comparisons of production possibilities over time as well as across provinces. We derive measures of the technological frontier for Chinese agricultural production for each year over the 56‐year period. The empirical estimates illustrate how labour efficiency in Chinese grain production changed from 1952 to 2008, encompassing the Great Leap Forward (1958–1962), the collective farming period (1963–1977), and the rural economic reforms initiated in 1978. Government policies held back agricultural production in the 1960s and 1970s by limiting efficient use of labour at a time when the Green Revolution was raising grain yields dramatically throughout Asia. Reductions in labour efficiency led to a 12.9% average decline in grain output during the Great Leap Forward and little gain during the collective farming period. In contrast, rural reforms that allowed farmers to profit from production above their assigned quotas starting in 1978 significantly enhanced labour efficiency for the more skilled but had little impact on the productive efficiency of unskilled agricultural workers.", "journal": "Journal of Agricultural Economics", "published": "2026-08-03", "url": "https://doi.org/10.1111/1477-9552.70070", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1477-9552.70070"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70149", "title": "Alternative Contract Design: Analysing the Bankability of Fungible Derivative Contracts in Energy‐Only Markets", "authors": "Nicholas Gohdes, Tim Nelson, Phillip Hirschhorn", "abstract": "ABSTRACT With the retirement of 21GW of legacy coal fleet looming, the task to replace Australia's thermal capacity with alternative firmed renewable ‘bulk energy’ solutions is non‐trivial. Indeed, calibrating necessary capital investment in new plant stock with efficient economic outcomes, vis‐à‐vis cost and reliability, represents a fundamental challenge to the ‘dynamic efficiency’ ideal for energy‐only markets. Recently, a major review of Australia's National Electricity Market (NEM) has proposed that underwriting of new energy generation utilise fungible derivative contracts instead of the canonical run‐of‐plant (RoP) revenue contract design. The proposition is based upon re‐linking medium‐ and long‐term energy markets, while mitigating some of the worst externalities attributed to off‐market underwriting policies when implemented at‐scale. However, sound economic theory can collide with applied corporate finance in practice. The very basis of the RoP design has been to address the needs of capital markets vis‐à‐vis revenue quality for new‐entrant plant, making bankability a threshold issue for contract viability. This article examines a set of proposed fungible contract designs, leveraging 100 years of synthetic, stochastic market data to draw conclusions on the compatibility of contract fungibility and bankability. Findings indicate that eliminating incentive incompatibilities between plant dispatch and market signals (which are inherent in the RoP design) appears adequate to counteract ‘shape’ risk—both idiosyncratic and systematic—within the confines of a typical project finance structure. In other words, bankability and fungibility do not appear to be mutually exclusive.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-08-03", "url": "https://doi.org/10.1111/1467-8489.70149", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70149"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70140", "title": "Beyond the Private Sphere: Women's Community Participation and Household Diet Quality in Rural China", "authors": "Fei Wang, Jiaqi Huang, Jinghui Hao", "abstract": "ABSTRACT Improving diet quality remains a key challenge in post‐poverty rural China. This study examines how women's community participation, a form of public‐sphere agency, relates to household diet quality. We introduce a Food‐Weighted Dietary Diversity Index (FWDDI) that captures variation in diet quality beyond adequacy thresholds in broadly adequate settings and apply it to a three‐wave household panel. Fixed‐effects estimates show a positive association between women's community participation and household diet quality. This association is reflected in broader and more nutrient‐dense diets, with little change in consumption frequency, and in the corresponding pattern in women's intrahousehold decision‐making, consistent with information diffusion and women's decision influence as plausible pathways. This association is concentrated in women's participation in economic activities, among ever‐registered‐poor households and in villages with male agricultural wage premiums. These findings point to women's public engagement, especially in economic activities, as a potential channel for improving household diet quality, particularly where household resource constraints are tighter and women are at a wage disadvantage in local labour markets.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-08-03", "url": "https://doi.org/10.1111/1467-8489.70140", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70140"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103130", "title": "Greenwashed groceries: prevalence and patterns of environmental marketing and greenwashing in the retail food sector", "authors": "Erin O’Dwyer, Jennifer Weeks, Eric B. Rimm, Kevin Cody, Emma-Louise Aveling, Teck Ming Tan, Erica L. Kenney", "abstract": "", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103130", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103130"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103139", "title": "Assessing the economic effects of veterinary antimicrobial use reduction policies: China’s experience and worldwide implications", "authors": "Ruishi Si, Hao Zhao, Sitong Pan, Yongfeng Tan, Mingyue Liu", "abstract": "", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103139", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103139"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103118", "title": "Healthier diets: a global economic modelling study of income and employment impacts across regions", "authors": "Adam M. Komarek, Dirk Willenbockel, Shahnila Dunston, Nicola Cenacchi, H. Charles J. Godfray, Daniel Mason-D’Croz, Timothy B. Sulser, Keith Wiebe", "abstract": "Interest has grown in how to achieve healthy, sustainable, and affordable human diets. The potential income and employment effects of a transition towards healthier diets have received much less attention. We simulate aggregate and sectoral income and employment for business-as-usual and healthier diets for all geographic regions up to 2050 using scenario-based modelling. These healthier diets can increase food’s share of household expenditure in some regions, for example from 18% to 25% in East and Central Africa in 2050. Our results suggest that a global shift towards healthier diets leads to a reallocation of primary factors of production, especially low-skilled labour and capital, from non-agricultural sectors to crop agriculture in parts of sub-Saharan Africa and South Asia. Notably, in 2050, with healthier diets, agriculture’s share of low-skilled labour increases by 3.2 percentage points in East and Central Africa and 1.5 percentage points in South Asia excluding India. Although Gross Domestic Product increases in these regions relative to business-as-usual, this reallocation raises agriculture’s share of Gross Domestic Product, consistent with a slower pace of long-run structural transformation. The reallocation leads to a mild increase in wages for low-skilled workers relative to high-skilled workers in most of these regions, compared to business-as-usual. However, in parts of sub-Saharan Africa, food price increases outweigh wage gains for low-skilled labour, reducing real purchasing power. Policies that encourage healthier diets may also alter income and employment and reduce economic welfare of poor populations in some regions, so care is needed in policy design to avoid adverse unintended consequences.", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103118", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103118"}, {"source": "crossref", "source_id": "10.1016/s0306-9192(26)00121-1", "title": "Editorial Board", "authors": "", "abstract": "", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/s0306-9192(26)00121-1", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/s0306-9192(26)00121-1"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103131", "title": "Agricultural workers’ employment cycles and churn in the Supplemental Nutrition Assistance Program: A descriptive analysis", "authors": "Casey J. McNichols, Charlotte E. Ambrozek, Timothy K.M. Beatty", "abstract": "", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103131", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103131"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103138", "title": "From field trials to farm adoption: identifying the productivity effect of on-farm technology adoption", "authors": "Kristiina Ala-Kokko, Jesse B. Tack, Jisang Yu", "abstract": "Technology adoption is an important farm management decision and is frequently made using information that is unavailable to the researcher. Aside from their own experiences, producers often rely on extension services to inform their adoption decisions. Here, we propose a novel instrumental variable (IV) approach to identify the effect that a new technology, genetically modified (GM) corn, has on farm yield using instruments constructed from extension information. The proposed approach allows us to explore the degree to which endogeneity bias is present in the GM adoption effect on farm productivity. Candidate instruments are constructed from variety trial data to resemble information acquired by producers from university extension variety trial reports and are spatially merged with on-farm production data. We find that failure to account for the endogeneity of the adoption decision does indeed result in an upward bias in the estimated productivity gains. After correcting for this bias through our IV approach, GM corn results in large on-farm yield gains of 19.6 bushels per acre. We demonstrate that variety trial data can be used to estimate the on-farm impact of new technology, and this approach is general enough to be applied to additional contexts (i.e., technologies, crops, and/or locations).", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103138", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103138"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103129", "title": "Managed urbanization and agricultural productivity: evidence from China’s New-type urbanization pilot program", "authors": "Tianxiang Li, Yuanyi Liao, Tomas Baležentis, Zhiyang Shen", "abstract": "", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103129", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103129"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103134", "title": "The integrated food security phase classification system: seven defining characteristics", "authors": "Hope Michelson, Erin Lentz, John Armstrong, Kaija Korpi", "abstract": "The Integrated Phase Classification (IPC) is the global standard for analyzing and classifying food insecurity, including famine. While media attention tends to focus on IPC famine analyses, the IPC conducts most of its analyses in non-famine contexts, providing critical assessments of sub-national food insecurity. These analyses guide considerable humanitarian intervention and investment. We argue that IPC analyses are most valuable and effective when users understand the processes, data, and methodological safeguards that underlie and inform IPC findings. We present and discuss seven essential characteristics to clarify IPC operations and interpretation including its analysis framework, consensus-based processes, reporting output interpretation, and famine classification protocols. These seven characteristics are key to the IPC’s capacity to monitor dynamic, overlapping and chronic circumstances of food insecurity. We discuss the strengths and limitations of these characteristics, and we work through implications for interpreting and applying IPC outputs. While our primary objective is to clarify IPC processes, we conclude with a section that is more normative, discussing the IPC’s role and significance in the current global humanitarian system. At a time of significant strain on the humanitarian system and in the face of a loss of practitioner expertise at all levels, a more complete understanding of the IPC’s processes will enhance its utility in an increasingly constrained humanitarian landscape.", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103134", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103134"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103141", "title": "Assessing the environmental implications of sustainable public procurement of food", "authors": "Michael Martin, Sofia Lingegård", "abstract": "Sustainable public procurement (SPP) is increasingly recognized as a policy tool to improve the environmental performance of food systems, yet there is limited empirical evidence on how procurement strategies influence environmental outcomes. This study assesses the environmental implications of municipal food procurement in a rural Swedish region using life cycle assessment (LCA). Procurement data from Östersund Municipality were used to construct baseline and alternative scenarios that reflect policy targets and objectives, including increased sourcing of organic and local foods, substitution of beef with game or legumes, and reductions in plate waste. Environmental impacts were evaluated using the Impact World + method across multiple indicators, including climate change, eutrophication, biodiversity, toxicity, and resource use. The results show that procurement strategies have differing effects across impact categories. Measures targeting food composition and consumption, such as reducing beef consumption and plate waste, lead to consistent reductions across several indicators, whereas strategies focused on sourcing and production methods, such as organic and local, yield more mixed outcomes, with improvements in some categories but increases in others. Substituting minced beef with local game and reducing food waste result in the largest overall reductions, while increasing organic procurement leads to relatively small changes across most indicators. These findings highlight the importance of multi-indicator assessments and show that focusing on a single indicator, or target, risks overlooking trade-offs. The study provides empirical evidence supporting more targeted, evidence-based procurement strategies and highlights the need for improved life cycle inventory data.", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103141", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103141"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103112", "title": "Is newer better? The effect of varietal age on real-world maize yield in Kenya", "authors": "Michael K. Ndegwa, Paul N. Nyangáu, Sarah Kariuki, Moti Jaleta, Hope Michelson, Jill Cairns", "abstract": "Maize varietal turnover is widely promoted across Sub-Saharan Africa to improve crop productivity and increase food security, yet its impact on yields remains poorly understood amid heterogeneous agroecological and socioeconomic conditions. This study quantifies the yield effects of varietal age in Kenya using a three-wave panel survey (2023-2024) of 4,160 smallholder households across Kenya. Using entropy balancing and weighted regression models to isolate the effect of varietal age on maize yield, we find a strong and consistent relationship between varietal age and yield. New varieties yield 147 kg/ha more than old ones in the long rains and 91 kg/ha more in the short rains. Finer age categorization reveals that switching to ultra-new varieties (0-5 years) delivers the highest gains-360 kg/ha over ultra-old varieties (21+ years) in the long rains and 269 kg/ha in the short rains. These findings suggest that slow varietal turnover carries significant opportunity costs in the form of forgone yield gains. While farmers generally perceive new varieties favorably-particularly for yield potential, early maturity and grain quality-concerns around labor intensity and resilience remain, potentially dampening adoption. Providing farmers with clear, locally relevant performance data and opportunities for on-farm experimentation can help shift perceptions and support wider uptake. Policies and programs that expand access to newer, better-performing varieties and strengthen seed quality assurance are essential for translating genetic gains into productivity improvements across Kenya's bimodal maize production systems.", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103112", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103112"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103117", "title": "Do Producer organizations Promote Climate-Smart Agriculture? assessing direct and spillover effects in Nigeria", "authors": "Abebayehu Girma Geffersa, Martin Paul Jr. Tabe-Ojong", "abstract": "Climate change threatens the livelihoods of millions of smallholder farmers in sub-Saharan Africa and beyond, yet the adoption of Climate-Smart Agriculture (CSA) remains low. In this paper, we examine the role of producer organizations (POs) in promoting CSA adoption among their members and non-members through spillover effects. We rely on a three-wave panel dataset of over 1,500 farm households fielded between 2017 and 2019 and estimated the multivariate probit model to capture interdependencies in adopting four key CSA practices: climate-resilient groundnut varieties (CRVs), organic fertilizers, crop rotation, and intercropping. We also examine the association between POs and the adoption intensity of CSA practices, including number of CSA practices used and area under CRVs. Employing the Mundlak–Chamberlain device to address time-invariant unobserved heterogeneity, we find that PO membership is positively associated with the adoption of CSA practices. Beyond the independent use of these CSA practices, we also highlight a positive association between POs and both the adoption intensity and the joint use of these practices which indicates bundling. Importantly, positive spillover effects are observed among non-members, especially for low-cost, easily observable practices such as intercropping and crop rotation, indicating the role of peer learning and informal networks. Conversely, spillovers are less evident for input-intensive practices such as CRVs and organic fertilizers, highlighting the need for targeted support. The results point to two distinct adaptation pathways: a technology-driven strategy reliant on financial and institutional resources, and a diversification-driven strategy based on cost-effective, observable practices. Overall, the study demonstrates the critical role of POs in fostering resilient and sustainable agricultural systems through both direct engagement and community-wide spillovers.", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103117", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103117"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103143", "title": "Market connectedness and price spillovers in Ghanaian maize and yam markets: Implications for food security", "authors": "Noah Larvoe, Muhammad Adzran Che Mustapa, Muhammad Ramzan, Edward Martey, José M. Gil, Zein Kallas", "abstract": "Integrated staple food markets are essential for food security in sub-Saharan Africa, where national production is often sufficient but spatial disparities limit access for households in deficit regions. This study examines price connectedness in maize and yam markets across ten major regions in Ghana and assesses how transmission patterns respond to domestic and global shocks. Using monthly wholesale prices from January 2006 to December 2024, we employ a dynamic Quantile Vector Autoregression framework to estimate spillovers across the full distribution of price movements. The results show strong integration in maize markets, with total dynamic connectedness averaging 92 %. Major assembly and transit markets, including Kumasi, Techiman and Bolgatanga, consistently transmit price shocks, while coastal consumption markets such as Accra and Takoradi receive them. Yam markets exhibit weaker and more variable integration, with an average connectedness of 87 % and a more dispersed structure of price leadership across regions. For both commodities, connectedness strengthened during the 2008 food price hikes, whereas connectedness during the COVID-19 period was uneven and volatile. In contrast, political regime changes in 2009 and 2017 do not generate substantial shifts in market connectedness, highlighting the dominant role of structural supply chains and trader coordination over short-term political events. The findings identify regional markets where households face greater exposure to price volatility and highlight the importance of spatially targeted investments in transport, storage and market coordination alongside measures to manage shock transmission and reduce vulnerability to price volatility and unequal food access.", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103143", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103143"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103132", "title": "Premium procurement channel access and farm-gate prices: evidence from rice farmers in China", "authors": "Junjie Li, Jianping Li, Qin Xiao, Haixia Wu, Di Liu", "abstract": "", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103132", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103132"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103137", "title": "Framing plant-rich eating: an analysis of nutritional public policies in Portugal", "authors": "Cristina Romanelli", "abstract": "The ways in which governments legitimize and promote plant-rich eating remain underexplored, particularly in contexts where animal-based foods retain strong cultural and political significance. Focusing primarily on nutritional governance, this study examines the institutional mechanisms through which plant foods and plant-rich practices have been framed as objects of public intervention in Portugal since the inception of the National Program for the Promotion of Healthy Eating in 2012. Adopting a qualitative, discourse-oriented, and semiotically informed approach, the study conceptualizes public intervention as a dispositif that actively shapes meanings and norms around food. Findings show that the legitimization of plant-rich eating relies on strategically cautious discourse emphasizing health, sustainability, and heritage, while avoiding explicit advocacy of vegetarianism. The Mediterranean diet emerges as the primary legitimizing model, enabling plant foods without challenging the centrality of meat and fish. Risk prevention and responsibilization further structure these discourses, framing citizens as self-monitoring consumers. Ultimately, plant-rich eating is cautiously legitimized yet continually negotiated, absorbed into broader narratives of health, sustainability, and national identity. As the first European country to legally require the availability of vegetarian meals in public canteens, Portugal offers insights for other national contexts, particularly regarding discursive strategies, risk-based governance, the symbolic status of animal and plant products, and the role of institutional environments in normalizing plant-rich eating. These findings also resonate with developments elsewhere while highlighting context-specific dynamics.", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103137", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103137"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103113", "title": "Food systems policy coherence: A ten-country assessment", "authors": "Stella Nordhagen, Mahamadou Tankari, Jamie Morrison, Julie Collins, Kelly Parsons, Danielle Resnick, José Valls Bedeau", "abstract": "Policy coherence is widely recognised as essential for achieving food systems transformation, but attempts to assess food systems policy coherence have been limited to date in terms of their scope of topics and geographies and lack of comparable methods. This paper introduces the Food Systems Policy Coherence (FSPC) Diagnostic Tool and uses it to analyse food systems policy coherence across 10 low- and middle-income countries in Africa and Asia through key informant interviews (n = 189) and review of policy documents (n = 808). The FSPC Diagnostic Tool considers two aspects of policy coherence: (1) the structures and mechanisms that may contribute to achieving stronger policy process coherence and (2) coherence between policies from six sectors and ten common food systems goals. Regarding the former, all countries analysed had strong framework documents for cross-sectoral food policy, backed by high-level political commitment, but they tended to be much weaker when it came to capacity for implementation and especially monitoring and accountability. Policy coherence across sectors was generally strong for the goals of climate change adaptation and social protection but weaker for goals of healthy diets for all, adequate wages for food system workers, and climate change mitigation through food systems. Trade policy was the policy area with the greatest incoherence with a diverse range of food systems goals. The results offer the most comprehensive analysis of food systems policy coherence to date. The tool makes a useful contribution to measuring policy coherence and can serve as both a foundation for future research and enhance accountability for achieving coherent policy outcomes.", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103113", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103113"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103120", "title": "Understanding Nutrient - Contaminant Tradeoffs in fish consumer preferences: Evidence from Kenya", "authors": "Kira Lancker, Christopher B. Barrett, Kathryn J. Fiorella, Christopher M. Aura, Hezron Awandu, Fonda J. Awuor, Patrick Otuo", "abstract": "Fish consumers are often challenged by tradeoffs between nutritional benefits and contaminant risks, which increase due to environmental pollution. Health campaigns and labeling initiatives can guide decision-making by providing information both on contaminant risk and nutritional value of a product, but it is not well understood how consumers react to such complex dual labels. We use data from a stated choice experiment in Kenya’s Lake Victoria region to study how consumers respond to dual labels on fish products, and how their responses to each label interact. We focus on the tradeoff between polyunsaturated fatty acids and contamination with microcystins, a class of toxins produced by harmful algae blooms that can accumulate in fish tissue. Our findings suggest that, faced with a dual information policy, consumers react rationally to dual health attribute labeling, and that nutrient labels and contaminant warnings can function concurrently, indeed even be mutually reinforcing, but pose a risk of inadvertently concentrating unhealthful consumption in less responsive subpopulations.", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103120", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103120"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103119", "title": "Estimating plant-based milk impacts on U.S. fluid milk prices and quantities", "authors": "Sangwon Lee, Daniel A. Sumner", "abstract": "Per capita consumption of fluid cow’s milk has declined steadily in North America and Europe. In the United States, that well-known decline accelerated in percentage terms in the past two decades as the market for plant-based substitutes surged. This paper documents and explains significant impacts of plant-based products on the retail prices and quantities of fluid cow’s milk products in the United States, using a discrete-choice model of milk product demand with random coefficients. Demand estimates based on household purchase and store scanner data from 2018 to 2020 show that plant-based milk is more substitutable for organic and lactose-free cow’s milk products than for conventional cow’s milk. Based on our demand estimates, if plant-based milk products had not been available in the consumer choice set, the retail quantity of organic cow’s milk would have been 14.5%, lactose-free cow’s milk 10.2% higher, and conventional cow’s milk by 7.7% higher. The absence of plant-based alternatives would increase annual retail purchases of fluid cow’s milk by 1.46 gallons for a representative survey of households. In these data, each gallon of plant-based milk displaced 0.68 gallons of cow’s milk. While plant-based milk continues to affect the demand for fluid cow’s milk products, especially the higher-priced organic and lactose-free products, evidence shows that it has not been the primary driver in the recent accelerated decline in the consumption of fluid cow’s milk.", "journal": "Food Policy", "published": "2026-08-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103119", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103119"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103121", "title": "The state of global food insecurity measurement: A mix of methods, and a mix of messages", "authors": "Derek Headey", "abstract": "Robust food insecurity indicators are needed f
