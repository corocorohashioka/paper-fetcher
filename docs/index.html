nd resident participants, 72.0% relied mainly on customary arrangements, while only 15.0% held a registered land title. Coastal sectors with greater tourism development also show higher land values, a stronger concentration of formal transactions near the shoreline and more conflicts over access, enclosure and territorial control. Formal registration remains easier for actors with greater financial resources and stronger administrative networks. Within the Amborovy coastal sector, particularly in Marohala, Petite Plage and Grand Pavois, fences and tourism facilities restrict public access to the shore and reduce spaces used by fishing households. Existing land management tools therefore give limited protection to long-established occupants during rapid market change. The findings support closer coordination between land administration, local land uses and public coastal access. The case extends debates on legal pluralism and tourism-led land restructuring to secondary coastal cities in the Global South.", "journal": "Land Use Policy", "published": "2027-01-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108300", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108300"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108278", "title": "Rethinking land readjustment: Fit-for-purpose rules for joint use in real estate development", "authors": "Terje Holsen, Per Kåre Sky, Cathrine Liss Hoddevik, Helen Elisabeth Elvestad", "abstract": "Urban development frequently requires land assembly, cross-parcel coordination, and allocation of costs and benefits created by zoning plans. In Norway, property-formation tasks typically rely on cadastral procedures that depend on voluntary agreement and may involve multiple fragmented, sequential, and time-consuming approvals. This article examines whether organizational instruments under the Land Consolidation Act – rules on joint use, orders for joint measures, and governance arrangements – can function as a less invasive and more efficient complement to physical reallotment in urban land readjustment. Using a structured review of Norwegian zoning plans and Land Consolidation Court decisions, supplemented with targeted literature, we identify (i) coordination problems these instruments can address, (ii) their legal effects and constraints, and (iii) practical conditions for implementation, including loss-prevention rules and transition to later physical property formation. We conclude that organizational instruments are best suited for early-phase cooperation and shared functions (e.g., access, infrastructure, common areas), reducing transaction costs and holdout risks when physical reallotment is premature. We discuss implications for ‘fit-for-purpose’ land readjustment and outline how comparable rule-based joint-use solutions may be adapted to resource-constrained contexts, provided that legal clarity and registration mechanisms are addressed. In Norwegian land consolidation law traditional physical readjustment includes measures such as land exchange and the reduction of fragmentation of holdings. Organizational instruments, by contrast, operate closer to the actual coordination problems faced in urban development. As such, they represent a more fit-for-purpose response to the challenges of fragmented ownership and cross-boundary planning in transformation areas.", "journal": "Land Use Policy", "published": "2027-01-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108278", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108278"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108324", "title": "Beyond the tragedy of the commons: Spiritual legitimacy, customary land governance, and community development in Northern Ghana", "authors": "Sulemana Mumuni, Frederick Dapilah, Abdul-Matin Salifu", "abstract": "", "journal": "Land Use Policy", "published": "2027-01-01", "url": "https://doi.org/10.10 mer are well-established, the latter have received much less research attention. To fill this void, we set up a time series representing most countries around the globe describing urban population density and several explanatory variables. Using a panel regression approach with country-fixed effects we explain the variation in density levels over time. The results indicate that urban density increases with growing total urban population and decreases with increasing levels of urbanisation. The latter effect diminishes, however, when the urban population fraction increases even further. These results indicate a sequence of increasing, decreasing and stabilising urban densities with increasing urban population shares. This succession can be linked to subsequent development stages of urbanisation, suburbanisation and eventually reurbanisation. The latter stage remains rare in our time series, however, as only a few countries reach the corresponding high urbanisation rates. Furthermore, we find that urban densities decrease with growing national income per capita. This may indicate that higher incomes enable suburbanisation to more dispersed urban areas with larger residences but can also be associated with the advent of smaller households and the growth of non-residential sectors such as industry and commerce. Conversely, urban density increases with higher agricultural land values that we proxy with a novel primary production intensity variable. We use our explanatory results to determine country-specific future urban areas following a commonly applied socio-economic scenario (SSP2) and suggest the total global urban area may triple from 2015 to 2100.", "journal": "Land Use Policy", "published": "2027-01-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108302", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108302"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108293", "title": "From planar proximity to room-level depth: Nonlinear capitalization of historic landscape visibility in dense urban districts", "authors": "Zuozheng Shi, Chenfan Cai, Wenlin Zhao, Jin Rui", "abstract": "", "journal": "Land Use Policy", "published": "2027-01-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108293", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108293"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108281", "title": "High-resolution mapping of global deforestation footprints and livelihood inequalities: Toward equitable forest governance", "authors": "Dongmei Tang, Yuanzhi Yao, Hao Shi, Yecheng Xu, Xiaojuan Liu, Minyi Gao, Bingqi Xie, Xia Li", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108281", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108281"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108267", "title": "Is Transfer of Development Rights (TDR) feasible? The impact of land use and market-based tools on carbon storage", "authors": "Han Wang, Qing Kang, Zhoupeng Chen, Fengqin Li, Xin Nie", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108267", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108267"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108271", "title": "From legitimization to structured legalization: A governance framework from Türkiye’s 2018 zoning amnesty", "authors": "Orhan Ercan, Orhan Mataracı, Ümit Gedik, Erdem Ercan", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108271", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108271"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108279", "title": "The impact of high land use costs and mining royalties on mining operating costs in Turkey", "authors": "Taşkın Deniz Yıldız", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108279", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108279"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108239", "title": "A methodological framework for integrated climate adaptation and mitigation assessment in urban design", "authors": "Guglielmo Ricciardi, Guido Callegari, Mattia Federico Leone", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108239", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108239"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108258", "title": "Assessing the alignment of land consolidation policies with the Sustainable Development Goals: A case study of China", "authors": "Yasi Tian, Yice Zhang, Yan Zhang", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108258", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108258"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108272", "title": "Water management regulates vegetation recovery in photovoltaic farms across China", "authors": "Yueran Hu, Junze Zhang, Xiaoming Feng, Gazi Salah Uddin, Lingfan Wan, Sitong Cai, Yue Guo, Bojie Fu", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108272", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108272"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108270", "title": "Layered land rights under government-led decentralization: Implications for land value capture implementation in Jakarta, Indonesia", "authors": "Yescha Nuradisa Ekarachmi Danandjojo, Samira Ramezani, Johan Woltjer", "abstract": "Multiple land rights holders and layered land rights structures create fundamental challenges for implementing land-based financing methods such as land value capture (LVC). In a decentralized governance system, overlapping land rights and fragmented planning complicate coordination and limit the effectiveness of LVC for financing transport infrastructure development. This study examines how different rights holders contribute to implementing land value capture within a layered land rights and multi-level governance system in Indonesia, using the Jakarta Mass Rapid Transit (MRT) project as a case study. In Indonesia’s decentralized system, multiple levels of government apply different planning tools to regulate land use and development, complicating coordination between planning, land rights, and LVC mechanisms. Qualitative data from semi-structured interviews and policy analysis show that overlapping land rights and fragmented regulations create legal and administrative uncertainty. This uncertainty acts as a barrier to cross-governmental coordination and private stakeholder engagement, both of which are necessary for a workable LVC framework. Although a formal LVC framework exists, unclear rules on which rights holders should contribute, combined with complex administrative procedures, limit its practical use. This study contributes to the LVC literature by linking instruments to specific land rights holders and by extending the bundle-of-rights perspective. It explains why LVC remains underutilized in contexts with layered land rights and decentralized governance. The findings highlight the need for policy reforms to clarify contribution obligations, improve coordination across governance levels, and simplify the administrative process.", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108270", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108270"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108268", "title": "Measuring adaptation in action: Uncovering agricultural land-use responses to changing yields and prices", "authors": "Mansi Nagpal, Christian Klassert, Jasmin Heilemann, Bernd Klauer, Erik Gawel", "abstract": "Climate change affects agriculture directly through crop yield losses and indirectly through changes in crop prices. Farmers need to adapt their land-use decisions to these changing conditions. These decisions are made in advance and under considerable uncertainty. The extent to which farmers adapt their crop area allocations to changing yields and prices remains unclear, particularly at the national scale. We present an approach for measuring the adaptedness of observed crop area allocations to changing yields and prices in terms of the number of hectares differing from an economically optimal cropping pattern. We demonstrate the approach in a case study in Germany (1999–2020). To identify economically optimal crop area allocations under changing yields and prices, we employ an econometric mathematical programming (EMP) approach within a multi-agent system modeling framework. Over the 20 years, we find persistent changes in crop area allocations averaging 36% ±4% of each district’s agricultural area. Of these changes, 43% improved the adaptedness to today’s yields and prices. We observe a trend of increasing adaptedness over time, though significantly lower in districts facing drought conditions. Adaptation, however, prevails both under drought and non-drought conditions. Our results suggest that the economic impacts of changing yields and prices play a significant role in shaping observed land-use patterns, with important implications for land-use dynamics under climate change. Our approach opens promising avenues for further research seeking to disentangle the drivers of land-use adaptation over time and to inform future policies aimed at supporting agricultural adaptation to increasing weather extremes and changing climatic conditions.", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108268", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108268"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108235", "title": "Urban expansion, informality and climate change in intermediate cities in Latin America and the Caribbean: Challenges and opportunities", "authors": "Jobssuel Alexander Eusebio Alvarez, Eric Gielen, José-Sergio Palencia-Jiménez", "abstract": "The lack of urban planning in Latin America’s medium-sized cities, especially in the Caribbean, has resulted in uncontrolled expansion with severe implications in the context of climate emergencies. This expansion manifests through two intertwined processes: “urban sprawl,” understood as outward, land‑consuming (often low‑density) growth, and “informal settlements,” referring to residential areas developed outside formal planning, regulatory, or tenure frameworks. Although analytically distinct, both dynamics frequently overlap in intermediate Latin America and the Caribbean (LAC), where peripheral growth is predominantly driven by informal urbanisation. These cities/urban peripheries are highly vulnerable and urgently need to integrate the climate dimension into their urban development strategies. This paper analyses the scientific and grey literature published between 2014 and 2024 on urban sprawl in medium-sized cities to identify the extent to which literature incorporates the challenges of climate change. Artificial intelligence techniques were applied when searching and reviewing academic and technical sources. The results show that scientific literature is oriented towards explanation and modelling (Geographic Information Systems (GIS), simulation, artificial intelligence), while the grey literature emphasises implementation and monitoring. Both converge in the use of GIS and complement each other: the scientific production provides diagnosis and analysis; the technical, action and applicability. This division of roles, however, creates a functional asynchrony: peer-reviewed scientific production typically operates on medium- to long-term research and publication timelines, whereas technical documentation responds to shorter decision windows and implementation deadlines. This temporal misalignment, in turn, highlights the need to reinforce implementation-oriented instruments for climate adaptation (especially in highly exposed Caribbean intermediate cities) so that rapid decision-making can more effectively draw upon and operationalise scientific evidence.", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108235", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108235"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108250", "title": "Toward a responsibility system in China’s community carbon forestry management: A practice based on ordered polycentric governance", "authors": "Bohao Jin, Yanqiang Du, Xianlei Ma", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108250", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108250"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108198", "title": "Biosphere Reserves as Boundary Organisations that support landscape governance: Analysing the Biosphere for Baltic network", "authors": "Charles Westerberg, Ralph Tafon, Michael Gilek", "abstract": "This article analyses how Biosphere Reserves (BRs) in the Biosphere for Baltic network operate as Boundary Organisations (BOs) in support of collaborative landscape governance. Using Ostrom’s Institutional Analysis and Development framework in combination with BO theory, it examines how institutional arrangements, stakeholder interactions, and contextual conditions shape the capacity of BRs to convene, translate, collaborate, and mediate across governance levels. Based on case studies of seven BRs in the Baltic Sea region, the results show consistent patterns in how governance models, participatory processes, knowledge flows, and institutional recognition enable or constrain boundary functions. Effective convening and collaboration were most evident where long-standing relationships, strong trust, and cross-sectoral platforms were in place. Barriers arose from short-term project cycles, uneven participation, tensions around authority and role boundaries, and limited national-level uptake of BR-generated knowledge. Knowledge translation appeared stronger when BRs could connect scientific, local, and administrative perspectives and relate them to planning and management needs, while institutional misalignment made learning and follow-up more difficult. The findings underscore the need to balance institutional flexibility, neutrality, learning, and embeddedness to enhance the effectiveness of BRs as boundary organisations for advancing landscape governance.", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108198", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108198"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108282", "title": "Ecological impacts and countermeasures for future solar photovoltaic expansion: Based on the assessment and planning of ecosystem services", "authors": "Ruijing Wang, Jirui Gong, Guisen Yang, Shangpeng Zhang, Tong Wang, Yaohong Yu, Qin Xie, Qilu Zhuang, Zongpeng Zhang, Jinshuo Lian", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108282", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108282"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108233", "title": "Integrating landscape multifunctionality into the identification of potential land use conflict zones in cultural landscapes", "authors": "Xuewei Zhang, Shiying Li, Tao He, Wei Ren, Fangzheng Li", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108233", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108233"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108273", "title": "De facto land consolidation leads to exclusion: The role of commodity expansion in Salamina, Colombia", "authors": "Andres Suarez", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108273", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108273"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108266", "title": "Customary property rights and urban property values: Insights from Ingonyama Trust lands in Durban, South Africa", "authors": "A. Panman, C. Marx, G.M. Lincoln, N. Lozano-Gracia, R.J. Hansmann, J. Houghton", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108266", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108266"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108241", "title": "When streets collide: Urban policy responses to informal–formal work conflicts", "authors": "Hashem Dadashpoor, Mana Vahidbafandeh, Mohammad Mehdi Panahi", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108241", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108241"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108259", "title": "An XGBoost-GAN framework for mapping PM2.5 and NO2 and exploring land-use scenarios in the Sichuan Basin", "authors": "Junpai Chen, Yuxuan Tian, Junjie Yin, Xiaojing Zhu, Chenshuo Ma, Hao Zheng, Philip K. Hopke, Yuanxun Zhang", "abstract": "Understanding the spatial distribution of air pollutants is essential for supporting air-quality management and land-use planning. This study developed an exploratory XGBoost–GAN framework to reconstruct annual PM 2.5 and NO 2 surfaces and to examine model-indicated pollutant-pattern differences under land-use scenarios in the Sichuan Basin, China. Annual observations from 113 monitoring stations during 2014–2024 were combined with multi-source auxiliary rasters, including aerosol optical depth, meteorological variables, land-use/land-cover data, nighttime light, elevation, and population density. Random Forest, Long Short-Term Memory, and XGBoost models were trained using 2014–2023 data and independently evaluated using 2024 station observations. XGBoost achieved the best overall performance, with R² values of 0.71 and 0.81 for PM 2.5 and NO 2 , respectively, and was therefore used to generate 1-km baseline pollutant surfaces for 2024. Two Generative Adversarial Network (GAN) models were then trained to translate land-use images into XGBoost-estimated pollutant maps, enabling scenario experiments involving plant, built-up land, and water-body configurations. Under the condition of exploratory mode response rather than causal analysis, the scenario analysis results indicate that multiple land use layouts are related to the local decrease in pollutant concentrations estimated by the model. This study provides a data-driven approach for joint pollutant mapping and preliminary screening of land-use planning scenarios, while highlighting the need for validation with observed land-use transitions in future work.", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108259", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108259"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108292", "title": "Land-use policy architectures for brownfield regeneration: A comparative analysis of Spain and the Netherlands", "authors": "Albert Lladó-Martínez", "abstract": "Brownfield regeneration is increasingly central to sustainable land-use policy in Europe, as it supports soil protection, compact urban development, urban restructuring, and reduced pressure on greenfield land. Yet redevelopment remains difficult because contaminated land is shaped not only by market conditions, but also by the institutional design of planning, remediation, financing, and intergovernmental coordination. This article compares Spain and the Netherlands to examine how different land-use policy architectures condition brownfield regeneration. Using a qualitative comparative approach that combines doctrinal legal analysis with institutional interpretation, it analyzes four dimensions: risk allocation, planning–environment integration, value-capture mechanisms, and governance modes. The findings identify two contrasting models. Spain operates through a codified and redistributive framework in which liability and value capture are largely predefined by statute, while remediation and planning remain institutionally differentiated. The Netherlands exhibits a more integrated and adaptive model in which environmental regulation is more closely embedded within spatial planning and redevelopment relies more heavily on negotiated coordination and local administrative capacity. The comparison shows that legislative integration alone does not ensure effective regeneration. What matters more is the alignment between liability rules, financial design, and governance capacity. The article concludes that brownfield redevelopment should be understood as a land-use policy problem of institutional coordination, not merely as a technical question of remediation or a market question of land valorization.", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108292", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108292"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108260", "title": "Sustainable urban growth scenario for climate-vulnerable coastal cities: An analysis based on ubiquitous big data and a hybrid fuzzy-cellular automata", "authors": "Mehdi Azari, Sina Sadeghfam, Seyed Mostafa Hedayatnezhad Kashi", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108260", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108260"}, {"source": "crossref", "source_id": "10.1016/s0264-8377(26)00391-1", "title": "Editorial Board", "authors": "", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/s0264-8377(26)00391-1", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/s0264-8377(26)00391-1"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108291", "title": "Socioeconomic drivers of livestock browsing, and its impact on Chilean forests", "authors": "René Reyes, Gerardo Vergara-Asenjo, Yessenia Aedo", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108291", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108291"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108237", "title": "‘Rentierism’ at the peri-urban edge: Studentification, speculative land markets, and the uneven geographies of gentrification in Ghana", "authors": "Frederick Mensah, Stephen B. Liwur, Francisca Agyei, Michael Osei Asibey", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108237", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108237"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108261", "title": "Long-term impact of 3-D urban expansion on the thermal environment in the Yangtze River Delta region, China", "authors": "Chenglong Yin, Ruishan Chen, Xiangming Xiao, Yi Yin, Tim Van de Voorde, Yinshuai Li, Nan Jia, Hong Wei, Li Pan, Fei Meng, Yanbin Chen, Bo Xiong, Jiaoguo Ma, Tianhui Zhou, Chengxin Wang", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108261", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108261"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108277", "title": "Climate-policy pathways reshape cropland-expansion-driven deforestation and agricultural-carbon trade-off imbalance in the Amazon", "authors": "Wencang Shen, Zhengfeng Zhang, Walter Timo de Vries, Yuanyuan Yang, He Gao, Lu Niu", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108277", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108277"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108265", "title": "When co-managed conservation fails: Environmental degradation and state-backed dispossession of indigenous lands in communal reserves in the Peruvian Amazon", "authors": "Hernán Manrique, Daniel Hernando, Dennis Meza, Iván Brehaut, Constanza Parra", "abstract": "Communal Reserves were established as a co-management compromise between the Peruvian state and Amazonian indigenous peoples to promote biodiversity conservation and indigenous territorial rights. However, these areas face escalating land grabbing, environmental degradation and violence. This study utilizes archival, spatial, and ethnographic data to analyze the magnitude, drivers, and mechanisms of Land Use and Land Cover Change (LULCC) in El Sira Communal Reserve and its buffer zone. We find that current pressures stem from a longstanding legacy of state-led colonization and agricultural development preceding the reserve’s creation. Our spatial analysis shows that El Sira’s deforestation and agricultural expansion rates are the highest among all Peruvian Communal Reserves and their buffer zones. Finally, our ethnographic action research highlights the role of subnational governments in facilitating LULCC through state-backed dispossession of indigenous lands. Our discussion exposes the limitations of co-managed conservation in the Central Peruvian Amazon, where growth coalitions and a legacy of settler colonization provide the administrative infrastructure necessary to transform protected forests into private assets.", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108265", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108265"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108274", "title": "Emergency land take, road-network centrality and post-disaster land-use policy: Evidence from the post-earthquake reconstruction of L’Aquila, Italy", "authors": "Federico Mara, Cristina Montaldi, Francesco Zullo, Valerio Cutini", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108274", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108274"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108251", "title": "Ecosystem services supplied by urban green corridors with varying degrees of community involvement", "authors": "Kara Rüber, Lars Bodum, Thomas Elliot", "abstract": "Ensuring the provision of and access to ecosystem services is crucial to environmental health and human well-being. This study assesses the potential of urban green corridors (UGCs) to accommodate diverse interests, including by supplying ecosystem services, highlighting emerging socio-ecological conflicts. Five global UGCs are analysed as case studies through an ecosystem service assessment. A mixed qualitative and quantitative methodology is applied. The role of local communities is explored in context with the ecosystem service results. The key findings indicate that multiple ecosystem services such as local climate regulation, air quality regulation, flood protection, pollination, and recreational and aesthetic values can be supplied by these UGCs, while some provide educational and scientific research opportunities. However, the UGCs vary in their potential supply of ecosystem services due to unique case-specific characteristics. Achieving a balance between ecological and societal needs remains challenging due to conflicting interests, while infrastructure is often being prioritised, resulting in critical ecological impacts. Limited financial resources, expertise, and stakeholder collaboration challenge the long-term management of UGCs that impacts the supply of ecosystem services. The public's use of these spaces can result in disturbances and conflicts impacting the supply of ecosystem services. UGCs have the potential to serve as multifunctional spaces that address societal needs by providing ecosystem services and other benefits, such as connectivity and supporting social interaction and active mobility. However, further site-specific research is needed to investigate and enhance the supply of ecosystem services, including interactions between ecosystem services.", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108251", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108251"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108289", "title": "Multidimensional efficiency and institutional scale heterogeneity in protected areas: Evidence from Italy", "authors": "Giovanni Signorello, Marika Cerro, Laura Giuffrida, Maria De Salvo", "abstract": "Protected areas play a central role in territorial governance and the provision of environmental public goods, yet their performance is typically evaluated through effectiveness-based frameworks rather than through efficiency analysis. This study provides a multidimensional assessment of 27 Italian National Parks, conceptualized as multi-mission public organizations operating within complex territorial and institutional contexts. Four mission-specific domains - ecological performance, tourism valorization, managerial administration, and governance capacity - are evaluated using Data Envelopment Analysis within a non-radial framework that captures asymmetric inefficiencies across functions. The analysis explicitly examines the role of institutional scale, distinguishing between pure technical inefficiency and structural scale effects. Results reveal differentiated performance regimes: ecological outcomes are largely anchored in territorial endowment, whereas tourism and managerial domains exhibit both slack-driven and scale-related inefficiencies. Governance performance appears strongly conditioned by the configuration of institutional scales. These findings highlight the importance of scale alignment and mission-specific benchmarking for improving the design and coordination of protected-area governance systems.", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108289", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108289"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108287", "title": "Urban agriculture as a land-use policy instrument for protecting peri-urban agricultural land: A grid-based analysis from Erzurum, Türkiye", "authors": "Selvi Karasungur, Merve Yavaş", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.l m China", "authors": "Zekun Fan, Zhihao He, Weidong Qu", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108232", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108232"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108264", "title": "Exploring the determinants and recursive influences of land degradation and climate change adaptation technologies in Ethiopia: Evidence from a recursive multivariate probit model", "authors": "Atalel Wubalem, Jan Cools, Zerihun Nigussie, Charlotte Fabri, Amare Sewnet Minale, Sophie Van Schoubroeck, Wubante Fetene Admasu, Bosena Tegegne, Sofie Annys, Tesfaye Shiferaw, Amaury Frankl, Enyew Adgo, Steven Van Passel", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108264", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108264"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108298", "title": "From delineation to implementation of urban development boundaries: A two-stage game of land development rights", "authors": "Qilong Wang, Yong Liu, Qiaoran Yang, Qi Yin, Wenze Yue", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108298", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108298"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108269", "title": "The European No Net Land Take objective: A meta-challenge", "authors": "Antoine Decoville, Frédéric Durand", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108269", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108269"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108285", "title": "A review of collective agri-environmental schemes using a human–AI framework", "authors": "Robert Huber, Sara Ammann, Claudia Bethwell, Caitriona Carlin, Viviane Fahrni, Andrea Fürholz, Katrin Karner, Raja Imran Hussain, Gesche Kindermann, Monika Suškevičs, Sandra Uthes, Martin Schönhart, Christian Stetter", "abstract": "We systematically review collective agri-environmental schemes that support landscape stewardship in agriculture. We analyze 96 case studies across OECD countries based on 73 peer-reviewed articles. To guide this review, we develop a framework based on policy dimensions, the policy cycle, and micro-level implementation dimensions. This framework provides a basis for defining evaluation criteria and for assessing how these schemes are designed. The review combines the analytical power of artificial intelligence with expert domain knowledge. The synthesis of both enables a comprehensive examination of policy and implementation dimensions, resulting in critical insights into the schemes’ designs and functioning, and their broader applicability. Our results describe patterns of design and implementation in the reviewed literature, without establishing a causal link between the design and implementation of schemes and ecological outcomes. We find considerable heterogeneity among schemes indicating flexibility for decision-makers to adapt schemes to specific environmental targets at local scale, but that there is still significant room to enhance the role of farmers as key players in collective agri-environmental schemes. By integrating human expertise with the capabilities of large language models, our approach exemplifies how to balance and mitigate the limitations of each, increasing the transparency of the review process.", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108285", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108285"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108249", "title": "Behavioral drivers of the adoption of sustainable agricultural practices: A best-worst scaling experiment among Italian winegrowers", "authors": "Claudia Stefania Gondos, Mirta Casati, Margherita Muzzillo, Vincenzina Caputo, Elena Castellari", "abstract": "The European Union’s increasing focus on voluntary approaches to the adoption of sustainability practices calls for a deeper understanding of farmers' decision-making and the behavioral mechanisms underlying the uptake. We conducted a best-worst scaling experiment among Italian winegrowers investigating the most and least relevant among 11 behavioral factors—encompassing dispositional, social, and cognitive dimensions—associated with the decision to adopt sustainable farming practices. Moreover, we also evaluated how contextual and farm structural characteristics relate to the relative importance attributed to each behavioral factor. Results indicate that expected environmental benefits and sensitivity to environmental issues are the most important factors, followed by expected economic benefits and expected costs, whereas social approval and the behavior of other farmers are the least important. The relative importance attributed to behavioral factors is significantly associated with farm size, farm type, and perception of barriers to adoption. The perception of economic barriers is significantly associated with a lower importance attributed to most factors. From a policy perspective, our findings suggest that providing information on the costs and benefits of sustainable farming practices should be prioritized; however, this alone is likely to be insufficient without accompanying economic support for adoption.", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108249", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108249"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108275", "title": "From global benchmarking to local policy readiness: Assessing governance capacity for multipurpose cadastre implementation", "authors": "Riyanatou Medessi, Tchaa Boukpessi, El-Ayachi Moha", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108275", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108275"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108262", "title": "Heterogeneous climate risks for China's GI products under the China-EU Agreement: Disentangling effects across product categories and protection boundaries?", "authors": "Yiying Hong, Zhenbang Ma, Sijian Wang, Ruisi Luo, Yipeng Wang, Wenli Qiang, Imanmadi Duman, Ermekov Farabi Kerimbaevich", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108262", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108262"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108290", "title": "Understanding land use philosophy through ontology and epistemology", "authors": "Yousef Sakieh, Teea Kortetmäki", "abstract": "Land use planning, as a scientific discipline, is a nexus among philosophy of science, planning theories and methodological frameworks. It is built primarily upon two distinct schools of thought, landscape ecology and land ecology, each supported by different ontological roots and epistemic commitments. The methodologies in this domain have been extensively developed and refined at a technical level; however, the underlying philosophies and ethical implications remain largely implicit. Consequently, spatial planning practices can potentially be stuck in a path-dependent cycle, where ethical blind spots and methodological numbness can arise. The current study analyzes how such foundations are embedded within the theories and methodologies of influential schools of thought in land use planning, a situation which currently constitutes a research gap. We address this gap by examining the epistemological and ethical underpinnings, and their methodological and planning implications, of both schools of thought. More specifically, our examination compares the way these planning approaches conceptualize, componentize and synthesize the land for planning and how they treat integration of socioeconomic and ecological data and delineate land units. Our analysis also shows how they rely on inductive and deductive reasoning, or causal and correlational analysis and how methodological choices can affect the level of holism/reductionism and non-anthropocentrism/anthropocentrism in the methodologies. This philosophical and analytical study contributes to advancing discussion and methodological innovations in land use science.", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108290", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108290"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108295", "title": "Spatial spillovers and inequality in forest carbon emissions: Implications for land-use policy in Ethiopia", "authors": "Gemedo Furo, Zhiwen Gong, Amenu Leta Duguma, Gezahegne Seyoum", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108295", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108295"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108283", "title": "Can the ecological transition of cropland use narrow rural-urban income inequality? Evidence from China’s Huang-Huai-Hai Region", "authors": "Linpeng Yang, Yansui Liu, Cong Ou, Yurui Li", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108283", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108283"}, {"source": "crossref", "source_id": "10.1016/j.landusepol.2026.108225", "title": "Cropland abandonment threatens food security in rural Nepal: Understanding the role of long-term and seasonal migration", "authors": "Qi Zhang, Conghe Song, Sophia A. Graybill, Erin O. Sills, Rajan Parajuli, Richard E. Bilsborrow", "abstract": "", "journal": "Land Use Policy", "published": "2026-12-01", "url": "https://doi.org/10.1016/j.landusepol.2026.108225", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.landusepol.2026.108225"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103169", "title": "Simultaneous prediction of multiple dimensions of food security", "authors": "Salima Bekbolotova, Nodir Djanibekov, Thomas Herzfeld, Lucie Maruejols", "abstract": "Program officers are faced with difficult modeling choices when monitoring the state of diverse yet related dimensions of household food security. We compare results of single- and multi-output frameworks, applying both econometric and machine learning models, to jointly predict three interrelated outcomes of food security: undernourishment (access), dietary diversity (utilization), and food consumption stability (stability). Using the 2013–2022 Kyrgyz Integrated Household Survey, we evaluate generalized linear models (GLM), a multi-output generalized structural equation model (GSEM), and single- and multi-output artificial neural networks (ANNs) under both cross-sectional and temporal validation settings. The results show that accounting for non-linearity of relationships in our specifications yields greater predictive gains than modeling outcomes jointly. Among the models evaluated, the simplest model (single outcome GLM) often performs as well as others, and even better in some specifications, while also providing interpretable parameter estimates. However, accounting for non-linearity with our single-outcome ANN often achieves superior performance in low-outcome groups, which is especially relevant for policies aimed at targeting vulnerable households. Adding complexity through joint prediction of the related outcomes improves precision in some cases, but reduces recall, increasing exclusion risk. This trade-off makes such approach less desirable from both equity and implementation perspectives. The findings emphasize that complex patterns tie household socio-economic and demographic characteristics with food security dimensions. These results can guide program officers navigating the trade-offs between prediction performance, interpretability, and implementation; showing that linear models can deliver robust predictions, but specific non-linear, data-driven models might allow better targeting of vulnerable households.", "journal": "Food Policy", "published": "2026-11-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103169", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103169"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103170", "title": "Fragmented urban food governance and impacts on the marginalisation of indigenous crops in Ghana", "authors": "Gideon Baffoe, Selorm Yaotse Dorvlo, Abena Boakye, Eleanor Jew, Philip Antwi-Agyei, Andy Dougil", "abstract": "", "journal": "Food Policy", "published": "2026-11-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103170", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103170"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103167", "title": "From factories to farms: The impact of industrial environmental regulation on land quality", "authors": "Lingran Yuan, Zesen Qian", "abstract": "", "journal": "Food Policy", "published": "2026-11-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103167", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103167"}, {"source": "crossref", "source_id": "10.1002/ajae.70090", "title": "Improving access to new technologies: An experiment with Kenyan input sellers", "authors": "Sarah W. Kariuki, Francisca N. Muteti, Annemie Maertens, Michael Ndegwa, Hope Michelson, Mercy Mbugua, Jason Donovan", "abstract": "Abstract Agrodealers play a critical role in rural economies, selling essential inputs for agricultural production, stocking new products, and providing farmers with technical advice. However, uncertainty can discourage them from stocking newer, less familiar products, limiting the availability of innovative technologies and leading to market failures and low‐innovation equilibria. We provided Kenyan agrodealers with a 10% price discount on new, drought‐tolerant maize hybrids. The discount increased the likelihood that the agrodealer stocked the new hybrids and increased the share of the new hybrids in overall sales. In an information‐deprived environment, the discount encouraged dealers to gather more information about the seeds and increased agrodealers' sales effort.", "journal": "American Journal of Agricultural Economics", "published": "2026-09-03", "url": "https://doi.org/10.1002/ajae.70090", "fetched_at": "2026-09-04T10:50:33", "id": "crossref:10.1002/ajae.70090"}, {"source": "crossref", "source_id": "10.1002/aepp.70116", "title": "Assessing Government Subsidies for Reducing Pesticide Use: A Meta‐Analysis", "authors": "Gaëlle Leduc, Douadia Bougherara, Thi Thanh Mai Ha, Laure Latruffe", "abstract": "ABSTRACT In the efforts being made by governments to reduce pesticide use, subsidies are an important instrument to encourage farmers to adopt more sustainable practices. Yet, their effectiveness remains uncertain due to diverse designs and contexts. To date, there are no studies that provide systematic synthesized evidence on the potentially heterogeneous effects of subsidies on pesticide use. The present study addresses this gap by conducting a meta‐analysis of 39 empirical studies (208 models) from the EU and other developed countries that examine the effects of subsidies on (i) direct measurement of pesticide use and (ii) indirect measurement of pesticide use based on the adoption of pesticide‐reducing practices. Using probit meta‐regressions and qualitative appraisal, we find two key results. First, for EU studies, Pillar I and Pillar II subsidies from the Common Agricultural Policy (CAP) have opposite effects on pesticide use: Pillar II subsidies are more likely than Pillar I subsidies to reduce pesticide use. Second, if we consider studies from both the EU and the US, subsidies that target adoption of whole‐farm systems or bundles of practices outperform those targeting a single practice in reducing pesticide use. We provide some policy recommendations for policy design and highlight future research priorities.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-09-03", "url": "https://doi.org/10.1002/aepp.70116", "fetched_at": "2026-09-04T10:50:33", "id": "crossref:10.1002/aepp.70116"}, {"source": "crossref", "source_id": "10.1002/aepp.70127", "title": "Hedonic Modeling for Fed Cattle Price Reporting and Market Transparency", "authors": "Jason Franken, Haluk Gedikoglu, Theodoros Skevas, Mary Hendrickson", "abstract": "ABSTRACT The Livestock Mandatory Reporting Act of 1999 was enacted to facilitate price reporting and increase market transparency. With immense structural change in the cattle industry, current practices of reporting weighted average prices are becoming less meaningful. Recent studies indicate that with the collection of additional data beyond what is currently available under the act, hedonic modeling may hold potential to facilitate more meaningful price reporting. This study revisits the issue using transaction level prices from four beef packers and finds incorporating the recommended information improves hedonic models' representation of prices. Though improved model specification enhances coefficient consistency, with particularly promising results for quality grades, remaining variation in sign and significance of other daily estimated coefficients undermines the approach's ability to inform intuitive premiums and discounts for some characteristics. Future research may explore on balance the relative merit of further improvement in data collection, model specification, and increasing observations with longer multiday rolling regressions to facilitate price reporting.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-09-03", "url": "https://doi.org/10.1002/aepp.70127", "fetched_at": "2026-09-04T10:50:33", "id": "crossref:10.1002/aepp.70127"}, {"source": "crossref", "source_id": "10.1002/aepp.70126", "title": "Extension Economists: Valued in Mission, Penalized in Practice", "authors": "Trey Malone, Craig W. Carpenter, Courtney Bir, Andrew J. Van Leuven, Rebecca Wasserman‐Olin, Wendong Zhang", "abstract": "ABSTRACT As the public engagement arm of the land‐grant mission, we argue that Extension faculty in US agricultural economics departments face an identity crossroads as they struggle for institutional support. Specifically, we argue that Extension economists function as boundary‐spanning professionals within academic structures that often devalue applied engagement. Drawing on a 2025 survey of 125 members of the Agricultural and Applied Economics Association, this study examines how Extension is defined, practiced, and valued across career stages. Responses indicate broad conceptual agreement that Extension serves as a bridge between research and application, emphasizing stakeholder engagement, decision support, and public communication. However, faculty and graduate students differ in how they frame Extension's institutional role. Graduate students describe it as adaptable and stakeholder‐driven, while faculty anchor it in structured, metric‐based frameworks tied to the Cooperative Extension System. Quantitative and qualitative analyses demonstrate that Extension appointments are perceived as less prestigious than research or research‐teaching roles, exposing persistent status penalties and institutional misalignment in tenure and promotion evaluation. We conclude that current university recognition systems incentivize faculty investments away from Extension and thus require structural changes to advance Extension's part of the tripartite land‐grant mission, particularly in how Extension outputs are evaluated for tenure and promotion.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-09-03", "url": "https://doi.org/10.1002/aepp.70126", "fetched_at": "2026-09-04T10:50:33", "id": "crossref:10.1002/aepp.70126"}, {"source": "crossref", "source_id": "10.1002/ajae.70092", "title": "Premium subsidy designs and crowding out of insurance demand", "authors": "Tim Philippi", "abstract": "Abstract Crop insurance is an important instrument to protect farmers against extreme weather events. Many countries provide subsidies for crop insurance products to make insurance more affordable for farmers. The Federal Crop Insurance Program in the United States and major European crop insurance programs such as in Spain, Italy, and France focus on subsidized multi‐peril crop insurance contracts that cover losses from various natural hazards (e.g., hail, wind, drought, frost). We study how making premium subsidies more flexible and allowing farmers to buy subsidized single‐peril contracts affects insurance demand. We theoretically show that single‐peril subsidies are more effective than multi‐peril subsidies at increasing insurance demand against specific perils. Single‐peril subsidies may, however, crowd out insurance demand against other risks, when risks are correlated. Using a series of premium subsidies introduced by different German states aimed at increasing frost insurance demand of winegrowers, we compare the effects of subsidies for single‐peril (frost only) insurance contracts to the effects of subsidies for multi‐peril (hail and frost) insurance contracts. We empirically show that both subsidies lead to a similarly strong increase in frost insurance demand. We also find that single‐peril frost insurance subsidies do not crowd out hail insurance demand which is in line with our theory as frost and hail are independent risks. Our results demonstrate that allowing for more flexibility in contract choices can make subsidy programs more effective without reducing coverage against other, uncorrelated risks.", "journal": "American Journal of Agricultural Economics", "published": "2026-09-02", "url": "https://doi.org/10.1002/ajae.70092", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/ajae.70092"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103140", "title": "Local protectionism in China’s government disclosure of food safety information", "authors": "Jiangyuan Liang, Wen Lin, Shengping Shang, Jiehong Zhou", "abstract": "", "journal": "Food Policy", "published": "2026-09-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103140", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103140"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103162", "title": "Comparing carrots and sticks to create a more circular food system", "authors": "Junyoung Jeong, Yongyang Cai, Brian E. Roe", "abstract": "", "journal": "Food Policy", "published": "2026-09-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103162", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103162"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103164", "title": "Feeding a fifth of the world under land constraints: Agricultural innovation and grain yield growth in China", "authors": "Gang Wu, Jingru Chen, Sichang Luo, Changyi Jiang, Shiping Mao, Yu Zhong", "abstract": "", "journal": "Food Policy", "published": "2026-09-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103164", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103164"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103148", "title": "Food traceability systems and the probability of using chemical fertilizers and pesticides − empirical evidence using plot and farm household data from agriculture census", "authors": "Hung-Hao Chang, Yu-You Liou", "abstract": "", "journal": "Food Policy", "published": "2026-09-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103148", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103148"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103145", "title": "Assessment and valuation of government policies to improve food animal welfare", "authors": "Richard Bennett, Kelvin Balcombe, Heather Maggs, Siobhan Abeyesinghe, Gareth Arnott, Nick Bell, Andrew Butterworth, Jennifer Duncan, Cathy Dwyer, Marie Haskell, Fritha Langford, Siobhan Mullan, Christine Nicol, Niamh O’Connell, Elizabeth Rowe, Victoria Sandilands, Simon Turner", "abstract": "There is a need to assess the benefits of government policy to improve the welfare of food animals. We present a holistic, animal-centred welfare assessment method using an expert panel of independent animal welfare scientists linked to a survey of food shoppers’ willingness to pay (WTP) to improve welfare levels, using a 0–100 animal welfare scale. We apply this method to six food animal types in the UK and 15 different topical policy scenarios. We find that several current production systems have welfare scores below 50 but that some of the policy initiatives analysed could increase welfare scores substantially if implemented. We provide valuation tables of people’s WTP to increase welfare scores for each of the six animal types. Marginal WTP was found to diminish as welfare scores increased. WTP values are fully transferable across any policies affecting the animals involved and are not tied to specific production practices or contexts. The UK government has been using the method to evaluate a range of policy options to improve welfare. The method can be applied in other countries. The method enables government policy makers to better make the case for policies to improve the welfare of food animals and its application should lead to an increased likelihood of such policies being implemented. The outputs can also be used to inform consumers regarding the animal welfare provenance of the food they purchase.", "journal": "Food Policy", "published": "2026-09-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103145", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103145"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103163", "title": "Ozone pollution, cash crop production, and farmer adaptation: evidence from China", "authors": "Wanyu Ran, Xiaoguang Chen, Xiaoli Wang", "abstract": "Surface ozone pollution has emerged as a major threat to agricultural productivity, yet evidence on its impacts on high-value cash crops and farmers’ adaptive responses remains limited. Combining a household-level panel from the Chinese National Fixed-Point Survey with high-resolution pollution and weather data from 2003 to 2013, we find that rising ozone concentrations significantly reduced farm income of fruit growers, primarily driven by ozone-induced reductions in fruit yields, total production, and labor productivity. Sugar crops also experienced significant yield losses, while other cash crops exhibited negligible responses. Due to limited adaptive capacity, fruit growers responded by abandoning ozone-damaged plots, reducing input use, and reallocating labor towards off-farm employment, resulting in persistent income losses with little evidence of longer-run adjustment. In contrast, sugar producers offset yield losses by expanding cultivated area and increasing material inputs, maintaining output and income. These findings highlight the critical importance of ozone-control policies and targeted support to strengthen farmers’ adaptive capacity, particularly for fruit growers who are most vulnerable to rising ozone exposure.", "journal": "Food Policy", "published": "2026-09-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103163", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103163"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103161", "title": "Voting green, or not: what drives members of the European Parliament opposition to agri-environmental reform?", "authors": "Joaquín Villa-García Liria, Jeroen Candel, Nicolas W. Jager", "abstract": "Substantive agri-environmental policy change has not materialized within EU agri-food governance despite emerging scientific consensus on the need for food system transformation. Agri-environmental legislative proposals often face strong resistance, resulting in their weakening or reversal. Although the challenges to adopting agri-environmental legislations are clear, existing analytical tools fall short in explaining why legislative rollbacks occur. This study addresses this gap by drawing on Rational Choice Theory to examine how individual-level motivations linked to the agri-food sector influence members of the European Parliament (MEP) voting behaviour on agri-environmental legislation. Roll-call vote data and a binomial generalized linear mixed model are used to test office-seeking, policy-seeking and vote-seeking motivations. Our analysis shows that MEPs with private financial interests in the agri-food sector were more likely to vote against environmental protection across the studied agri-environmental legislations, while MEPs with stronger environmental ideological affinity were more likely to support such measures. Institutional variables, mainly political group affiliation and COMAGRI leadership of legislative files, are also significant determinants of voting behaviour. These findings suggest that individual-level motivations and institutional structures help explain the lack of consistent legislative support for agri-environmental legislations between February 2022 and July 2024. Our findings raise normative questions about the need for stronger transparency and conflict-of-interest measures in EU agricultural governance.", "journal": "Food Policy", "published": "2026-09-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103161", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103161"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103184", "title": "Editorial Board", "authors": "", "abstract": "", "journal": "Food Policy", "published": "2026-09-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103184", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103184"}, {"source": "crossref", "source_id": "10.1016/s0306-9192(26)00145-4", "title": "Food Policy Outstanding Reviewer Appreciation", "authors": "", "abstract": "", "journal": "Food Policy", "published": "2026-09-01", "url": "https://doi.org/10.1016/s0306-9192(26)00145-4", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/s0306-9192(26)00145-4"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103146", "title": "The dual role of crop-livestock diversification in household nutrition security: Evidence from rural Ethiopia", "authors": "Taye Melese Mekie, Luchen Huang, Yanjun Ren, Tadie Mirie Abate", "abstract": "", "journal": "Food Policy", "published": "2026-09-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103146", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103146"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103147", "title": "Carbon food labels have limited effects on grocery shopping behavior: Evidence from a randomized experiment", "authors": "Maiken Maier, Lukas Paul Fesenfeld", "abstract": "Demand-side food policies are increasingly recognized as important tools for aligning consumption patterns with climate change mitigation targets, and carbon food labels have attracted growing attention as a potential policy instrument. However, evidence on their effectiveness remains mixed, and causal evaluation results from assessing the effects of carbon food labels in real-world supermarket settings is scarce. This study presents evidence from pre-registered randomized field-embedded survey experiment with behavioral outcomes, combining a representative sample of 2,372 Swiss residents with transaction-level purchasing data covering more than five million daily food purchase decisions made by 1,601 consumers over several years. In collaboration with one of Switzerland’s largest grocery retailers, we evaluate the causal impact of an information treatment designed to increase awareness of one of the world’s first carbon food labels implemented in grocery stores on both stated preferences and revealed purchasing behavior. The results show that the information treatment significantly increases label awareness and leads to small but positive effects on attitudes, perceived behavioral control, and intentions to consider the climate compatibility of food purchases. When tracing these effects into revealed purchasing behavior, the treatment also affects actual food purchases, but effects are modest and heterogeneous across food categories. Rather than inducing broad shifts away from meat consumption, the information treatment primarily leads to a higher overall share of labeled products purchased, increased purchases of labeled convenience products, and a partial reallocation within meat consumption (e.g., lower beef and higher pork purchases). We find no evidence of substantial reductions in overall meat purchases or large cross-category substitutions toward plant-based foods. While heavy meat eaters do not react negatively to the treatment, men and more right-wing individuals show a modest behavioral backlash. Overall, the results suggest that carbon food labels capacity to substantially alter habitual food consumption patterns in stimulus-intensive retail environments is limited and should be thus complemented by additional demand-side measures.", "journal": "Food Policy", "published": "2026-09-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103147", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103147"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103160", "title": "Framing of ultra-processed foods in UK news media (2022–2023) and associations with quoted actors’ interests: a mixed-methods study", "authors": "Jennie C Parnham, Kiara Chang, Michael Essman, Deb Smith, Mike P Etkind, Maisie McKenzie, Prisha Shah, Milica Vasiljevic, Mark Petticrew, Martin White, Anthony A Laverty, Emma Boyland, Steven Cummins, Christopher Millett, Jean Adams, Eszter P Vamos", "abstract": "Increasing attention on “ultra-processed” foods (UPFs) and their health effects has sparked policy debate. News media influences public perceptions yet understanding of UPF framing and industry influence remains limited. This study analysed UPF framing in UK news media and trade press, exploring interests of quoted individuals and organisations. We systematically searched UK media for UPF articles in 2022–23, identifying 188 articles for mixed-methods content analysis. Articles were examined for their position towards classifying food by processing-level (accepted/contested/mixed). Framing Theory guided identification of UPF frames describing problem definitions, causes, and solutions. Actors’ interests were classified using academic journal guidelines. Half the articles (52%) accepted the UPF concept, 19% contested it, and 29% were mixed. Five frames were identified. The ‘Social Justice’, ‘Lifestyle Drift’, and ‘Science Report’ frames accepted the UPF concept, with the ‘Social Justice’ frame positioning UPF consumption as a structural public health problem requiring policy action such as taxes or front-of-package labelling. The ‘UPF Critique’ and ‘Market Justice’ frames contested the scientific basis of the UPF concept, proposing nutrient-based approaches instead. Among 116 named actors, 33% had UPF industry interests, with academics comprising 45% and industry spokespeople 11%. Actors with UPF industry interests were more commonly cited in contesting frames (e.g. ‘Market Justice’: 73%) than accepting frames (e.g. ‘Social Justice’: 10%). These findings highlight that industry influence on UPF media discourse is often obscured behind academic voices. Greater transparency around actor interests is urgently needed to ensure emerging UPF policies are shaped by independent evidence.", "journal": "Food Policy", "published": "2026-09-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103160", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103160"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103165", "title": "Implications of information presentation mode for internal and external validity in consumer experiments", "authors": "Christopher R. Gustafson, Antoine Champetier", "abstract": "", "journal": "Food Policy", "published": "2026-09-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103165", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103165"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103166", "title": "Beyond coordination: responsibility and the crisis of global food governance design", "authors": "Michael Carolan", "abstract": "", "journal": "Food Policy", "published": "2026-09-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103166", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103166"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103158", "title": "The new grain giants: the reliability of USDA’s corn and soybean production forecasts for Brazil and Argentina", "authors": "Olga Isengildina Massa, Berna Karali, Scott H. Irwin", "abstract": "", "journal": "Food Policy", "published": "2026-09-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103158", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103158"}, {"source": "crossref", "source_id": "10.1016/j.foodpol.2026.103159", "title": "Quality-driven price dispersion: Implications for testing market efficiency", "authors": "Hisaki Kono, David Ernst, Tsilavo Ralandison, Yutaka Arimoto", "abstract": "", "journal": "Food Policy", "published": "2026-09-01", "url": "https://doi.org/10.1016/j.foodpol.2026.103159", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1016/j.foodpol.2026.103159"}, {"source": "crossref", "source_id": "10.1002/ajae.70089", "title": "Farm labor scarcity and its uneven impacts on crop producers in the United States", "authors": "Srabashi Ray, Alexandra E. Hill, Iman Haqiqi, J. Edward Taylor, Thomas W. Hertel", "abstract": "Abstract This study is the first to evaluate the impacts of farm labor scarcity on producers in the United States across different crop production systems. Between 2002 and 2017, we disentangle the effects of labor scarcity from the impacts of rising commodity demand, technological change, and supply of other inputs on labor market outcomes. We leverage insights from a stylized theoretical framework, that shows labor market outcomes depend on these market forces and structural parameters like factor‐specific productivity changes, factor supply and substitutability. We implement a two‐step novel empirical strategy. First, we use constrained optimization approach to simultaneously estimate changes in input‐biased factor productivity, labor substitutability and price elasticity of labor supply for key Farm Resource Regions. Our estimates show that labor productivity in the Fruitful Rim region has stagnated relative to field crop dominant systems during our study period. This underscores the differences in capacity to adjust to labor shortages across production systems. Second, we use the first‐step estimates and a spatially explicit partial equilibrium model, to identify the responsiveness of wages and employment to reduced supply of farm workers. We find that a 1% annual decline in farm labor supply can increase hiring costs by 7.4% for specialty crop growers and 5.9% for field crop producers over the course of a decade. These can be further aggravated if trade policies increase demand from domestic producers and immigration policy further accentuate farm worker shortages. Addressing labor scarcity will be key to ensuring the long‐term sustainability and resilience of the agricultural sector.", "journal": "American Journal of Agricultural Economics", "published": "2026-09-01", "url": "https://doi.org/10.1002/ajae.70089", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/ajae.70089"}, {"source": "crossref", "source_id": "10.1111/agec.v57.5", "title": "", "authors": "", "abstract": "", "journal": "Agricultural Economics", "published": "2026-09-01", "url": "https://doi.org/10.1111/agec.v57.5", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.v57.5"}, {"source": "crossref", "source_id": "10.1111/agec.70143", "title": "Transforming Food Systems in Times of Global Disorder", "authors": "Johan Swinnen, Tamsin Zandstra", "abstract": "ABSTRACT The transformation of global food systems is affected by global shocks and geopolitical changes. After decades of reductions in poverty, hunger, and malnutrition, the past decade has seen a dramatic reversal. Challenges caused by rising conflicts, climate shocks, and COVID‐19 (CCC) are reinforced by slowing productivity growth, trade disruptions, and increasing market volatility. While transformation requires major investments in agri‐food systems, global public investment in agricultural R&amp;D has slowed, in both high‐ and low‐income countries. Reductions in development assistance further threaten investment in the world's poorest regions. But the crisis also presents opportunities. A new Agri‐food Aid and Investment Architecture (AAA) may be required, and key parts of such a financial architecture are already emerging, characterized by a larger contribution of emerging countries and the private sector, and the need for more efficient use of existing public and private expenditures.", "journal": "Agricultural Economics", "published": "2026-09-01", "url": "https://doi.org/10.1111/agec.70143", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70143"}, {"source": "crossref", "source_id": "10.1111/agec.70144", "title": "Impact of Social Networks on Farmers' Adoption of Smartphones: Evidence From India", "authors": "Sai Shiva Jayanth Reddy, Sthanu R. Nair", "abstract": "ABSTRACT Empirical research on agricultural technology adoption has largely focused on farmer and farm level attributes, giving limited attention to the social context in which adoption decisions are embedded. This study addresses this gap by examining how village‐level social networks shape smartphone adoption among farmers in Andhra Pradesh, India. Using primary survey data and network measures constructed from farmers' reported connections, we characterize each farmer's position via average network effect (ANE) and degree centrality (DC). We estimate adoption using an instrumental variable (IV) probit model to address the endogeneity of peer adoption. Contrary to findings from studies of other agricultural technologies, higher smartphone adoption among a farmer's network connections reduces farmer's own likelihood of adoption, consistent with information spillovers that reduce the private need to adopt when peers already have. Farmers who are more central within their network, however, are significantly more likely to adopt, reflecting the greater communication demands placed on well‐connected individuals. Age, social status (caste group), household size, and land ownership are also significant correlates of adoption. The findings suggest that agricultural extension programs can improve cost‐effectiveness by targeting centrally po
