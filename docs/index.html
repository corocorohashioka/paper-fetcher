, nonparametric way to estimate WTP from CV studies. Using a simulation study, we demonstrate that BART is competitive with traditional models under strict data‐generating assumptions. When the underlying data‐generating process is more complex, BART outperforms traditional models and even other machine‐learning models. Moreover, BART automatically incorporates individual heterogeneity into estimation, making it more informative than traditional nonparametric estimators. We illustrate the breadth of the model's benefits with an empirical application estimating WTP to develop an Invasive Species Rapid Response Fund in the Hawaiian Islands. We find WTP distributional differences along the margins of gender, age, and income. We also construct willingness to pay curves out of Monte Carlo Markov Chain (MCMC) draws and calculate posterior means and credible intervals using empirical cumulative distribution functions (CDFs). We find these WTP to be lower than those from the probit. Future natural extensions of BART make this method a compelling alternative for estimating WTP in CV experiments.", "journal": "American Journal of Agricultural Economics", "published": "2026-07-15", "url": "https://doi.org/10.1002/ajae.70084", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/ajae.70084"}, {"source": "crossref", "source_id": "10.1002/aepp.70114", "title": "Food Price Trends and Projections in Brazil (2018–2026): Implications for Access to Adequate and Healthy Food", "authors": "Thaís Cristina Marquezine Caldeira, Bruna Barbosa Furtado, Ana Maria Thomaz Maya Martins, Laís Amaral Mais, Ramon Torres, Rafael Moreira Claro", "abstract": "ABSTRACT This study analyzed post‐COVID‐19 trends in food prices in Brazil and projected changes through 2026. Time series from the 2017/2018 Household Budget Survey, the National System of Consumer Price Indexes, and the Continuous National Household Sample Survey were analyzed using Seasonal Autoregressive Integrated Moving Average (SARIMA) models. Between 2018 and 2024, prices of ultra‐processed food products (UPFP) decreased by 16%, while unprocessed or minimally processed foods and culinary ingredients increased, narrowing the price gap. The nominal prices of food groups rose more than nominal household income between 2018 and 2024, particularly for unprocessed or minimally processed foods and culinary ingredients. Projections indicate that UPFP will remain the cheapest group by 2026, reinforcing barriers to healthy diets and supporting tax policies.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-15", "url": "https://doi.org/10.1002/aepp.70114", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70114"}, {"source": "crossref", "source_id": "10.1002/aepp.70112", "title": "U.S. Agriculture, Biofuel Markets, and Trade: Challenges and Opportunities", "authors": "Rayan Wolf, Farzad Taheripour", "abstract": "ABSTRACT Using an enhanced Computable General Equilibrium (CGE) model (GTAP‐BIO), this study assesses how the expansion in demand for Electric Vehicles (EVs) and the reduction in exports of agricultural products induced by trade disputes negatively affect US agriculture. It then evaluates the extent to which producing Sustainable Aviation Fuels (SAFs) from corn and soybeans could mitigate these effects. Results show that EV expansion reduces gasoline demand, suppresses corn production, lowers farm incomes, and generates idled capacity, including increases in uncultivated cropland. Export tariffs further amplify these effects. Expansion in SAF produced from corn and soybean could partially limit these consequences.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-15", "url": "https://doi.org/10.1002/aepp.70112", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70112"}, {"source": "crossref", "source_id": "10.1111/agec.70131", "title": "Long‐Distance Electricity Transmission and Agricultural Productivity Growth: Evidence From China", "authors": "Zhiqiang Cheng, Jinyang Cai, Jianyu Yu", "abstract": "ABSTRACT This study examined the effect of the West‐to‐East Electricity Transmission Project in China on agricultural productivity. The project transmits electricity from the resource‐rich west to the consumer‐dense east. Using a Difference‐in‐Differences approach, we found that the project increased county‐level agricultural productivity by about USD 509.5 per person. This increase results from advances in agricultural technological progress and the development of the agricultural industry. Farmer adaptation to improved electricity supply also contributed, such as expanded irrigation, greater land allocation to water‐intensive crops, higher replanting indices, and larger‐scale operations. The project has also raised grain yields and farmers’ disposable incomes, while reducing the agricultural labor force. Only electricity transmission, not natural gas or oil, had a positive and significant effect on agricultural productivity. These results support compelling evidence for investing in large‐scale transregional electricity transmission infrastructure worldwide.", "journal": "Agricultural Economics", "published": "2026-07-13", "url": "https://doi.org/10.1111/agec.70131", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70131"}, {"source": "crossref", "source_id": "10.1111/agec.70132", "title": "Adoption Dynamics of Fungus‐Resistant Grapevine Varieties: A Real Options Approach", "authors": "Eileen Ziehmann, Niklas Möhring, Robert Finger", "abstract": "ABSTRACT Viticulture is a key economic sector in Europe, but responsible for vast amounts of fungicide use. Fungus‐resistant grapevine varieties are less susceptible to fungal diseases, reducing fungicide use by up to 80%. However, their adoption remains limited, despite their economic and environmental advantages. We develop a bio‐economic simulation model with a real options investment perspective to analyze farmers’ decisions to adopt resistant varieties, accounting for different risk factors (e.g., production, market, policy). We apply the model to the case of Swiss viticulture. Results indicate that in the short‐term, adoption barriers persist for the majority of farmers, with replanting occurring only when favorable conditions are met, such as low discount rates, high disease pressure, and available price premia. Conversely, we find that in the long‐term, as vines reach replacement age, resistant varieties are favored over traditional ones. Our findings further indicate that increases in disease pressure, for example, due to climate change, are likely to accelerate the early adoption of fungus‐resistant varieties. We highlight potential avenues for improving current support for replanting in Switzerland, for example, through market access and information provision. By integrating risk and managerial flexibility into a dynamic, real options decision‐making framework, this study provides new insights for designing effective policies to promote sustainable pest management in viticulture.", "journal": "Agricultural Economics", "published": "2026-07-13", "url": "https://doi.org/10.1111/agec.70132", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70132"}, {"source": "crossref", "source_id": "10.1111/agec.70129", "title": "Welfare Effects of Scale Transition From Smallholders to Large Farms: A Theoretical Framework", "authors": "Jia Cao, Haoran Li, Tao Xiong, Wendong Zhang", "abstract": "ABSTRACT This study develops a theoretical framework to examine the welfare effects of scale transition from smallholders to large farms. Taking hog farming in China as an example, this study focuses on the coexistence equilibrium with both smallholders and large farms and assesses the distributional effects on rural households (independent smallholders, employed smallholders, and quitters), urban consumers, and aggregate social welfare. The simulation findings reveal that the transition to large farms results in long‐term welfare losses for employed smallholsers, as well as rural households as a whole. This outcome is attributed to a reversed income effect, whereby the initial employment gains gradually diminish as the scale of transition progresses. Conversely, urban consumers gain substantial welfare improvements owing to lower retail pork prices, which are driven by the credit advantages and technological innovations of large farms. Additionally, aggregate social welfare improves as consumer surplus outpaces smallholder welfare losses. This research unpacks the intermediary step in the transition from smallholders to large farms and provides theoretical insights for agricultural transitions in developing economies.", "journal": "Agricultural Economics", "published": "2026-07-13", "url": "https://doi.org/10.1111/agec.70129", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70129"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70132", "title": "Agriculture and Natural Disasters: Evidence From the 2015 Nepal Earthquake", "authors": "Rohan Byanjankar", "abstract": "ABSTRACT This paper examines the short‐ and long‐run effects of the 2015 Nepal Earthquake on paddy production using a difference‐in‐differences framework and district‐level panel data spanning 2010–2019. We document a 10.95% decline in paddy production and a 6.94% decline in yield in earthquake‐affected districts in the short run, with effects fully dissipating over the long run. Decomposing production losses into intensive and extensive margins reveals that the intensive margin explains the majority of losses. Heterogeneity analysis shows that production losses scale with seismic intensity while yield losses operate as a common behavioural shock uniformly across affected districts. Household survey evidence confirms two reinforcing channels: a contraction in agricultural labour supply during the critical planting season and a reallocation of household resources toward reconstruction of damaged dwellings.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-13", "url": "https://doi.org/10.1111/1467-8489.70132", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70132"}, {"source": "crossref", "source_id": "10.1002/aepp.70097", "title": "What Really Drives Agri‐Environment‐Climate Measures' Adoption? Mandatory Requirements, Behavioral Traits, and Structural Factors in the\n                    <scp>CAP<\/scp>\n                    Green Architecture", "authors": "L. Sanchez‐Mata, M. Rodríguez‐Entrena, M. Espinosa‐Goded, F. J. Dessart, J. Barreiro‐Hurlé", "abstract": "ABSTRACT To increase farmer adoption of green practices, the EU Common Agricultural Policy includes both mandatory (conditionality) and voluntary instruments (eco‐schemes–ECS– and more demanding, multi‐annual agri‐environment‐climate measures –AECM–). Building on the experiment of Barreiro‐Hurle et al. (2023), which focused on eco‐schemes, this paper analyses farmers' stated willingness to voluntarily adopt AECM. Using a framed experiment with 600 farmers in Spain, Germany, and Poland, we compared two policy interventions—higher mandatory environmental requirements and an equivalent reduction in income linked to CAP direct payments—and varied their intensity. Higher mandatory environmental requirements and an equivalent income reduction reduce the willingness to voluntarily adopt AECM. We also find a positive conditional association between the intensity of ECS adoption and the willingness to adopt AECM, suggesting potential spillover effects. We further show that behavioral factors, particularly perceived fairness of compensation, environmental concern, confidence in the environmental program, and CAP entitlement, explain substantially more variation in willingness to adopt AECM than standard structural and socio‐demographic characteristics (farm and farmer features). These results have implications for the upcoming envisaged CAP green architecture.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-13", "url": "https://doi.org/10.1002/aepp.70097", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70097"}, {"source": "crossref", "source_id": "10.1002/aepp.70109", "title": "Voluntary Collective Action to Address Growing Agricultural Challenges in Two Countries: Experimental Insights and Commonalities", "authors": "Ariel Singerman, Sergio H. Lence", "abstract": "ABSTRACT We conducted two framed field economic experiments with citrus farmers in Florida, United States and soybean farmers in Argentina to investigate their willingness to coordinate pest and weed management efforts. Despite the contrast between these two agricultural contexts, we find striking behavioral commonalities. In both countries, farmers display aversion to strategic uncertainty, rely heavily on beliefs about their neighbors' actions when deciding whether to participate, and systematically underestimate the probability of successful coordination even when opportunity costs are low. These common findings across such different settings suggest that the underlying mechanisms are not context‐specific but instead reflect more general features of decision‐making under strategic interdependence, lending support to the external validity of our findings. The results highlight key psychological and economic barriers to cooperation and offer policy‐relevant insights for designing interventions to enhance participation in voluntary area‐wide pest management programs. While voluntary coordination can enhance pest management effectiveness and be pareto‐optimal, the success of the collective action depends on overcoming farmers' reluctance to participate. The evidence that farmers systematically underestimate the probability of successful coordination even when opportunity costs are low highlights a key behavioral barrier that can lead to coordination failures. Interventions that mitigate strategic uncertainty and build trust among participants—such as targeted subsidies or technical assistance—could encourage participation among farmers who would otherwise be unwilling to engage in coordinated efforts. Beyond the immediate application to pest and weed resistance management, our findings contribute to a broader understanding of cooperative behavior among farmers in the presence of strategic uncertainty.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-12", "url": "https://doi.org/10.1002/aepp.70109", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70109"}, {"source": "crossref", "source_id": "10.1111/agec.70137", "title": "Issue Information", "authors": "", "abstract": "", "journal": "Agricultural Economics", "published": "2026-07-10", "url": "https://doi.org/10.1111/agec.70137", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70137"}, {"source": "crossref", "source_id": "10.1111/agec.70133", "title": "Correction to “Weather Shocks, Livelihood Diversification, and Household Food Security: Empirical Evidence From Rural Bangladesh”", "authors": "", "abstract": "Matsuura, M., Luh, Y. H., and Islam, A. H. M. S. 2023. “Weather Shocks, Livelihood Diversification, and Household Food Security: Empirical Evidence From Rural Bangladesh. ” Agricultural Economics 54, no. 4: 455–470. In the originally published version of this article, Table 2 contained typographical errors and misaligned rows for several variables (Male, Age of HH, Household size, Schooling Year of HH, and Asset index). Furthermore, the farm size values for 2015 and 2018 were updated to their log-transformed values. These errors have been corrected, and the updated table is provided below. We apologize for this error.", "journal": "Agricultural Economics", "published": "2026-07-10", "url": "https://doi.org/10.1111/agec.70133", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70133"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70137", "title": "Shortcut Demand Elasticities and Other Convenient Approaches to Consumer Demand. By Kenneth W.Clements, HaiyanLiu, Marc Jim M.Mariano, Eliyathamby A.Selvanathan, SarojaSelvanathan and GeorgeVerikios, Springer Nature Singapore Pte Ltd, 2025, 264 pp.\n                    <scp>ISBN<\/scp>\n                    : 978‐9‐81‐963587‐0, ISBN: 978‐9‐81‐963588‐7 (\n                    <scp>eBook<\/scp>\n                    ) https://doi.org/10.1007/978‐981‐96‐3588‐7", "authors": "Yingying Lu", "abstract": "", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-09", "url": "https://doi.org/10.1111/1467-8489.70137", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70137"}, {"source": "crossref", "source_id": "10.1002/aepp.70111", "title": "Delaying the Inevitable? U.S. Screwworm Closures and Feeder Cattle Market Dynamics", "authors": "Shelby Sumner, Savannah Jones, Tania Islam, K. Aleks Schaefer", "abstract": "ABSTRACT Biosecurity trade restrictions are commonly framed as preventive measures, yet in many settings they function primarily as policies of delay: they impose immediate market costs while only postponing the arrival of biological risks. This paper evaluates that intertemporal tradeoff using the 2024–2025 US suspension of live cattle imports from Mexico in response to the northward spread of New World Screwworm (NWS). We estimate a vector autoregression (VAR) using monthly data from 2004 to 2025 to characterize pre‐ban dynamics in feeder cattle prices, Mexican import volumes, fed cattle prices, and feed costs, and construct counterfactual forecasts for prices and trade flows absent the border closures. Translating these costs into a simple break‐even framework shows that under an annual endemic‐loss assumption of $10 billion, each additional month of border closure would need to delay endemic NWS establishment by approximately 4 months to be welfare improving.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-09", "url": "https://doi.org/10.1002/aepp.70111", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70111"}, {"source": "crossref", "source_id": "10.1002/aepp.70108", "title": "Differentiated Impacts of\n                    <scp>EU<\/scp>\n                    Rural Development Measures: A Finite Mixture Evaluation of Italian Olive Farms", "authors": "Francesco Caracciolo, Marilena Furno", "abstract": "ABSTRACT This paper examines the relationship between participation in the EU Rural Development Program and the economic performance of Italian olive farms using a finite‐mixture model with inverse‐probability‐weighted regression adjustment. Based on 2010–2022 FADN panel data, it estimates heterogeneous treatment effects while correcting for selection bias. Results suggest that RDP participation is associated with higher net income, by about EUR 280/ha on average. Two farm clusters emerge, also reflecting different typologies of rural development program measure packages: family‐run farms in disadvantaged areas are often associated with agro‐climatic environmental commitments and related packages and gain about €265/ha. By contrast, more profitable and labor‐intensive farms are more frequently linked to less adopted measures and benefit only marginally. A Monte Carlo simulation assesses the estimator's performance under a controlled data‐generating process. The study highlights the need to account for structural heterogeneity in policy evaluation and supports data‐driven rural development strategies.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-08", "url": "https://doi.org/10.1002/aepp.70108", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70108"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70128", "title": "Gender and Adoption of Climate‐Smart Agricultural Practices in Developing Countries: Evidence From West African Countries", "authors": "Abraham Amoussouga Gero, Aklesso Y. G. Egbendewe", "abstract": "ABSTRACT This paper examines the influence of gender on the adoption of Climate‐Smart Agriculture (CSA) practices in West Africa. An exogenous switching treatment effect regression model with the Oaxaca–Blinder decomposition method is used in the study. Data were collected from the 2018/2019 Harmonized Household Living Conditions Survey across five West African countries. The results indicate that if female plot managers had the same characteristics as their male counterparts, their likelihood of adopting CSA practices would increase, yet it would still be lower than that of men. The decomposition analysis shows a significant gender gap favouring men in Burkina Faso and Senegal, unlike in Ivory Coast and Togo. These gender differences are mainly due to structural factors such as household size, education, access to credit, commercialisation, income, livestock ownership, family labour, pesticide use, soil fertility and the availability of agricultural extension agents and cooperatives. To effectively address gender disparities in CSA adoption, policies could focus on improving these structural conditions rather than solely on ensuring equal access to production resources. This approach would enhance policy effectiveness and empower women to better utilise their agricultural resources.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-06", "url": "https://doi.org/10.1111/1467-8489.70128", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70128"}, {"source": "crossref", "source_id": "10.1002/aepp.70106", "title": "Do Universal Free School Meals Improve the Dietary Quality of Food‐At‐Home Purchases?", "authors": "Xueying Ma, Andres Cuadros‐Meñaca, Michael R. Thomsen", "abstract": "ABSTRACT Since 2014, the number of schools offering universal free meals to all enrolled children without requiring annual meal applications has increased meaningfully. Using USDA's Purchase to Plate Crosswalk, a difference‐in‐differences framework, and a nationwide consumer panel, the effect of universal‐free‐meal exposure on the diet quality of food‐at‐home purchases is assessed in terms of the Healthy Eating Index (HEI). Consistent with earlier findings, households exposed to universal free meals reduce grocery spending by over 6%. There is no deleterious overall effect of universal‐free‐meal exposure on the diet quality of food‐at‐home purchases as measured by the HEI.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-06", "url": "https://doi.org/10.1002/aepp.70106", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70106"}, {"source": "crossref", "source_id": "10.1002/aepp.70107", "title": "Farmers' Preferences for Gene Editing Crops and Influencing Factors", "authors": "Bertolozzi‐Caredio Daniele, Vigani Mauro", "abstract": "ABSTRACT Gene editing (GE) is gaining momentum worldwide, but limited data on UK farmers' preferences hinders our understanding of its potential impact amid deregulation debates. Based on a survey of 200 English arable farmers, we employ a Latent Class Analysis and Multinomial Logit regressions to investigate current preferences for GE crops. The analysis reveals a high willingness of adoption, outlines three preference profiles, including eager, wary, and hesitant adopters, and identify factors influencing such preferences. Results spot a possible substitution effect among GE crops and agricultural insurance, and suggest farmers may adopt GE in response to growing public demand for sustainable practices.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-05", "url": "https://doi.org/10.1002/aepp.70107", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70107"}, {"source": "crossref", "source_id": "10.1002/ajae.70087", "title": "Issue Information", "authors": "", "abstract": "", "journal": "American Journal of Agricultural Economics", "published": "2026-07-02", "url": "https://doi.org/10.1002/ajae.70087", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/ajae.70087"}, {"source": "crossref", "source_id": "10.1093/erae/jbag007", "title": "Beyond determinism: Accounting for weather variability in the carbon pricing debate for EU agriculture", "authors": "Davit Stepanyan, Sebastian Neuenfeldt, Alisa Spiegel, Mareike Söder, Julio G Fournier Gabela, Florian Freund, Claudia Heidecke, Bernhard Osterburg, Alexander Gocht", "abstract": "Abstract Agriculture accounts for 11 per cent of EU greenhouse gas emissions, yet sectoral emissions have stagnated over the past two decades. This paper evaluates carbon pricing in EU agriculture by integrating stochastic yield variability into the CAPRI model. We assess how different carbon price levels affect emissions and outcome uncertainty. Results show that carbon pricing reduces emissions, and higher price levels are associated with lower uncertainty in policy outcomes. While expected results remain similar to deterministic simulations, stochastic modeling reveals greater regional and sectoral heterogeneity. These findings highlight the importance of accounting for production risk when designing agricultural climate policies.", "journal": "European Review of Agricultural Economics", "published": "2026-07-01", "url": "https://doi.org/10.1093/erae/jbag007", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1093/erae/jbag007"}, {"source": "crossref", "source_id": "10.1111/agec.70130", "title": "Beyond Metropolitan Averages: Food Demand Across Local Markets", "authors": "Justin D. Bina", "abstract": "ABSTRACT Demand estimates are commonly used to inform firm strategy and public policy, yet they can obscure important variation in demand across geographic space that is relevant for local business decisions and policy interventions. Prior work documents demand heterogeneity across countries, regions, states, and between coarse urban‐rural categories, but evidence on sub‐metropolitan variation is limited. This study documents within‐metro geographic heterogeneity in market shares and willingness‐to‐pay (WTP) for retail and foodservice protein products. I use nearly six years of publicly available survey data and random parameters logit models that include municipality interactions with alternative‐specific constants and price sensitivity to estimate municipality‐specific market shares and WTP in the Phoenix metropolitan area. Demand varies substantially across adjacent municipalities. Central Phoenix residents exhibit higher retail WTP for conventional beef, pork, and chicken products, while both central Phoenix and Scottsdale‐Tempe residents show consistently higher foodservice WTP. Median WTP in these municipalities is roughly 30–50% higher than in surrounding suburbs, whereas suburban groups exhibit similar valuations to one another. These within‐metro differences are large enough to affect targeted pricing and assortment strategies and to produce uneven distributional welfare effects from local price policies (e.g., taxes). The results suggest that investment in geographically refined demand analyses could better inform policy interventions and business decisions at the local level, where those decisions are often made.", "journal": "Agricultural Economics", "published": "2026-07-01", "url": "https://doi.org/10.1111/agec.70130", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70130"}, {"source": "crossref", "source_id": "10.1111/agec.v57.4", "title": "", "authors": "", "abstract": "", "journal": "Agricultural Economics", "published": "2026-07-01", "url": "https://doi.org/10.1111/agec.v57.4", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.v57.4"}, {"source": "crossref", "source_id": "10.1111/agec.70117", "title": "Small Midges, Major Consequences: Partial Declines in Cocoa Pollination and Their Economic Impact in West Africa and Beyond", "authors": "Falk Krumbe, Camillus Abawiera Wongnaa, Arndt Feuerbacher", "abstract": "ABSTRACT Cocoa production forms the backbone of West Africa's agricultural economy, sustaining smallholder farmers whose livelihoods depend on stable yields. Critical to these yields is the provision of pollination services by a few key species, notably, the minuscule Forcipomyia spp. While many studies have modeled the effects of complete pollinator collapse, the impacts of gradual declines remain little studied. In this study, we develop an integrated ecological–economic model that links pollinator abundance with cocoa yield, incorporating the global cocoa market and an economy‐wide framework for Ghana, one of the world's major cocoa producers. We examine scenarios in which declines in pollinator populations occur at regional, national, and supranational scales. Our analysis reveals that localized declines in pollinator populations detrimentally affect cocoa farmers and Ghana's national economy, with rural communities and low‐income households bearing a disproportionate share of the welfare losses. In contrast, widespread declines across West Africa trigger a “King effect” where rising global cocoa prices partially mitigate production losses, benefiting farmers while overall consumer surplus declines. These results highlight the necessity of conserving pollinator biodiversity to safeguard cocoa production and economic welfare at multiple scales.", "journal": "Agricultural Economics", "published": "2026-07-01", "url": "https://doi.org/10.1111/agec.70117", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70117"}, {"source": "crossref", "source_id": "10.1111/agec.70125", "title": "Food Price Crises and the Insulation of Domestic Grain Markets", "authors": "Clemens Hoffmann, Lina Kastens, Alberto Portugal‐Perez, Stephan von Cramon‐Taubadel", "abstract": "ABSTRACT Studies that analyze the transmission of food prices from international to domestic markets for large sets of countries and products assume that price relationships are time‐invariant. However, studies that look in detail at individual countries and products show that countries respond to increasing international food prices with measures that increase the insulation of their domestic markets and thus weaken international‐to‐domestic price transmission. We analyze relationships between international prices and a large set of domestic prices for wheat, yellow and white maize, and rice using a smooth‐transition error correction model. This specification relaxes the assumption of time‐invariant price transmission by allowing price relationships and domestic market insulation to vary over time depending on international price levels. The results confirm that international‐to‐domestic price transmission weakens in many countries during periods of high international prices, such as 2007/08 and 2022. Our findings highlight a collective action problem: as more countries insulate, the global trading system's capacity to buffer shocks diminishes, amplifying volatility and food security risks.", "journal": "Agricultural Economics", "published": "2026-07-01", "url": "https://doi.org/10.1111/agec.70125", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70125"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70146", "title": "Synergies or Trade‐Offs Between Environmental and Economic Outcomes? An Analysis of Agricultural Production Performance", "authors": "Wenhui Zhang, Xinli Ke, Vivian Wei Huang", "abstract": "ABSTRACT Incorporating greenhouse gas (GHG) emissions as an undesirable output of agricultural production in a directional distance function provides a better understanding of agricultural production performance. Based on balanced panel data from 126 prefecture‐level regions in the Yangtze River Basin in China, we employed a quadratic directional output‐oriented distance function to measure agricultural production performance in terms of environmental efficiency, relative shadow price of GHG emissions and Morishima elasticities of substitution between inputs. We found an upward trend, with average environmental efficiency of 0.871 during 2000–2020. This indicates that 12.9% more agricultural added value can be achieved, along with a 12.9% reduction in GHG emissions. Agricultural production in the upstream Yangtze River Basin region showed the best performance in terms of environmental efficiency. The estimated relative shadow price of GHG emissions was 4.606 and showed a negative association with environmental efficiency. Morishima elasticities of substitution indicated a substitution relationship of labour and fertiliser to land, and a strong complementary relationship between fertiliser and labour.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-01", "url": "https://doi.org/10.1111/1467-8489.70146", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70146"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70138", "title": "Economics of\n                    <scp>GHG<\/scp>\n                    Mitigation in Agriculture: Incentive Design, Economic Benefits and Behavioural Responses", "authors": "Wei Zhang, Jeffery Connor", "abstract": "ABSTRACT This special issue examines the economics of greenhouse gas (GHG) mitigation in agriculture. The papers in the issue study agricultural mitigation from three broad perspectives: the design of mitigation incentives, the economic benefits of mitigation practices and programmes, and the adoption and behavioural responses by producers, consumers and other stakeholders. The papers span a wide range of countries, production systems and policy contexts, and collectively show that translating mitigation potential into mitigation outcomes depends critically on incentive design, measurement and the actions across producers, consumers, regulators and supply‐chain actors.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-01", "url": "https://doi.org/10.1111/1467-8489.70138", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70138"}, {"source": "crossref", "source_id": "10.1111/ajar.v70.3", "title": "", "authors": "", "abstract": "", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-01", "url": "https://doi.org/10.1111/ajar.v70.3", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/ajar.v70.3"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70130", "title": "Economic Impacts of Climate‐Smart Agriculture and Forestry Practices: Evidence From the\n                    <scp>USDA<\/scp>\n                    Environmental Quality Incentives Program", "authors": "Yanggu Li, Wei Zhang", "abstract": "ABSTRACT Conservation on working agricultural lands is increasingly recognised as a critical strategy for enhancing the resilience of food systems in the face of climate change. Despite the growing funding worldwide for climate‐smart agriculture and forestry (CSAF) practices, we lack a comprehensive assessment of their economic impacts. Focusing on the impacts of CSAF practices on agricultural productivity and resilience in the United States, we estimate the effects of payments under the Environmental Quality Incentives Program (EQIP) for CSAF on county‐level yields, land rent and measures of production losses for corn, soybean and winter wheat. We also account for the potential confounding effects of land retirement through the Conservation Reserve Program (CRP). Our findings suggest that EQIP payments for CSAF practices are associated with reductions in county‐level corn production losses. In contrast, payments for non‐CSAF practices may increase loss measures. These findings highlight the importance of targeted conservation investments in improving agricultural resilience.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-01", "url": "https://doi.org/10.1111/1467-8489.70130", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70130"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70147", "title": "Issue Information", "authors": "", "abstract": "", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-07-01", "url": "https://doi.org/10.1111/1467-8489.70147", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70147"}, {"source": "crossref", "source_id": "10.1002/aepp.70105", "title": "The Cost of Uncertainty: US–China Tariff Effects on Agricultural Commodity Markets", "authors": "Raghav Goyal", "abstract": "ABSTRACT We examine the impact of US–China trade policy announcements on corn and soybean markets. Using time‐series models, our results show that prospective tariff announcements significantly increased implied volatility (IV), especially during the 2018–2019 trade war. Our results show that corn and soybean markets responded to both countries' announcements. We observe the strongest volatility impacts at the 90% and 95% strikes. Our results indicate that higher IV raised hedging costs for producers, further constricting farm margins– a 7.5% rise in IV increased soybean option premiums by approximately 3.75%. These findings highlight the financial burden imposed by trade policy uncertainty beyond its impact on commodity prices.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-01", "url": "https://doi.org/10.1002/aepp.70105", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70105"}, {"source": "crossref", "source_id": "10.1002/aepp.70104", "title": "Rural Labor Supply and Economic Opportunities: Commuting, Migration, Tariffs, and Immigration", "authors": "Peter F. Orazem, Mary C. Ahearn", "abstract": "ABSTRACT Some rural counties remain dependent on agricultural or manufacturing jobs, but an increasing proportion have diversified economics. Rural counties also differ in their abilities to commute to an urban market characterized by higher wages and labor productivity. National changes in immigration and trade policies have had heterogeneous effects on rural labor markets, with counties dependent on agriculture or food processing facing rising input costs and shrinking international output markets. Increased commuting will help some rural communities adapt, while more remote counties will face outmigration, population loss, and reduced capacity to sustain public services.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-01", "url": "https://doi.org/10.1002/aepp.70104", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70104"}, {"source": "crossref", "source_id": "10.1002/aepp.v48.3", "title": "", "authors": "", "abstract": "", "journal": "Applied Economic Perspectives and Policy", "published": "2026-07-01", "url": "https://doi.org/10.1002/aepp.v48.3", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.v48.3"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/arfe/62/2/62_102/_article/-char/ja/", "title": "Organizational–Individual Configurations Shaping Core Members’ Commitment in Specialized Farmers’ Cooperatives: An fsQCA Study in China", "authors": "Xiaotong Wang", "abstract": "This study examines how combinations of individual and organizational conditions shape organizational commitment of core members in specialized farmers’ cooperatives. Using survey data from 21 shiitake cooperatives in China, we apply fuzzy-set qualitative comparative analysis (fsQCA) to identify configurational pathways to high and low commitment. The results reveal two pathways to high commitment: one based on the complementarity between human capital and vertical integration, and another driven by large operating scale under limited external social capital. Commitment erosion occurs when individual resources exceed the cooperative’s structural capacity, leading members to seek external opportunities or experience dissatisfaction under insufficient returns. The findings point to a two-level logic of commitment formation, in which human capital serves as a necessary threshold, while the effects of individual resources depend on their fit with organizational capacity. These insights contribute to a configurational understanding of cooperative commitment and are relevant for smallholder systems facing structural constraints.", "journal": "農林業問題研究", "published": "2026-06-27", "url": "https://www.jstage.jst.go.jp/article/arfe/62/2/62_102/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/arfe/62/2/62_102/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/arfe/62/2/62_110/_article/-char/ja/", "title": "地域資源管理におけるエンゲージメント概念の構築", "authors": "柴崎 浩平", "abstract": "The purpose of this study was to construct a concept of engagement among officers of management organizations responsible for common agricultural resources. Semi-structured interviews were conducted with five young officers. Statements considered relevant to engagement were categorized into behavioral, emotional, cognitive, and social dimensions. The results indicate that engagement in resource management involved, on the behavioral side, maintaining an attitude of participating in activities as much as possible while also attempting to improve work methods and related practices. On the emotional side, it involved positively valuing newly formed connections and interactions with farmers, maintaining interest in the management system, and taking pride in one’s role as an officer. Cognitively, it included recognizing the significance of the organization and its activities while striving to understand the management system. The social dimension entailed showing respect for predecessors who had sustained the community while also maintaining a desire to contribute personally.", "journal": "農林業問題研究", "published": "2026-06-27", "url": "https://www.jstage.jst.go.jp/article/arfe/62/2/62_110/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/arfe/62/2/62_110/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/arfe/62/2/62_118/_article/-char/ja/", "title": "労働者協同組合による農業経営の意義と課題", "authors": "内山 智裕", "abstract": "This study examines the emerging role of worker cooperatives in farm management under Japan’s Workers Cooperative Act (2022), focusing on the Tsukuba Workers Cooperative, established in 2025 by three rice farmers in Tsukuba City. Drawing on field interviews and internal documents, this study explores the cooperative’s organizational characteristics, management practices, and institutional context. The findings suggest that the worker cooperative model may offer a framework for collective farm management emphasizing member participation, equality in decision-making, and non-profit-oriented principles. At the same time, the case reveals several institutional and practical constraints, including complex administrative procedures, financing challenges, and restrictions imposed by the Agricultural Land Act. Rather than presenting definitive evidence, this study positions the Tsukuba case as an initial empirical reference for discussing the potential and limitations of worker cooperatives in the agricultural sector. Further comparative and longitudinal research will be needed to assess their long-term sustainability and broader applicability.", "journal": "農林業問題研究", "published": "2026-06-27", "url": "https://www.jstage.jst.go.jp/article/arfe/62/2/62_118/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/arfe/62/2/62_118/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/arfe/62/2/62_71/_article/-char/ja/", "title": "小学生を対象とした農業体験学習の効果に関する実証研究", "authors": "嶋田 大作", "abstract": "This study examined the effects of agricultural experience programs on elementary school students. Questionnaires were administered at two intervention schools and one control school before and after their experiences in rice paddies. The effects were analyzed using the difference-in-differences method. The results indicate that students at the intervention schools showed significant increases in both their motivation to interact with local residents and their interest in living organisms within the rice paddies. In contrast, no significant changes were observed in other areas, such as interest in agriculture or attachment to the local community. These differences may stem from the program content. However, the five-point scale used in the survey may have had limited sensitivity to children’s perceptions due to ceiling effects. Moreover, the program’s effects may unfold over time, suggesting that the pre- and post-survey design may not have fully captured them. Improving measurement methods remains a challenge for future research.", "journal": "農林業問題研究", "published": "2026-06-27", "url": "https://www.jstage.jst.go.jp/article/arfe/62/2/62_71/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/arfe/62/2/62_71/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/arfe/62/2/62_78/_article/-char/ja/", "title": "有機野菜消費における知識の構造と役割", "authors": "堀江 亮祐", "abstract": "Knowledge, including subjective knowledge, objective knowledge, and product-related experience, plays a crucial role in consumer decision-making. However, the relationship between these types of knowledge and organic food purchases has not yet been thoroughly investigated. This study examines the role of knowledge in organic vegetable consumption in Japan using structural equation modeling. The results show that subjective knowledge is the strongest predictor of organic vegetable consumption, whereas objective knowledge has only a limited indirect effect mediated through subjective knowledge. Product-related experience is positively associated with both types of knowledge and directly correlated with organic vegetable consumption, suggesting its dual role as a driver of both knowledge formation and purchases. These findings highlight that enhancing subjective knowledge and offering experiential opportunities, such as farm visits and hands-on learning, may be more effective than simply providing objective information in stimulating consumer demand for organic food and supporting the transition to organic farming.", "journal": "農林業問題研究", "published": "2026-06-27", "url": "https://www.jstage.jst.go.jp/article/arfe/62/2/62_78/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/arfe/62/2/62_78/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/arfe/62/2/62_86/_article/-char/ja/", "title": "中国における農地流動化と施設野菜経営の展開", "authors": "楽 泓", "abstract": "To address the limitations of small-scale farming, farmland transfer has been promoted in China. Following the 2018 revision of the Rural Land Contracting Law, a practice has become widespread whereby village collectives retain their farmland ownership and farmers maintain contractual rights, while transferring operational rights to third parties. This study examines farmland transfer and the development of greenhouse vegetable production in S Town, located in inland China. The findings indicate that farmland transfer has enhanced both agricultural productivity and farmers’ incomes. However, the following issues were identified: (1) land rents are significantly lower than the profits from vegetable production, highlighting the need for more equitable benefit-sharing mechanisms between producers and landholding farmers; (2) although farmers retain contractual rights, it is nearly impossible for them to resume cultivating the leased land themselves, rendering their rights largely symbolic; and (3) while village collectives maintain land ownership, their role in farmland management has partially diminished.", "journal": "農林業問題研究", "published": "2026-06-27", "url": "https://www.jstage.jst.go.jp/article/arfe/62/2/62_86/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/arfe/62/2/62_86/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/arfe/62/2/62_94/_article/-char/ja/", "title": "子実トウモロコシ生産における簡易貯蔵技術導入の経済性", "authors": "野口 周", "abstract": "We analyzed the economic effects of a simple ensiling method in corn grain production. Two distinct analyses were conducted. First, break-even prices for corn grain production were compared between drying and simple ensiling methods on paddy-based farms in Ibaraki Prefecture. Second, based on production cost statistics, feed costs were compared by replacing compound feed and imported corn with corn grains stored via the simple ensiling method in dairy cattle rations. The results show that the simple ensiling method can reduce break-even price by approximately 5–15%. Furthermore, feed cost reductions were achieved even without increases in market price. Future research should focus on improving yield, enhancing storage methods, and clarifying the limitations of the distribution range.", "journal": "農林業問題研究", "published": "2026-06-27", "url": "https://www.jstage.jst.go.jp/article/arfe/62/2/62_94/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/arfe/62/2/62_94/_article/-char/ja/"}, {"source": "crossref", "source_id": "10.1002/aepp.70103", "title": "Temporary Programs, Lasting Questions: Ad Hoc Assistance in the U.S. Farm Safety Net", "authors": "Alejandro Plastina, Oranuch Wongpiyabovorn", "abstract": "ABSTRACT Large ad hoc assistance programs have returned to U.S. farm policy since 2017, operating alongside a more developed safety net built around federally subsidized crop insurance, Title I commodity programs, and standing disaster assistance. This paper reviews the renewed use of ad hoc assistance, documents its recent scale using USDA data, and examines its implications for producers and policy design. Repeated ad hoc programs may create expectations of future support while leaving uncertainty about timing, eligibility, and payment formulas. They also raise questions about crop insurance incentives, targeting, transparency, taxpayer exposure, and coordination across safety‐net tools.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-06-26", "url": "https://doi.org/10.1002/aepp.70103", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70103"}, {"source": "crossref", "source_id": "10.1111/1467-8489.70123", "title": "Australia's Search for Greener Pastures: The Foundations of the Global Genetic Resources Movement, 1926–1980. By DerekByerlee, Canberra, ACT: The Crawford Fund, 2025, 71 pp. ISBN: 978‐1‐7640211‐0‐4.", "authors": "Thomas Nordblom", "abstract": "Data sharing not applicable to this article as no datasets were generated or analysed during the current study.", "journal": "Australian Journal of Agricultural and Resource Economics", "published": "2026-06-25", "url": "https://doi.org/10.1111/1467-8489.70123", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/1467-8489.70123"}, {"source": "crossref", "source_id": "10.1002/aepp.70101", "title": "What Happens to Diet Quality When Food Prices Rise? Revealed Preference From National Household Scanner Data, 2015–2018", "authors": "Kate Schneider Lecy, Bangyao Sun, Sean B. Cash, Wenhui Feng, Andrew Thorne‐Lyman, David C. Love", "abstract": "ABSTRACT How food prices affect diet quality is an important question to design policies that can improve the nutrition and health of all Americans. This study investigates the association between food‐at‐home diet quality and aggregate food prices to understand if price movements compromise nutrition, and where price‐based policies could be an effective tool to improve population health. Using detailed household purchase data from 2015 to 2018, our findings suggest three insights. First, consumers make substitutions that largely preserve their given level of diet quality, though that level remains poor relative to recommendations for health. Second, we find minimal evidence of heterogeneous responsiveness to prices by diet quality or sociodemographic characteristics. Third, we find evidence that the substitutions consumers make in their protein choices when prices rise increase the healthfulness of their food baskets. Taken together, our study suggests that encouraging healthier diets probably requires more than pricing policies but that price‐based policies targeted at protein may be more effective than other food groups. That we fail to find evidence of differential responsiveness of diet quality to prices suggests that universal (untargeted) policies can be recommended to improve diets across the population. JEL Classification: D12, I12, Q18", "journal": "Applied Economic Perspectives and Policy", "published": "2026-06-25", "url": "https://doi.org/10.1002/aepp.70101", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70101"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_283/_article/-char/ja/", "title": "中国の賃金高騰下における大手冷凍野菜開発輸入業者の指導機能の発揮と効果", "authors": "菊地 昌弥", "abstract": "近年，中国で賃金が高騰する構造変化のなかにあっても，中国産冷凍野菜の輸入量は価格的優位性を維持する形で，過去最高の水準で増加している．本研究では，この事象に開発輸入業者の指導機能（企業行動）が関与していたことを解明した．研究方法はわが国専業最大手の冷凍野菜開発輸入業者と，その主要な仕入先である中国山東省の製造企業のケーススタディを採用した．入手した企業データを分析した結果，指導機能により現地の製造企業では労働生産性が2倍向上していた．また高い頻度で指導する仕入先グループと，そうではないグループ間でクレームの発生頻度の平均値差の検定を通し，品質面でも指導機能が有益であることを明らかにした．", "journal": "農業経済研究", "published": "2026-06-25", "url": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_283/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/nokei/97/4/97_283/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_301/_article/-char/ja/", "title": "庭先直売所の顧客価値向上に向けた直売所リアルタイム配信システムの活用", "authors": "保坂 三仁", "abstract": "We conducted a questionnaire survey of customers and interviews of farmers to identify the characteristics of customers who are most effective in using farm stands’ real-time image sharing systems. The main outcomes are as follows. First, the efficiency of purchasing behavior is higher for customers who use the farm stands more frequently in the neighborhood. Second, the effect of improving customer commitment and efficiency of purchasing behavior are greater for customers who evaluated the farm stands as selling fresh and tasty products or keeping the sales floor tidy.", "journal": "農業経済研究", "published": "2026-06-25", "url": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_301/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/nokei/97/4/97_301/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_307/_article/-char/ja/", "title": "中国農村産権交易所の融資仲介機能に関する考察", "authors": "王 雷軒", "abstract": "The rural property rights trade centers play an important role in the trade of rural resources and assets in China. This paper analyzed the centers’ loan intermediary function in the collateral loan of land use right. An analysis of the loan intermediation functions showed that it included intermediation, information provision, asset evaluation and support for non-performing loan disposal. The study of the loan intermediary function from the perspectives of the farm enterprises, financial institutions, local governments and the centers revealed that the performances of financing intermediary functions involved efforts and supports to improve the collateral loan system.", "journal": "農業経済研究", "published": "2026-06-25", "url": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_307/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/nokei/97/4/97_307/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_313/_article/-char/ja/", "title": "多面的機能支払交付金による共同活動の実態", "authors": "磯道 駿介", "abstract": "This study analyzes activity records from 38 organizations in Morioka, Iwate, that participated in Multifunctional Payment Systems from 2019-2023, to clarify the roles of farmers and non-farmers in joint activities for managing local agricultural resources. The findings reveal that while farmers play a leading role, non-farmers constituted 31% of participants, engaging in 37% of the total activities. It was observed that non-farmer participation was higher in larger organizations. Participation also rebounded after a temporary decrease due to the COVID-19 pandemic, suggesting non-farmer involvement is well-established. Non-farmers were particularly active in tasks closely linked to daily life and community-based activities.", "journal": "農業経済研究", "published": "2026-06-25", "url": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_313/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/nokei/97/4/97_313/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_319/_article/-char/ja/", "title": "小規模農業集落における用排水路管理の実態", "authors": "森脇 俊太", "abstract": "This study aims to verify whether the statistical data showing that joint maintenance of agricultural irrigation and drainage channels is more likely in communities with organizations under the Multifunctionality Payment System accurately reflect the actual situation of the communities. In a survey in City A, Niigata Prefecture, cooperation between communities as shown in the statistical data could not be confirmed in most of the communities surveyed. This study revealed that cooperation between communities in the maintenance of agricultural irrigation and drainage channels is not easy, and that the statistical data does not necessarily reflect the actual situation of the communities.", "journal": "農業経済研究", "published": "2026-06-25", "url": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_319/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/nokei/97/4/97_319/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_325/_article/-char/ja/", "title": "新型コロナウイルス感染症は消費者の食料需要を長期的に変えたのか？", "authors": "宇都宮 涼", "abstract": "While food demand shifts during COVID-19 have been widely studied, their persistence, timing, and pace remain unclear. This study examines how demand elasticities for home-cooked meals, ready-to-eat meals, and dining out evolved during COVID-19. The findings indicate that changes in the demand structure during the analysis period did not involve distinct turning points but instead occurred gradually over time. Additionally, the results suggest that the demand for all analyzed food categories became increasingly responsive to changes in price and expenditure. However, this shift progressed slowly, and the differences in elasticity between April 2019 and March 2023 were not statistically significant.", "journal": "農業経済研究", "published": "2026-06-25", "url": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_325/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/nokei/97/4/97_325/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_331/_article/-char/ja/", "title": "流域治水に対する稲作農家の意識", "authors": "栗原 伸一", "abstract": "The aim of this study is to have a better understanding of flood control measures that systematically overflow floodwaters onto agricultural lands in the watershed. To this end, we present a survey of farmers to examine their perceptions of the flood, their levels of agreement with the policy, and their assessment of the attitudes of downstream residents. The results showed that more than half of the farmers were willing to accept this flood control measure, although this number was smaller than that of the downstream residents. The characteristics of these farmers were clarified through quantitative analysis.", "journal": "農業経済研究", "published": "2026-06-25", "url": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_331/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/nokei/97/4/97_331/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_337/_article/-char/ja/", "title": "環境情報の提供がエコフィードを利用した牛肉への消費者評価に与える影響", "authors": "服部 明彦", "abstract": "This study examined how ecological information affects consumer evaluations of beef raised on eco-feed using a questionnaire and conjoint analysis. Scientific information about eco-feed’s environmental benefits increased support for its use, but its impact on purchase willingness was limited. The number of consumers less willing to purchase eco-feed beef was nearly equal to those more willing, indicating contrasting shifts in preferences. Many who purchase beef at farmers’ markets, department stores, and through hometown tax programs became more willing to buy eco-feed beef, while a portion of consumers who associate it with ethically or economically desirable traits may become less willing.", "journal": "農業経済研究", "published": "2026-06-25", "url": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_337/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/nokei/97/4/97_337/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_343/_article/-char/ja/", "title": "稲作に対する公的研究開発投資の収益性", "authors": "八畑 知礼", "abstract": "This study aims to estimate the rates of return on public R&D investments in Japan’s rice sector, using gamma lag distributed models for constructing knowledge stocks. The key findings are as follows: First, public R&D investment in the rice sector has been declining since 1994. Second, there are significant spillovers of knowledge stocks among prefectures, implying that R&D investment contributes to the productivity growth of neighboring regions. Third, the modified internal rates of return on public R&D investments exceed 10%, suggesting that the decline in investment is a critical factor contributing to the stagnation of productivity growth in Japan’s rice sector.", "journal": "農業経済研究", "published": "2026-06-25", "url": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_343/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/nokei/97/4/97_343/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_349/_article/-char/ja/", "title": "バイオベース地域経済成長における牽引産業の特定", "authors": "藤本 髙志", "abstract": "The bioeconomy includes sectors that produce bioresources, such as agriculture and forestry, and those that use them, like food and timber processing. Developing bioresource-based value chains can boost economic growth while addressing societal challenges such as food security. Our analysis of inter-industry linkages identified key sectors that drive regional economic growth, particularly those forming value chains around arable crops, livestock, and timber. We also assessed the intra- and inter-regional impacts of these linkage effects across Japan’s nine constituent regions. While approximately half of the economic benefits leak outside their originating region, this trend is less prominent in Japan’s peripheral regions.", "journal": "農業経済研究", "published": "2026-06-25", "url": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_349/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/nokei/97/4/97_349/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_355/_article/-char/ja/", "title": "移動販売事業に携わる主体間の関係に関する考察", "authors": "杉平 翼", "abstract": "The objective of this study is to elucidate the roles of various stakeholders involved in the mobile vending business in Ibaraki Prefecture. To this end, interviews were conducted with a private company and municipal governments engaged in mobile vending operations in the region. The main findings of the study are as follows: The president of the neighborhood association plays a crucial role in understanding and representing the needs of local residents. The municipality grasps the needs of the community through the president of a neighborhood association and shares this information with the business operator.", "journal": "農業経済研究", "published": "2026-06-25", "url": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_355/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/nokei/97/4/97_355/_article/-char/ja/"}, {"source": "jstage", "source_id": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_361/_article/-char/ja/", "title": "稲作農家のリスク態度に関連する社会・経済・気象要因", "authors": "広瀬 知弘", "abstract": "It is known that farmers’ attributes and exposure to extreme weather are related to risk attitudes, but former studies have used stated preferences, which are biased compared to revealed preferences. In this study, we extend the theoretical framework of the expected utility hypothesis to derive absolute risk aversion based on revealed preferences and propose a method to quantitatively derive the relationship between observable farmers’ and experience variables. The results of the empirical analysis show that exposure to sudden extreme weather increases risk aversion and that demographic variables and management characteristics have statistically significant relationships with risk attitudes.", "journal": "農業経済研究", "published": "2026-06-25", "url": "https://www.jstage.jst.go.jp/article/nokei/97/4/97_361/_article/-char/ja/", "fetched_at": "2026-09-03T17:50:51", "id": "jstage:https://www.jstage.jst.go.jp/article/nokei/97/4/97_361/_article/-char/ja/"}, {"source": "crossref", "source_id": "10.1093/erae/jbag012", "title": "Alternative Agricultural Carbon Border Adjustment and Climate Club Designs : a Quantitative Assessment", "authors": "Lærke Jensbye, Wusheng Yu, Francesco Clora", "abstract": "Abstract We analyze alternative agricultural carbon border adjustment mechanism (CBAM) designs across three dimensions (participating countries, emission intensity, and carbon price). We find that an agricultural CBAM by the European Union (or an expanded climate club consisting of the EU and other countries) has minor global agricultural GHG emission implications but protects the most emission intensive domestic production. Nevertheless, having a larger climate club imposing CBAM tariffs and applying exporters’ emission intensities are more effective in lowering global emissions. Compared to national carbon prices, harmonized carbon prices at climate club level can reduce trade disruptions while attaining similar emission reduction outcomes.", "journal": "European Review of Agricultural Economics", "published": "2026-06-24", "url": "https://doi.org/10.1093/erae/jbag012", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1093/erae/jbag012"}, {"source": "crossref", "source_id": "10.1002/aepp.70098", "title": "Promoting Healthier Drinking: Evidence From a Vignette Experiment on Contextual and Informational Drivers of Dealcoholized Wine Choices", "authors": "Giovanna Piracci, Giulia Maesano, Leonardo Casini, Maurizio Canavari, Marija Cerjak", "abstract": "ABSTRACT Growing demand for healthier beverages is driving innovation in the wine sector, with dealcoholized wine emerging as a promising alternative. However, little is known about the contextual conditions under which consumers would choose dealcoholized wine, particularly in countries with strong wine traditions. To fill this gap, this work examines how situational factors and information treatments influence consumers' willingness to switch from traditional to dealcoholized wine in Italy and Croatia, two countries with different wine consumption traditions. Using a vignette‐based experiment administered to 1600 wine consumers, this study analyses how consumption context and product information affect the likelihood of choosing dealcoholized wine over conventional alternatives. The results show that, although conventional wine remains the preferred option under standard conditions, the likelihood of switching to dealcoholized wine increases when a driving constraint is introduced. Informational treatments significantly affect choices in Italy, whereas Croatian consumers appear to respond more to functional constraints than to calorie or health messages. The findings have implications for producers and policymakers seeking to promote dealcoholized wines.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-06-24", "url": "https://doi.org/10.1002/aepp.70098", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70098"}, {"source": "crossref", "source_id": "10.1002/ajae.70086", "title": "When e‐commerce meets smallholders: Boosting incomes and widening gaps in rural China's anti‐poverty policy", "authors": "Wenqi Duan, Mingming Jiang, Jianhong Qi, Qing Shi", "abstract": "Abstract Lifting smallholder farmers out of poverty depends largely on boosting their agricultural operating incomes, a persistent challenge despite numerous efforts. This study evaluates the impact of China's “E‐Commerce into the Countryside” (ECC) program—the first and largest e‐commerce initiative in the developing world—on both the level and distribution of smallholders' farm earnings. Employing a quasi‐experimental design, we find that the ECC program significantly increases household per capita agricultural operating income. We show that this gain is driven by expanded market access through online sales, which facilitate income growth via three primary mechanisms: operational scale expansion, higher output prices, and a shift toward high‐value‐added crops. However, these benefits are unevenly distributed. The program also widens the income gap among smallholders, a disparity largely attributable to pre‐existing differences in human, productive, and digital capital. Our findings highlight that e‐commerce policies, while potent for income generation, require complementary measures to mitigate disparities that arise from heterogeneous initial endowments.", "journal": "American Journal of Agricultural Economics", "published": "2026-06-23", "url": "https://doi.org/10.1002/ajae.70086", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/ajae.70086"}, {"source": "crossref", "source_id": "10.1002/ajae.70085", "title": "School feeding, maternal empowerment, and household consumption", "authors": "Guanfu Fang, Tianyuan Luo, Benyu Qian", "abstract": "Abstract This paper examines the causal effects of a school feeding program on maternal empowerment and household consumption in rural China. Exploiting the staggered implementation of the Student Nutrition Improvement Program, we find that the program significantly reduces maternal time spent on housework, improves maternal labor market performance, and enhances maternal decision‐making power within nuclear households. The augmented bargaining power translates into shifts in household consumption toward female‐prioritized goods, including more nutritious foods, clothing, and housework‐related appliances. However, these positive effects on maternal empowerment are diminished in multigenerational families, where grandparents can assist with childcare responsibilities.", "journal": "American Journal of Agricultural Economics", "published": "2026-06-22", "url": "https://doi.org/10.1002/ajae.70085", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/ajae.70085"}, {"source": "crossref", "source_id": "10.1002/aepp.70091", "title": "How Lender Cost of Funds and Market Structure Shape Agricultural Interest Rates", "authors": "Noah Miller, Chad Fiechter, Jennifer Ifft, Blaine Nelson, Francisco Scott", "abstract": "ABSTRACT This paper investigates how lenders' costs of funds affect agricultural loan interest rates. We use a matched sample of US farm‐loan data and lender‐specific cost of funds, and a farm fixed effects design, to estimate pass‐through, conditioning on borrower characteristics. We find modest average pass‐through of funding costs to farm loan interest rates, with meaningful differences across lender types and local market conditions. Our findings suggest that borrower characteristics and common macroeconomic trends remain central to agricultural loan pricing, but lender business models and local credit market structure also shape how changes in funding costs affect farm borrowing costs.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-06-22", "url": "https://doi.org/10.1002/aepp.70091", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70091"}, {"source": "crossref", "source_id": "10.1002/aepp.70102", "title": "Chinese Trade Competition and Rural Mexican Migration", "authors": "Zachariah Rutledge, Joaquin Mayorga", "abstract": "ABSTRACT China's accession to the World Trade Organization in 2001 reshaped global trade, reducing U.S. demand for Mexican manufactured goods and weakening Mexico's manufacturing employment. This study estimates how this trade‐induced decline affected migration and employment decisions among rural Mexicans. Using individual‐level panel data from the Mexican National Rural Household Survey (ENHRUM) and a long‐difference framework, we instrument manufacturing employment with regional exposure to Chinese import competition. Results show that a 10‐percentage‐point decline in manufacturing employment increased the probability of U.S. migration by 24 percentage points and U.S. nonagricultural employment by 17 points, with no significant effects on agricultural employment.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-06-22", "url": "https://doi.org/10.1002/aepp.70102", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70102"}, {"source": "crossref", "source_id": "10.1002/aepp.70100", "title": "Keeping Pace or Falling Behind? The Depth of Latin American Trade Agreements", "authors": "Raphael Gomes da Silva, Fernanda Aparecida Silva, Lia Nogueira", "abstract": "ABSTRACT This article examines whether Latin American countries are keeping pace with global trends in trade agreement depth or falling behind. Using 681 agreements (1970–2019), we develop the Depth Index of Trade Agreements (DITA) to weight provisions endogenously through factor analysis based on co‐occurrence patterns. Results show that the Pacific Alliance and Central America lag one decade behind North American standards, whereas South America and the Caribbean lag by two to three decades. Partner selection is critical: countries negotiating extensively with developed partners tend to incorporate similar provisions into South–South agreements, suggesting North–South spillover effects. These findings suggest that regional lag reflects policy choices rather than inherent constraints.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-06-22", "url": "https://doi.org/10.1002/aepp.70100", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70100"}, {"source": "crossref", "source_id": "10.1002/aepp.70099", "title": "Hemp Cultivation and Crop Diversification: Implications for Ecosystem Services in Kentucky", "authors": "Yunsun Park, Seong D. Yun, Brandy E. Phipps, Tyler Mark, Craig Schluttenhofer", "abstract": "ABSTRACT This study examines the ecosystem benefits of expanding hemp cultivation by assessing its impact on crop diversity. Using scenario‐based simulations and fixed‐effect panel regressions with county‐level data in Kentucky, we find that increased hemp acreage tends to enhance crop diversity, improving water quality and bird diversity. While agricultural policies aimed at small‐scale farmers align with improving farm profitability, broader ecological benefits may remain limited unless they reach a sufficient scale. Our findings suggest that hemp‐induced crop diversification can generate measurable non‐market economic benefits through improvements in water quality and bird diversity, highlighting the need for practical and proactive policy measures that promote smallholder participation.", "journal": "Applied Economic Perspectives and Policy", "published": "2026-06-19", "url": "https://doi.org/10.1002/aepp.70099", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1002/aepp.70099"}, {"source": "crossref", "source_id": "10.1093/erae/jbag010", "title": "The relationship between pesticides and risk in apple production", "authors": "M Casati, L Arata, A Varacca, P Sckokai", "abstract": "Abstract We examine how pesticide expenditure relates to the probability distribution of yield and revenue per hectare in apple production in northern Italy. Using a flexible moment-based approach, we find that pesticide expenditure is negatively associated with downside risk in yield and revenue, whereas late frosts are positively associated with downside risk in yield. Sensitivity analyses show that mean-equation estimates are robust to unobserved confounders, while negative semi-variance models are less robust overall. Only the pesticide–expected outcome relationship appears plausibly causal. Therefore, conclusions about pesticides as risk-increasing or risk-decreasing inputs should be made with caution.", "journal": "European Review of Agricultural Economics", "published": "2026-06-17", "url": "https://doi.org/10.1093/erae/jbag010", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1093/erae/jbag010"}, {"source": "crossref", "source_id": "10.1111/agec.70128", "title": "Online Benefit Redemption and SNAP Participation: Evidence From the SNAP Online Purchasing Pilot", "authors": "Chaebeen Yoon, Xiaowei Zhang, Qingxiao Li", "abstract": "ABSTRACT The Supplemental Nutrition Assistance Program (SNAP) is the largest federal nutrition assistance program in the United States, yet many eligible households do not participate due to administrative burdens, stigma, and geographic access constraints. We examine whether the SNAP Online Purchasing Pilot (OPP), which allows beneficiaries to redeem benefits online, affects program participation. Using a difference‐in‐differences design with state‐level data from 2017 to 2021, we find that SNAP OPP increases program participation per capita by 13.7% (1.6 percentage points) and participation among individuals below the poverty line by 11.3% (11 percentage points). Event‐study estimates indicate effects emerge within three months and persist thereafter. Participation gains are larger in states with higher digital infrastructure (computer ownership and internet access) and greater vehicle access, indicating that online and physical access function as complements. States with higher shares of elderly residents and households with children also exhibit stronger responses. These findings suggest that enabling online benefit redemption can expand safety net access, though benefits vary systematically with local infrastructure and demographic composition.", "journal": "Agricultural Economics", "published": "2026-06-17", "url": "https://doi.org/10.1111/agec.70128", "fetched_at": "2026-09-03T17:50:51", "id": "crossref:10.1111/agec.70128"}, {"source": "crossref", "
